<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>MissAV 采集列表</title>
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@7.3.0/dist/turbo.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            padding-bottom: 80px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(145deg, #141414 0%, #1a1a1a 100%);
            border-radius: 32px;
            padding: 40px 28px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            min-height: 400px;
            transition: all 0.3s ease;
        }

        @media (min-width: 700px) {
            .app-container {
                max-width: 900px;
                padding: 50px 40px 40px;
                border-radius: 36px;
            }
            .gallery {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 14px;
            }
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 1100px;
                padding: 60px 50px 50px;
                border-radius: 40px;
            }
            .gallery {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 18px;
            }
        }

        .back-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 18px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .app-title {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: 6px;
            color: #fff;
        }

        .app-subtitle {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
            margin-bottom: 24px;
        }

        .mode-banner {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            color: rgba(255, 215, 0, 0.6);
            text-align: center;
            font-weight: 300;
        }

        .mode-banner.developer {
            background: rgba(0, 200, 255, 0.06);
            border-color: rgba(0, 200, 255, 0.1);
            color: rgba(0, 200, 255, 0.5);
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
        }

        .item:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .media-wrap {
            position: relative;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        .media-wrap img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .media-wrap .cover-fallback {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            font-weight: 300;
        }

        .item-info {
            padding: 8px 10px;
        }

        .item-title {
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 2px;
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 6px;
        }

        .item-actions button {
            padding: 5px 0;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
            border: 0;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
        }

        .item-actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .item-actions button:active {
            transform: scale(0.96);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            padding: 50px 20px 40px;
            font-size: 14px;
            font-weight: 300;
            line-height: 2;
        }

        .empty-state .empty-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 10px;
        }
        .empty-state .empty-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.1);
        }

        .dev-signature {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 32px;
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        @media (max-width: 420px) {
            .app-container {
                padding: 28px 18px 22px;
                border-radius: 24px;
            }
            .app-title {
                font-size: 22px;
            }
            .gallery {
                gap: 6px;
            }
            .item-actions button {
                font-size: 9px;
                padding: 4px 0;
            }
        }

        @media (max-width: 360px) {
            .app-container {
                padding: 20px 12px 16px;
                border-radius: 20px;
            }
            .item-actions button {
                font-size: 8px;
                padding: 3px 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <span class="back-link" id="backToHome">‹ 返回首页</span>

        <div class="app-title">🎬 MissAV 采集列表</div>
        <div class="app-subtitle">油猴脚本采集的影片会出现在这里</div>

        <div id="modeBanner"></div>

        <div class="gallery" id="gallery">
            <div class="empty-state">⏳ 加载中...</div>
        </div>

        <div class="dev-signature">开发者：浮生若夢</div>
    </div>

    <script>
        // ============================================================
        // MissAV 采集列表（Turbo Drive 兼容）
        // ============================================================

        const API_BASE = '/api/missav';
        const STORAGE_KEY = 'missav_items';

        function $(id) { return document.getElementById(id); }

        function getMode() {
            return localStorage.getItem('userMode') || 'guest';
        }

        function renderItems(items) {
            const gallery = $('gallery');

            if (!items || items.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-icon">📭</span>
                        暂无采集数据
                        <div class="empty-hint">请安装油猴脚本，访问 MissAV 影片详情页自动采集</div>
                    </div>
                `;
                return;
            }

            gallery.innerHTML = '';

            items.forEach(function(item) {
                const wrapper = document.createElement('div');
                wrapper.className = 'item';

                // ---- 封面 ----
                const mediaWrap = document.createElement('div');
                mediaWrap.className = 'media-wrap';

                const img = document.createElement('img');
                img.loading = 'lazy';
                img.alt = item.title || '封面';
                img.src = item.cover_url || '';

                img.onerror = function() {
                    // 加载失败显示占位
                    this.style.display = 'none';
                    const fallback = document.createElement('div');
                    fallback.className = 'cover-fallback';
                    fallback.textContent = '🎬';
                    mediaWrap.appendChild(fallback);
                };

                mediaWrap.appendChild(img);
                wrapper.appendChild(mediaWrap);

                // ---- 信息 ----
                const info = document.createElement('div');
                info.className = 'item-info';

                const title = document.createElement('div');
                title.className = 'item-title';
                title.textContent = item.title || '未知标题';
                info.appendChild(title);

                const meta = document.createElement('div');
                meta.className = 'item-meta';
                const parts = [];
                if (item.video_id) parts.push(item.video_id);
                if (item.publish_date) parts.push(item.publish_date);
                meta.textContent = parts.join(' · ') || '—';
                info.appendChild(meta);

                // ---- 操作按钮 ----
                const actions = document.createElement('div');
                actions.className = 'item-actions';

                const copyBtn = document.createElement('button');
                copyBtn.textContent = '📋 M3U8';
                copyBtn.addEventListener('click', function() {
                    const url = item.m3u8_url || '';
                    if (!url) {
                        alert('没有 M3U8 地址');
                        return;
                    }
                    navigator.clipboard.writeText(url).then(function() {
                        copyBtn.textContent = '✅ 已复制';
                        setTimeout(function() {
                            copyBtn.textContent = '📋 M3U8';
                        }, 1500);
                    }).catch(function() {
                        // fallback
                        const textarea = document.createElement('textarea');
                        textarea.value = url;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        copyBtn.textContent = '✅ 已复制';
                        setTimeout(function() {
                            copyBtn.textContent = '📋 M3U8';
                        }, 1500);
                    });
                });
                actions.appendChild(copyBtn);

                const openBtn = document.createElement('button');
                openBtn.textContent = '🔗 原页';
                openBtn.addEventListener('click', function() {
                    if (item.video_id) {
                        window.open('https://missav.com/watch/' + item.video_id, '_blank');
                    } else if (item.url) {
                        window.open(item.url, '_blank');
                    } else {
                        alert('没有原页地址');
                    }
                });
                actions.appendChild(openBtn);

                info.appendChild(actions);
                wrapper.appendChild(info);

                gallery.appendChild(wrapper);
            });
        }

        function loadData() {
            const mode = getMode();
            const banner = $('modeBanner');
            const gallery = $('gallery');

            // 先显示加载状态
            gallery.innerHTML = '<div class="empty-state">⏳ 加载中...</div>';

            if (mode === 'developer') {
                // ---- 开发者模式：从云端拉取 ----
                banner.innerHTML = `
                    <div class="mode-banner developer">
                        🔒 开发者模式 · 数据存储在云端
                    </div>
                `;

                fetch(API_BASE + '/my-items', {
                    credentials: 'include'
                })
                .then(function(res) {
                    if (!res.ok) throw new Error('网络响应异常');
                    return res.json();
                })
                .then(function(data) {
                    if (data.ok && data.items) {
                        renderItems(data.items);
                    } else {
                        renderItems([]);
                    }
                })
                .catch(function(err) {
                    console.error('[MissAV] 加载云端数据失败:', err);
                    renderItems([]);
                });
            } else {
                // ---- 访客模式：从 localStorage 读取 ----
                banner.innerHTML = `
                    <div class="mode-banner">
                        📌 访客模式 · 数据仅保存在本地浏览器
                    </div>
                `;

                let items = [];
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        items = JSON.parse(raw);
                    }
                } catch (e) {
                    console.error('[MissAV] 读取 localStorage 失败:', e);
                }
                renderItems(items);
            }
        }

        // ============================================================
        // 全局函数：供油猴脚本调用（保存采集数据）
        // ============================================================

        window.saveMissavItem = function(item) {
            const mode = getMode();

            if (mode === 'developer') {
                // ---- 开发者模式：调用后端 API ----
                return fetch(API_BASE + '/collect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(item),
                    credentials: 'include'
                })
                .then(function(res) {
                    if (!res.ok) {
                        return res.json().then(function(errData) {
                            throw new Error(errData.detail || '存储失败');
                        });
                    }
                    return res.json();
                })
                .then(function(data) {
                    if (data.ok) {
                        // 刷新列表
                        loadData();
                        return { ok: true, stored: true };
                    } else {
                        throw new Error(data.message || '存储失败');
                    }
                });
            } else {
                // ---- 访客模式：存入 localStorage ----
                let items = [];
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        items = JSON.parse(raw);
                    }
                } catch (e) {
                    // ignore
                }

                // 去重：如果已存在相同 video_id，更新它
                const existingIndex = items.findIndex(function(i) {
                    return i.video_id === item.video_id;
                });

                if (existingIndex !== -1) {
                    items[existingIndex] = item;
                } else {
                    items.unshift(item); // 最新在上面
                }

                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
                } catch (e) {
                    return Promise.reject(new Error('localStorage 写入失败: ' + e.message));
                }

                // 刷新列表
                loadData();
                return Promise.resolve({ ok: true, stored: false });
            }
        };

        // ============================================================
        // 返回首页
        // ============================================================

        $('backToHome').addEventListener('click', function() {
            window.location.href = '/';
        });

        // ============================================================
        // 初始化（Turbo 兼容）
        // ============================================================

        function initApp() {
            loadData();
            console.log('🎬 MissAV 采集列表已加载');
            console.log('  当前模式:', getMode());
            console.log('  调用 window.saveMissavItem(item) 可存入数据');
        }

        document.addEventListener('turbo:load', initApp);
        document.addEventListener('DOMContentLoaded', initApp);
    </script>

</body>
</html>
