<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Jable 下载器</title>
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@7.3.0/dist/turbo.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a0a; color:#fff; font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:20px; padding-bottom:80px; }
        .hidden { display:none !important; }
        .app-container { width:100%; max-width:480px; margin:0 auto; background:linear-gradient(145deg,#141414 0%,#1a1a1a 100%); border-radius:32px; padding:40px 28px 30px; box-shadow:0 20px 60px rgba(0,0,0,0.8); min-height:560px; transition:all 0.3s ease; }
        @media (min-width:700px) { .app-container { max-width:900px; padding:50px 40px 40px; border-radius:36px; } .gallery { grid-template-columns:repeat(4,1fr) !important; gap:14px; } }
        @media (min-width:1024px) { .app-container { max-width:1100px; padding:60px 50px 50px; border-radius:40px; } .gallery { grid-template-columns:repeat(4,1fr) !important; gap:18px; } }
        @media (max-width:420px) { .app-container { padding:28px 18px 22px; border-radius:24px; } .gallery { gap:6px; } .item-actions button { font-size:9px; padding:4px 0; } }
        @media (max-width:360px) { .app-container { padding:20px 12px 16px; border-radius:20px; } .item-actions button { font-size:8px; padding:3px 0; } }
        .back-link { display:inline-block; color:rgba(255,255,255,0.4); font-size:14px; text-decoration:none; margin-bottom:18px; cursor:pointer; transition:color 0.2s; }
        .back-link:hover { color:rgba(255,255,255,0.7); }
        .app-title { font-size:26px; font-weight:600; letter-spacing:-0.5px; text-align:center; margin-bottom:4px; color:#fff; }
        .app-subtitle { text-align:center; font-size:13px; color:rgba(255,255,255,0.3); font-weight:300; margin-bottom:20px; }
        .mode-banner { background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.15); border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:12px; color:rgba(255,215,0,0.6); text-align:center; font-weight:300; }
        .mode-banner.developer { background:rgba(0,200,255,0.06); border-color:rgba(0,200,255,0.1); color:rgba(0,200,255,0.5); }
        .tab-bar { display:flex; gap:4px; background:rgba(255,255,255,0.04); border-radius:10px; padding:4px; margin-bottom:20px; }
        .tab-btn { flex:1; padding:10px 0; border:0; border-radius:8px; font-size:14px; font-weight:450; cursor:pointer; font-family:inherit; transition:all 0.25s; background:transparent; color:rgba(255,255,255,0.4); }
        .tab-btn.active { background:rgba(255,255,255,0.08); color:#fff; }
        .tab-btn:hover { color:rgba(255,255,255,0.7); }
        .tab-content { display:none; animation:fadeIn 0.3s ease; }
        .tab-content.active { display:block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        .search-label { font-size:13px; color:rgba(255,255,255,0.4); font-weight:300; margin-bottom:6px; display:block; }
        .search-row { display:flex; gap:10px; align-items:center; }
        .search-row input { flex:1; background:transparent; border:0; border-bottom:1px solid rgba(255,255,255,0.12); padding:10px 0 8px; font-size:16px; color:#fff; outline:none; transition:border-color 0.25s; font-family:inherit; }
        .search-row input::placeholder { color:rgba(255,255,255,0.2); font-weight:300; }
        .search-row input:focus { border-bottom-color:rgba(255,255,255,0.5); }
        .search-row .search-btn-icon { background:transparent; border:0; color:rgba(255,255,255,0.4); font-size:20px; cursor:pointer; padding:6px 4px 6px 10px; transition:color 0.2s; }
        .search-row .search-btn-icon:hover { color:rgba(255,255,255,0.7); }
        .source-filter { margin-top:12px; margin-bottom:6px; }
        .source-filter .option-row { display:flex; gap:6px; flex-wrap:wrap; }
        .source-filter .option-btn { background:transparent; border:1px solid rgba(255,255,255,0.08); color:rgba(255,255,255,0.4); padding:6px 14px; border-radius:20px; font-size:12px; cursor:pointer; transition:all 0.2s; font-family:inherit; font-weight:300; }
        .source-filter .option-btn:hover { border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.6); }
        .source-filter .option-btn.active { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.2); color:#fff; }
        .primary-btn { width:100%; padding:14px 0; background:#fff; color:#0a0a0a; border:0; border-radius:12px; font-size:16px; font-weight:500; cursor:pointer; transition:all 0.2s; font-family:inherit; margin-top:18px; }
        .primary-btn:hover { opacity:0.85; transform:scale(0.98); }
        .primary-btn:disabled { opacity:0.3; cursor:default; transform:none; }
        .status-box { margin-top:14px; padding:12px 14px; border-radius:10px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04); font-size:13px; color:rgba(255,255,255,0.5); font-weight:300; line-height:1.6; min-height:20px; }
        .status-box.error { color:#ff6b6b; border-color:rgba(255,107,107,0.15); background:rgba(255,107,107,0.04); }
        .status-box.loading { color:#ffd93d; border-color:rgba(255,217,61,0.15); background:rgba(255,217,61,0.04); }
        .status-box.success { color:#4caf50; border-color:rgba(76,175,80,0.15); background:rgba(76,175,80,0.04); }
        .result-header { display:flex; justify-content:space-between; align-items:center; margin-top:18px; margin-bottom:12px; }
        .result-title { font-size:15px; font-weight:450; color:#fff; }
        .result-count { font-size:12px; color:rgba(255,255,255,0.25); font-weight:300; }
        .gallery { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .item { background:rgba(255,255,255,0.04); border-radius:10px; overflow:hidden; border:1px solid rgba(255,255,255,0.04); transition:all 0.2s; }
        .media-wrap { position:relative; width:100%; background:rgba(255,255,255,0.03); overflow:hidden; }
        .media-wrap img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; cursor:pointer; }
        .media-error { width:100%; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.2); font-size:12px; text-align:center; padding:12px; font-weight:300; }
        .item-info { padding:8px 10px; }
        .item-title { font-size:12px; font-weight:400; color:rgba(255,255,255,0.7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .item-code { font-size:11px; color:rgba(255,255,255,0.3); margin-top:2px; font-weight:300; }
        .item-actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin-top:6px; }
        .item-actions button { padding:5px 0; border-radius:6px; font-size:10px; cursor:pointer; font-family:inherit; border:0; transition:all 0.2s; }
        .item-actions .btn-view { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); }
        .item-actions .btn-view:hover { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.7); }
        .item-actions .btn-collect { background:rgba(255,215,0,0.08); color:rgba(255,215,0,0.5); }
        .item-actions .btn-collect:hover { background:rgba(255,215,0,0.15); color:rgba(255,215,0,0.8); }
        .item-actions .btn-collect.collected { background:rgba(76,175,80,0.08); color:rgba(76,175,80,0.5); }
        .item-actions .btn-original { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); }
        .item-actions .btn-original:hover { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.7); }
        .modal-overlay { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.95); display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
        .modal-overlay.hidden { display:none !important; }
        .modal-top { min-height:54px; padding:10px 16px 0; display:flex; align-items:center; justify-content:flex-end; }
        .modal-close { background:rgba(255,255,255,0.08); border:0; color:rgba(255,255,255,0.5); border-radius:16px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; transition:all 0.2s; font-weight:300; }
        .modal-close:hover { background:rgba(255,255,255,0.15); color:#fff; }
        .modal-content { flex:1; display:flex; flex-direction:column; align-items:center; padding:12px 16px; overflow-y:auto; gap:16px; }
        .modal-content .modal-cover { width:100%; max-width:400px; border-radius:10px; overflow:hidden; background:rgba(255,255,255,0.03); flex-shrink:0; }
        .modal-content .modal-cover img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; }
        .modal-content .modal-cover .cover-fallback { width:100%; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.15); font-size:48px; background:rgba(255,255,255,0.03); }
        .modal-content .modal-info { width:100%; max-width:400px; color:rgba(255,255,255,0.7); font-size:14px; font-weight:300; line-height:1.8; }
        .modal-content .modal-info .mi-title { font-size:18px; font-weight:500; color:#fff; margin-bottom:6px; line-height:1.4; }
        .modal-content .modal-info .mi-code { font-size:16px; color:rgba(255,255,255,0.8); font-weight:500; }
        .modal-content .modal-info .mi-actress { font-size:14px; color:rgba(255,255,255,0.6); }
        .modal-content .modal-info .mi-duration { font-size:14px; color:rgba(255,255,255,0.4); }
        .modal-content .modal-info .mi-desc { font-size:13px; color:rgba(255,255,255,0.3); margin-top:4px; line-height:1.6; }
        .modal-bottom { padding:10px 16px 16px; display:flex; gap:10px; max-width:400px; width:100%; margin:0 auto; }
        .modal-bottom button { flex:1; padding:12px 0; border:0; border-radius:10px; font-size:14px; font-weight:450; cursor:pointer; font-family:inherit; transition:all 0.2s; }
        .modal-bottom .modal-download { background:#fff; color:#0a0a0a; opacity:0.5; cursor:not-allowed; }
        .modal-bottom .modal-download:not(:disabled) { opacity:1; cursor:pointer; }
        .modal-bottom .modal-download:hover:not(:disabled) { opacity:0.85; }
        .modal-bottom .modal-preview { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.6); }
        .modal-bottom .modal-preview:hover { background:rgba(255,255,255,0.15); color:#fff; }
        .dev-signature { text-align:center; font-size:12px; color:rgba(255,255,255,0.15); margin-top:32px; letter-spacing:0.5px; font-weight:300; }
        .empty-state { grid-column:1/-1; text-align:center; color:rgba(255,255,255,0.2); padding:40px 20px; font-size:14px; font-weight:300; line-height:2; }
        .empty-state .empty-icon { font-size:36px; display:block; margin-bottom:10px; }
        .loader { text-align:center; color:rgba(255,255,255,0.3); padding:40px 20px; font-size:14px; font-weight:300; }
    </style>
</head>
<body>

<div class="app-container">
    <span class="back-link" id="backToHome">‹ 返回首页</span>

    <div class="app-title">🎬 Jable 下载器</div>
    <div class="app-subtitle">搜索 · 收藏 · 预览</div>

    <div id="modeBanner"></div>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="search">🔍 搜索</button>
        <button class="tab-btn" data-tab="collection">📦 我的收藏</button>
    </div>

    <div class="tab-content active" id="tabSearch">
        <div class="search-section">
            <label class="search-label">搜索 Jable / HohoJ / MissAV</label>
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="番号如 SSIS-005 或 演员名" autocomplete="off" autocapitalize="off" spellcheck="false">
                <button class="search-btn-icon" id="searchBtn">⌕</button>
            </div>

            <!-- 数据源筛选器（新增 MissAV） -->
            <div class="source-filter">
                <label class="search-label" style="margin-bottom:4px;">数据源</label>
                <div class="option-row" data-group="datasource">
                    <button class="option-btn active" data-value="jable">Jable</button>
                    <button class="option-btn" data-value="hohoj">HoHoJ</button>
                    <button class="option-btn" data-value="missav">MissAV</button>
                </div>
            </div>

            <button class="primary-btn" id="searchSubmitBtn">搜索影片</button>
            <div class="status-box hidden" id="searchStatus"></div>

            <div class="result-header hidden" id="resultHeader">
                <span class="result-title" id="resultTitle">搜索结果</span>
                <span class="result-count" id="resultCount"></span>
            </div>
            <div class="gallery" id="searchGallery"></div>
        </div>
    </div>

    <div class="tab-content" id="tabCollection">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <span style="font-size:12px;color:rgba(255,255,255,0.25);font-weight:300;" id="collectionCount">共 0 个</span>
            <button style="background:transparent;border:0;color:rgba(255,255,255,0.2);font-size:12px;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:6px;transition:all 0.2s;" id="refreshCollectionBtn">刷新</button>
        </div>
        <div class="gallery" id="collectionGallery"></div>
    </div>

    <div class="dev-signature">开发者：浮生若夢</div>
</div>

<div class="modal-overlay hidden" id="modal">
    <div class="modal-top">
        <span style="color:rgba(255,255,255,0.2);font-size:13px;font-weight:300;" id="modalTitle">影片详情</span>
        <button class="modal-close" id="modalCloseBtn">关闭</button>
    </div>
    <div class="modal-content" id="modalContent"></div>
    <div class="modal-bottom">
        <button class="modal-download" id="modalDownloadBtn" disabled style="opacity:0.5;cursor:not-allowed;">下载视频（暂不可用）</button>
        <button class="modal-preview" id="modalPreviewBtn">▶ 预览视频</button>
    </div>
</div>

<script>
    // ============================================================
    // Jable 下载器（三数据源：Jable / HohoJ / MissAV）
    // ============================================================

    const API_BASE = '/api/jable';
    const STORAGE_KEY = 'jable_items';

    let currentItem = null;
    let currentSource = 'jable';

    function $(id) { return document.getElementById(id); }

    function getMode() {
        return localStorage.getItem('userMode') || 'guest';
    }

    function updateModeBanner() {
        const mode = getMode();
        const banner = $('modeBanner');
        if (mode === 'developer') {
            banner.innerHTML = `<div class="mode-banner developer">🔒 开发者模式 · 数据存储在云端</div>`;
        } else {
            banner.innerHTML = `<div class="mode-banner">📌 访客模式 · 数据仅保存在本地浏览器</div>`;
        }
    }

    // ---- Tab 切换 ----
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            const target = this.dataset.tab;
            document.querySelectorAll('.tab-content').forEach(function(tc) { tc.classList.remove('active'); });
            if (target === 'search') {
                $('tabSearch').classList.add('active');
            } else {
                $('tabCollection').classList.add('active');
                loadCollection();
            }
        });
    });

    // ---- 数据源切换（已包含 missav） ----
    document.querySelectorAll('[data-group="datasource"] .option-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('[data-group="datasource"] .option-btn').forEach(function(b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            currentSource = btn.dataset.value;
            console.log('[数据源] 切换到:', currentSource);
            const input = $('searchInput');
            if (input.value.trim()) {
                performSearch();
            }
        });
    });

    function showStatus(el, msg, type) {
        type = type || '';
        el.classList.remove('hidden');
        el.textContent = msg;
        el.className = 'status-box' + (type === 'error' ? ' error' : type === 'loading' ? ' loading' : type === 'success' ? ' success' : '');
    }

    function hideStatus(el) {
        el.classList.add('hidden');
        el.textContent = '';
        el.className = 'status-box';
    }

    // ---- 搜索 ----
    function performSearch() {
        const input = $('searchInput');
        const keyword = input.value.trim();
        if (!keyword) {
            showStatus($('searchStatus'), '请输入番号或演员名', 'error');
            return;
        }

        const submitBtn = $('searchSubmitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '搜索中…';
        showStatus($('searchStatus'), '正在搜索 ' + (currentSource === 'hohoj' ? 'HoHoJ' : currentSource === 'missav' ? 'MissAV' : 'Jable') + '…', 'loading');
        $('resultHeader').classList.add('hidden');
        $('searchGallery').innerHTML = '';

        fetch(API_BASE + '/search?q=' + encodeURIComponent(keyword) + '&source=' + currentSource)
            .then(res => {
                if (!res.ok) return res.json().then(data => { throw new Error(data.detail || '搜索失败'); });
                return res.json();
            })
            .then(data => {
                if (!data.ok) throw new Error(data.detail || '搜索失败');
                hideStatus($('searchStatus'));
                renderSearchResults(data);
            })
            .catch(err => {
                showStatus($('searchStatus'), err.message || '搜索失败，请稍后重试', 'error');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = '搜索影片';
            });
    }

    function renderSearchResults(data) {
        const gallery = $('searchGallery');
        const header = $('resultHeader');
        header.classList.remove('hidden');
        const sourceLabel = currentSource === 'hohoj' ? 'HoHoJ' : currentSource === 'missav' ? 'MissAV' : 'Jable';
        $('resultTitle').textContent = '搜索结果（' + sourceLabel + '）';
        $('resultCount').textContent = '找到 ' + data.count + ' 部影片';
        gallery.innerHTML = '';
        if (!data.items || data.items.length === 0) {
            gallery.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span>没有找到相关影片</div>';
            return;
        }
        data.items.forEach(function(item) {
            gallery.appendChild(createCard(item, 'search'));
        });
    }

    // ---- 卡片生成 ----
    function createCard(item, mode) {
        const wrapper = document.createElement('div');
        wrapper.className = 'item';

        const mediaWrap = document.createElement('div');
        mediaWrap.className = 'media-wrap';

        const img = document.createElement('img');
        img.src = item.cover || '';
        img.loading = 'lazy';
        img.alt = item.title || '';
        img.onerror = function() {
            const errDiv = document.createElement('div');
            errDiv.className = 'media-error';
            errDiv.textContent = '封面加载失败';
            img.replaceWith(errDiv);
        };

        img.addEventListener('click', function() {
            if (mode === 'collection') {
                openModal(item);
            } else {
                fetchDetail(item.id, currentSource);
            }
        });

        mediaWrap.appendChild(img);
        wrapper.appendChild(mediaWrap);

        const info = document.createElement('div');
        info.className = 'item-info';

        const title = document.createElement('div');
        title.className = 'item-title';
        title.textContent = item.title || '未知标题';
        info.appendChild(title);

        let codeDisplay = item.code || '';
        if (!codeDisplay && item.title) {
            const match = item.title.match(/^([A-Z]{2,6}-\d{3,5})/);
            if (match) codeDisplay = match[1];
        }
        const code = document.createElement('div');
        code.className = 'item-code';
        code.textContent = codeDisplay || item.id || '';
        info.appendChild(code);

        const actions = document.createElement('div');
        actions.className = 'item-actions';

        const viewBtn = document.createElement('button');
        viewBtn.className = 'btn-view';
        viewBtn.textContent = '📺 详情';
        viewBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (mode === 'collection') {
                openModal(item);
            } else {
                fetchDetail(item.id, currentSource);
            }
        });
        actions.appendChild(viewBtn);

        const collectBtn = document.createElement('button');
        collectBtn.className = 'btn-collect';
        collectBtn.textContent = mode === 'collection' ? '🗑️ 取消收藏' : '⭐ 收藏';
        collectBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (mode === 'collection') {
                deleteCollectItem(item.id, collectBtn, wrapper);
            } else {
                collectItem(item, collectBtn);
            }
        });
        actions.appendChild(collectBtn);

        const originBtn = document.createElement('button');
        originBtn.className = 'btn-original';
        originBtn.textContent = '🔗 原页';
        originBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (item.url) window.open(item.url, '_blank');
        });
        actions.appendChild(originBtn);

        info.appendChild(actions);
        wrapper.appendChild(info);

        if (mode === 'search') {
            checkIfCollected(item.id).then(function(isCollected) {
                if (isCollected) {
                    collectBtn.textContent = '✅ 已收藏';
                    collectBtn.className = 'btn-collect collected';
                }
            });
        }

        return wrapper;
    }

    // ---- 收藏相关（与之前完全一致） ----
    function checkIfCollected(videoId) {
        const mode = getMode();
        if (mode === 'developer') {
            return fetch(API_BASE + '/my-items', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.ok && data.items) {
                        return data.items.some(function(item) { return item.video_id === videoId; });
                    }
                    return false;
                })
                .catch(function() { return false; });
        } else {
            let items = [];
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) items = JSON.parse(raw);
            } catch (e) {}
            return Promise.resolve(items.some(function(item) { return item.video_id === videoId; }));
        }
    }

    function collectItem(item, btn) {
        fetch(API_BASE + '/info?video_id=' + encodeURIComponent(item.id) + '&source=' + currentSource)
            .then(res => res.json())
            .then(data => {
                if (data.ok && data.item) {
                    const detail = data.item;
                    const collectData = {
                        video_id: item.id,
                        title: detail.title || item.title,
                        code: detail.code || '',
                        actress: detail.actress || '',
                        cover_url: detail.cover || item.cover || '',
                        source_url: detail.url || item.url || '',
                        publish_date: detail.publish_date || '',
                        description: detail.description || '',
                        m3u8_url: detail.video_url || '',
                        source: currentSource,
                    };
                    return saveCollectItem(collectData);
                } else {
                    throw new Error('获取详情失败');
                }
            })
            .then(function(result) {
                if (result && result.ok) {
                    btn.textContent = '✅ 已收藏';
                    btn.className = 'btn-collect collected';
                    if ($('tabCollection').classList.contains('active')) {
                        loadCollection();
                    }
                } else {
                    alert('收藏失败：' + (result.message || '未知错误'));
                }
            })
            .catch(function(err) {
                alert('收藏失败：' + err.message);
            });
    }

    function deleteCollectItem(videoId, btn, wrapper) {
        if (!confirm('确定要取消收藏吗？')) return;
        const mode = getMode();
        if (mode === 'developer') {
            fetch(API_BASE + '/collect/' + encodeURIComponent(videoId), {
                method: 'DELETE',
                credentials: 'include'
            })
            .then(res => {
                if (!res.ok) return res.json().then(data => { throw new Error(data.detail || '删除失败'); });
                return res.json();
            })
            .then(data => {
                if (data.ok) {
                    wrapper.remove();
                    loadCollection();
                } else {
                    alert('删除失败：' + (data.message || '未知错误'));
                }
            })
            .catch(err => {
                alert('删除失败：' + err.message);
            });
        } else {
            let items = [];
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) items = JSON.parse(raw);
            } catch (e) {}
            items = items.filter(function(i) { return i.video_id !== videoId; });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            wrapper.remove();
            loadCollection();
        }
    }

    function saveCollectItem(data) {
        const mode = getMode();
        if (mode === 'developer') {
            return fetch(API_BASE + '/collect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
                credentials: 'include'
            })
            .then(res => res.json())
            .then(res => {
                if (res.ok) {
                    return { ok: true };
                } else {
                    throw new Error(res.detail || '存储失败');
                }
            });
        } else {
            let items = [];
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) items = JSON.parse(raw);
            } catch (e) {}
            const idx = items.findIndex(function(i) { return i.video_id === data.video_id; });
            if (idx >= 0) {
                items[idx] = data;
            } else {
                items.unshift(data);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            return Promise.resolve({ ok: true });
        }
    }

    function loadCollection() {
        const gallery = $('collectionGallery');
        const count = $('collectionCount');
        gallery.innerHTML = '<div class="loader">加载中...</div>';

        const mode = getMode();
        if (mode === 'developer') {
            fetch(API_BASE + '/my-items', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.ok && data.items) {
                        renderCollection(data.items);
                    } else {
                        renderCollection([]);
                    }
                })
                .catch(function() {
                    renderCollection([]);
                });
        } else {
            let items = [];
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) items = JSON.parse(raw);
            } catch (e) {}
            renderCollection(items);
        }
    }

    function renderCollection(items) {
        const gallery = $('collectionGallery');
        const count = $('collectionCount');
        count.textContent = '共 ' + items.length + ' 个';

        if (!items || items.length === 0) {
            gallery.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span>暂无收藏</div>';
            return;
        }

        gallery.innerHTML = '';
        items.forEach(function(item) {
            const cardData = {
                id: item.video_id,
                title: item.title,
                cover: item.cover_url,
                url: item.source_url,
                code: item.code || '',
                actress: item.actress,
                duration: item.duration,
                publish_date: item.publish_date,
                description: item.description,
                source: item.source || 'jable',
                video_url: item.m3u8_url || ''
            };
            gallery.appendChild(createCard(cardData, 'collection'));
        });
    }

    function fetchDetail(videoId, source) {
        source = source || currentSource;
        const status = $('searchStatus');
        showStatus(status, '正在获取影片信息…', 'loading');
        fetch(API_BASE + '/info?video_id=' + encodeURIComponent(videoId) + '&source=' + source)
            .then(res => res.json())
            .then(data => {
                if (data.ok && data.item) {
                    hideStatus(status);
                    openModal(data.item);
                } else {
                    throw new Error(data.detail || '获取详情失败');
                }
            })
            .catch(err => {
                showStatus(status, '加载详情失败：' + err.message, 'error');
            });
    }

    function openModal(item) {
        currentItem = item;
        const modal = $('modal');
        const content = $('modalContent');
        const title = $('modalTitle');
        title.textContent = item.code || item.id || '影片详情';
        content.innerHTML = '';

        const coverDiv = document.createElement('div');
        coverDiv.className = 'modal-cover';
        const img = document.createElement('img');
        img.src = item.cover || '';
        img.alt = item.title || '封面';
        img.onerror = function() {
            this.style.display = 'none';
            const fallback = document.createElement('div');
            fallback.className = 'cover-fallback';
            fallback.textContent = '🎬';
            coverDiv.appendChild(fallback);
        };
        coverDiv.appendChild(img);
        content.appendChild(coverDiv);

        const infoDiv = document.createElement('div');
        infoDiv.className = 'modal-info';
        let infoHTML = '';
        infoHTML += `<div class="mi-title">${item.title || '未知标题'}</div>`;
        if (item.code) infoHTML += `<div class="mi-code">番号：${item.code}</div>`;
        let actressDisplay = item.actress || '';
        actressDisplay = actressDisplay.replace(/^按女優\s*/, '').trim();
        if (actressDisplay) infoHTML += `<div class="mi-actress">出演：${actressDisplay}</div>`;
        if (item.duration) infoHTML += `<div class="mi-duration">时长：${item.duration}</div>`;
        if (item.publish_date) infoHTML += `<div class="mi-duration">发行：${item.publish_date}</div>`;
        if (item.description && !item.description.includes("免費高清AV在線看")) {
            infoHTML += `<div class="mi-desc">${item.description}</div>`;
        }
        if (item.source) {
            infoHTML += `<div style="font-size:11px;color:rgba(255,255,255,0.2);margin-top:4px;">来源：${item.source === 'hohoj' ? 'HoHoJ' : item.source === 'missav' ? 'MissAV' : 'Jable'}</div>`;
        }
        infoDiv.innerHTML = infoHTML;
        content.appendChild(infoDiv);

        const downloadBtn = $('modalDownloadBtn');
        downloadBtn.disabled = true;
        downloadBtn.textContent = '下载视频（暂不可用）';
        downloadBtn.style.opacity = '0.5';
        downloadBtn.style.cursor = 'not-allowed';

        const previewBtn = $('modalPreviewBtn');
        previewBtn.replaceWith(previewBtn.cloneNode(true));
        const newPreviewBtn = $('modalPreviewBtn');
        newPreviewBtn.textContent = '▶ 预览视频';
        newPreviewBtn.addEventListener('click', function() {
            playVideo(currentItem);
        });

        modal.classList.remove('hidden');
    }

    function playVideo(item) {
        if (!item) return;
        const url = item.video_url;
        if (url) {
            insertVideoAndPlay(url);
        } else {
            const status = $('searchStatus');
            showStatus(status, '正在获取视频地址…', 'loading');
            fetch(API_BASE + '/info?video_id=' + encodeURIComponent(item.id) + '&source=' + (item.source || currentSource))
                .then(res => res.json())
                .then(data => {
                    if (data.ok && data.item) {
                        hideStatus(status);
                        currentItem = data.item;
                        const existingVideo = document.querySelector('#modalContent video');
                        if (existingVideo) {
                            existingVideo.src = data.item.video_url;
                            existingVideo.load();
                            existingVideo.play().catch(e => console.log('播放失败', e));
                        } else {
                            insertVideoAndPlay(data.item.video_url);
                        }
                        const previewBtn = $('modalPreviewBtn');
                        if (previewBtn) previewBtn.textContent = '▶ 刷新视频';
                    } else {
                        throw new Error(data.detail || '获取视频地址失败');
                    }
                })
                .catch(err => {
                    showStatus(status, '获取视频失败：' + err.message, 'error');
                });
        }
    }

    function insertVideoAndPlay(url) {
        const modalContent = $('modalContent');
        const oldVideo = modalContent.querySelector('video');
        if (oldVideo) oldVideo.remove();

        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.style.cssText = 'width:100%;max-height:60vh;background:#000;border-radius:8px;';
        video.src = url;
        const infoDiv = modalContent.querySelector('.modal-info');
        if (infoDiv) {
            modalContent.insertBefore(video, infoDiv.nextSibling);
        } else {
            modalContent.appendChild(video);
        }
        video.play().catch(e => console.log('自动播放被阻止'));
        const previewBtn = $('modalPreviewBtn');
        if (previewBtn) previewBtn.textContent = '▶ 刷新视频';
    }

    function closeModal() {
        $('modal').classList.add('hidden');
        $('modalContent').innerHTML = '';
        currentItem = null;
    }

    $('searchBtn').addEventListener('click', performSearch);
    $('searchSubmitBtn').addEventListener('click', performSearch);
    $('searchInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') performSearch();
    });

    $('modalCloseBtn').addEventListener('click', closeModal);
    $('modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    $('backToHome').addEventListener('click', function() {
        window.location.href = '/';
    });

    $('refreshCollectionBtn').addEventListener('click', loadCollection);

    function initApp() {
        updateModeBanner();
        $('tabSearch').classList.add('active');
        $('tabCollection').classList.remove('active');
        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.classList.remove('active');
            if (btn.dataset.tab === 'search') btn.classList.add('active');
        });
        console.log('🎬 Jable 下载器已加载（三数据源：Jable + HoHoJ + MissAV）');
        console.log('当前数据源：' + currentSource);
    }

    document.addEventListener('turbo:load', initApp);
    document.addEventListener('DOMContentLoaded', initApp);

    window.saveMissavItem = function(data) {
        const item = {
            video_id: data.video_id || data.id || '',
            title: data.title || '',
            code: data.code || '',
            actress: data.actress || '',
            cover_url: data.cover_url || data.cover || '',
            source_url: data.source_url || data.url || '',
            publish_date: data.publish_date || '',
            description: data.description || '',
            duration: data.duration || '',
            source: data.source || 'jable',
            m3u8_url: data.m3u8_url || ''
        };
        return saveCollectItem(item);
    };
</script>

</body>
