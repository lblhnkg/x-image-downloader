<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>MissAV 电影下载器</title>
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@7.3.0/dist/turbo.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(145deg, #141414 0%, #1a1a1a 100%);
            border-radius: 28px;
            padding: 32px 20px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        @media (min-width: 700px) {
            .app-container {
                max-width: 900px;
                padding: 40px 36px;
                border-radius: 36px;
            }
            .gallery {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 14px;
            }
        }

        @media (max-width: 420px) {
            .app-container {
                padding: 20px 14px;
                border-radius: 20px;
            }
        }

        .back-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .app-title {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: 4px;
            color: #fff;
        }
        .app-subtitle {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
            margin-bottom: 20px;
        }

        /* ---- 状态提示 ---- */
        .status-banner {
            background: rgba(76, 175, 80, 0.06);
            border: 1px solid rgba(76, 175, 80, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-banner .icon {
            font-size: 18px;
        }
        .status-banner .text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ---- 搜索 ---- */
        .search-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            margin-bottom: 6px;
            display: block;
        }
        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-row input {
            flex: 1;
            background: transparent;
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 0 8px;
            font-size: 16px;
            color: #fff;
            outline: none;
            transition: border-color 0.25s;
            font-family: inherit;
        }
        .search-row input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }
        .search-row input:focus {
            border-bottom-color: rgba(255, 255, 255, 0.5);
        }
        .search-row .search-btn-icon {
            background: transparent;
            border: 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            cursor: pointer;
            padding: 6px 4px 6px 10px;
            transition: color 0.2s;
        }
        .search-row .search-btn-icon:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .primary-btn {
            width: 100%;
            padding: 14px 0;
            background: #fff;
            color: #0a0a0a;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin-top: 18px;
        }
        .primary-btn:hover {
            opacity: 0.85;
            transform: scale(0.98);
        }
        .primary-btn:disabled {
            opacity: 0.3;
            cursor: default;
            transform: none;
        }

        .status-box {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            line-height: 1.6;
            min-height: 20px;
        }
        .status-box.error {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.15);
            background: rgba(255, 107, 107, 0.04);
        }
        .status-box.loading {
            color: #ffd93d;
            border-color: rgba(255, 217, 61, 0.15);
            background: rgba(255, 217, 61, 0.04);
        }

        /* ---- 结果 ---- */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            margin-bottom: 12px;
        }
        .result-title {
            font-size: 15px;
            font-weight: 450;
            color: #fff;
        }
        .result-count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
        }
        .media-wrap {
            position: relative;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }
        .media-wrap img {
            display: block;
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            cursor: pointer;
        }
        .media-error {
            width: 100%;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            text-align: center;
            padding: 12px;
            font-weight: 300;
        }
        .video-badge {
            position: absolute;
            left: 8px;
            top: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .item-info {
            padding: 8px 10px;
        }
        .item-title {
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-code {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
            font-weight: 300;
        }
        .item-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            margin-top: 6px;
        }
        .item-actions button {
            padding: 5px 0;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
            border: 0;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
        }
        .item-actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        /* ---- Modal ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
        }
        .modal-overlay.hidden {
            display: none !important;
        }
        .modal-top {
            min-height: 54px;
            padding: 10px 16px 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .modal-close {
            background: rgba(255, 255, 255, 0.08);
            border: 0;
            color: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            font-weight: 300;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .modal-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            overflow: auto;
            flex-direction: column;
        }
        .modal-content video {
            max-width: 100%;
            max-height: 70vh;
        }
        .modal-content .modal-info {
            width: 100%;
            max-width: 600px;
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 300;
            line-height: 1.6;
        }
        .modal-content .modal-info .mi-title {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
        }
        .modal-content .modal-info .mi-code {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }
        .modal-content .modal-info .mi-actors {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }
        .modal-content .modal-info .mi-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 6px;
        }
        .modal-bottom {
            padding: 10px 16px 16px;
            display: flex;
            gap: 10px;
        }
        .modal-bottom button {
            flex: 1;
            padding: 12px 0;
            border: 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 450;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .modal-bottom .modal-download {
            background: #fff;
            color: #0a0a0a;
        }
        .modal-bottom .modal-download:hover {
            opacity: 0.85;
        }
        .modal-bottom .modal-original {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
        }
        .modal-bottom .modal-original:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .dev-signature {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 32px;
            letter-spacing: 0.5px;
            font-weight: 300;
        }
    </style>
</head>
<body>

<div class="app-container">
    <span class="back-link" id="backToHome">‹ 返回首页</span>

    <div class="app-title">🎬 MissAV 电影下载器</div>
    <div class="app-subtitle">输入番号或演员名，搜索并下载影片</div>

    <!-- ===== 状态提示（自动模式） ===== -->
    <div class="status-banner">
        <span class="icon">✅</span>
        <span class="text">自动抓取已启用，无需任何设置</span>
    </div>

    <!-- ===== 搜索区域 ===== -->
    <div class="search-section">
        <label class="search-label">搜索</label>
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="番号如 SSIS-001 或 演员名" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button class="search-btn-icon" id="searchBtn">⌕</button>
        </div>
        <button class="primary-btn" id="searchSubmitBtn">搜索影片</button>
        <div class="status-box hidden" id="searchStatus"></div>

        <div class="result-header hidden" id="resultHeader">
            <span class="result-title" id="resultTitle">搜索结果</span>
            <span class="result-count" id="resultCount"></span>
        </div>
        <div class="gallery" id="gallery"></div>
    </div>

    <div class="dev-signature">开发者：浮生若夢</div>
</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay hidden" id="modal">
    <div class="modal-top">
        <span style="color:rgba(255,255,255,0.2);font-size:13px;font-weight:300;" id="modalTitle">影片预览</span>
        <button class="modal-close" id="modalCloseBtn">关闭</button>
    </div>
    <div class="modal-content" id="modalContent"></div>
    <div class="modal-bottom">
        <button class="modal-download" id="modalDownloadBtn">下载视频</button>
        <button class="modal-original" id="modalOriginalBtn">打开原页</button>
    </div>
</div>

<script>
    // ============================================================
    // MissAV 下载器（自动模式，无 Cookie 操作）
    // 完全依赖后端 unofficial-api-for-missav 库
    // ============================================================

    let currentItem = null;
    const API_BASE = '/missav';

    function $(id) { return document.getElementById(id); }

    function initApp() {
        const searchInput = $('searchInput');
        const searchBtn = $('searchBtn');
        const searchSubmitBtn = $('searchSubmitBtn');
        const searchStatus = $('searchStatus');
        const resultHeader = $('resultHeader');
        const resultTitle = $('resultTitle');
        const resultCount = $('resultCount');
        const gallery = $('gallery');
        const modal = $('modal');
        const modalContent = $('modalContent');
        const modalTitle = $('modalTitle');
        const modalCloseBtn = $('modalCloseBtn');
        const modalDownloadBtn = $('modalDownloadBtn');
        const modalOriginalBtn = $('modalOriginalBtn');
        const backToHome = $('backToHome');

        function showStatus(msg, type) {
            type = type || '';
            searchStatus.classList.remove('hidden');
            searchStatus.textContent = msg;
            searchStatus.className = 'status-box' + (type === 'error' ? ' error' : type === 'loading' ? ' loading' :
                '');
        }

        function hideStatus() {
            searchStatus.classList.add('hidden');
            searchStatus.textContent = '';
            searchStatus.className = 'status-box';
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                showStatus('请输入番号或演员名', 'error');
                return;
            }

            searchSubmitBtn.disabled = true;
            searchSubmitBtn.textContent = '搜索中…';
            showStatus('正在搜索，请稍候…', 'loading');
            resultHeader.classList.add('hidden');
            gallery.innerHTML = '';

            fetch(API_BASE + '/search?q=' + encodeURIComponent(keyword))
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(data => { throw new Error(data.detail || '搜索失败'); });
                    }
                    return res.json();
                })
                .then(data => {
                    if (!data.ok) throw new Error(data.detail || '搜索失败');
                    hideStatus();
                    renderResults(data);
                })
                .catch(err => {
                    showStatus(err.message || '搜索失败，请稍后重试', 'error');
                })
                .finally(() => {
                    searchSubmitBtn.disabled = false;
                    searchSubmitBtn.textContent = '搜索影片';
                });
        }

        function renderResults(data) {
            resultHeader.classList.remove('hidden');
            resultTitle.textContent = '搜索结果';
            resultCount.textContent = '找到 ' + data.count + ' 部影片';
            gallery.innerHTML = '';

            if (!data.items || data.items.length === 0) {
                gallery.innerHTML =
                    '<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,0.2);padding:40px 0;font-size:14px;font-weight:300;">没有找到相关影片</div>';
                return;
            }

            data.items.forEach(item => {
                gallery.appendChild(createItem(item));
            });
        }

        function createItem(item) {
            const wrapper = document.createElement('div');
            wrapper.className = 'item';

            const mediaWrap = document.createElement('div');
            mediaWrap.className = 'media-wrap';

            const img = document.createElement('img');
            img.src = item.cover || '';
            img.loading = 'lazy';
            img.alt = item.title || '';
            img.onerror = function() {
                const errDiv = document.createElement('div');
                errDiv.className = 'media-error';
                errDiv.textContent = '封面加载失败';
                img.replaceWith(errDiv);
            };
            img.addEventListener('click', function() {
                fetchDetail(item.id);
            });

            mediaWrap.appendChild(img);

            const badge = document.createElement('div');
            badge.className = 'video-badge';
            badge.textContent = '🎬 视频';
            mediaWrap.appendChild(badge);

            wrapper.appendChild(mediaWrap);

            const info = document.createElement('div');
            info.className = 'item-info';

            const title = document.createElement('div');
            title.className = 'item-title';
            title.textContent = item.title || '未知标题';
            info.appendChild(title);

            const code = document.createElement('div');
            code.className = 'item-code';
            code.textContent = item.code || '';
            info.appendChild(code);

            const actions = document.createElement('div');
            actions.className = 'item-actions';

            const viewBtn = document.createElement('button');
            viewBtn.textContent = '详情';
            viewBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                fetchDetail(item.id);
            });
            actions.appendChild(viewBtn);

            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = '下载';
            downloadBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                fetchDetail(item.id, true);
            });
            actions.appendChild(downloadBtn);

            const originBtn = document.createElement('button');
            originBtn.textContent = '原页';
            originBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (item.url) window.open(item.url, '_blank');
            });
            actions.appendChild(originBtn);

            info.appendChild(actions);
            wrapper.appendChild(info);

            return wrapper;
        }

        function fetchDetail(videoId, autoDownload) {
            showStatus('正在获取影片信息…', 'loading');
            fetch(API_BASE + '/info?video_id=' + encodeURIComponent(videoId))
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(data => { throw new Error(data.detail || '获取详情失败'); });
                    }
                    return res.json();
                })
                .then(data => {
                    if (!data.ok) throw new Error(data.detail || '获取详情失败');
                    hideStatus();
                    openModal(data.item, autoDownload);
                })
                .catch(err => {
                    showStatus('加载详情失败：' + err.message, 'error');
                });
        }

        function openModal(item, autoDownload) {
            currentItem = item;
            modalTitle.textContent = item.code || '影片预览';
            modalContent.innerHTML = '';

            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.preload = 'metadata';
            video.style.cssText = 'max-width:100%;max-height:70vh;';

            const streamUrl = '/api/video-stream?url=' + encodeURIComponent(item.video_url || '');
            video.src = streamUrl;

            video.onerror = function() {
                if (video.src === streamUrl) {
                    video.src = item.video_url || '';
                }
            };

            modalContent.appendChild(video);

            const infoDiv = document.createElement('div');
            infoDiv.className = 'modal-info';
            infoDiv.innerHTML = `
                <div class="mi-title">${item.title || '未知标题'}</div>
                <div class="mi-code">番号：${item.code || '未知'}</div>
                ${item.actors && item.actors.length ? '<div class="mi-actors">演员：' + item.actors.join('、') + '</div>' : ''}
                ${item.description ? '<div class="mi-desc">' + item.description + '</div>' : ''}
            `;
            modalContent.appendChild(infoDiv);

            modal.classList.remove('hidden');

            if (autoDownload) {
                setTimeout(() => downloadCurrent(), 500);
            }
        }

        function closeModal() {
            const video = modalContent.querySelector('video');
            if (video) {
                video.pause();
                video.removeAttribute('src');
                video.load();
            }
            modal.classList.add('hidden');
            modalContent.innerHTML = '';
            currentItem = null;
        }

        function downloadCurrent() {
            if (!currentItem) return;
            const url = currentItem.video_url || '';
            if (!url) {
                showStatus('没有可下载的视频地址', 'error');
                return;
            }
            const filename = (currentItem.code || 'missav') + '.mp4';
            window.location.href = '/api/video-download?url=' + encodeURIComponent(url) + '&filename=' + encodeURIComponent(
                filename);
        }

        // ---- 事件绑定 ----
        searchBtn.addEventListener('click', performSearch);
        searchSubmitBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        modalCloseBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
        modalDownloadBtn.addEventListener('click', downloadCurrent);
        modalOriginalBtn.addEventListener('click', function() {
            if (currentItem && currentItem.url) {
                window.open(currentItem.url, '_blank');
            }
        });

        backToHome.addEventListener('click', function() {
            window.location.href = '/';
        });

        console.log('🎬 MissAV 电影下载器已加载（自动模式）');
    }

    // ---- Turbo 兼容 ----
    document.addEventListener('turbo:load', initApp);
    document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
