<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>MissAV 电影下载器</title>
    <style>
        /* 所有样式保持不变，这里省略（实际使用之前你已有的 missav.html 样式） */
        /* 确保样式完整，否则会乱 */
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 将原来的 <a href="/"> 替换为带 id 的 span 或 a，用 JS 控制 -->
        <span class="back-link" id="backToHome">‹ 返回首页</span>

        <div class="app-title">🎬 MissAV 电影下载器</div>
        <div class="app-subtitle">输入番号或演员名，搜索并下载影片</div>
        <!-- 其他内容不变 -->
    </div>

    <!-- Modal、脚本等保持不变 -->

    <script>
        // ============================================================
        // MissAV 下载器
        // ============================================================

        // ... 所有已有 JS 代码保持不变 ...

        // ---- 返回首页（淡出效果） ----
        const backToHome = document.getElementById('backToHome');
        if (backToHome) {
            backToHome.addEventListener('click', function() {
                // 淡出
                document.documentElement.style.transition = 'opacity 0.2s ease';
                document.documentElement.style.opacity = '0';
                // 延迟跳转
                setTimeout(function() {
                    window.location.href = '/';
                }, 250);
            });
        }

        // 其余代码完全不变
    </script>
</body>
</html>
