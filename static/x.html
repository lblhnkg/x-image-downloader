<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>X 媒体下载器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@7.3.0/dist/turbo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js">
    </script>
    <style>
        :root {
            --bg-app: #000000;
            --bg-surface: rgba(20, 20, 24, 0.72);
            --bg-surface-solid: #101013;
            --bg-elevated: rgba(28, 28, 34, 0.85);
            --bg-glass: rgba(12, 12, 16, 0.72);
            --chip: rgba(255, 255, 255, 0.06);
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --accent-subtle: rgba(56, 189, 248, 0.14);
            --accent-glow: rgba(56, 189, 248, 0.35);
            --gold: #f59e0b;
            --danger: #f43f5e;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-medium: rgba(255, 255, 255, 0.14);
            --border-accent: rgba(56, 189, 248, 0.5);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-glow: 0 0 25px -4px rgba(56, 189, 248, 0.30);
            --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.85);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        .hidden {
            display: none !important;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(145deg, #141414 0%, #1a1a1a 100%);
            border-radius: 32px;
            padding: 40px 28px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            min-height: 560px;
            position: relative;
            transition: all 0.3s ease;
        }

        @media (min-width: 700px) {
            .app-container {
                max-width: 900px;
                padding: 50px 40px 40px;
                border-radius: 36px;
            }
            .gallery {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 14px;
            }
            .search-row input {
                font-size: 18px;
            }
            .option-btn {
                padding: 8px 18px;
                font-size: 13px;
            }
            .submenu-grid {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 14px;
            }
            .submenu-card {
                padding: 24px 20px;
                min-height: 100px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 1100px;
                padding: 60px 50px 50px;
                border-radius: 40px;
            }
            .gallery {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 18px;
            }
            .submenu-card {
                padding: 28px 24px;
                min-height: 110px;
            }
            .submenu-card-title {
                font-size: 18px;
            }
        }

        @media (max-width: 420px) {
            .app-container {
                padding: 28px 18px 22px;
                border-radius: 24px;
            }
            .gallery {
                gap: 6px;
            }
            .item-actions button {
                font-size: 9px;
                padding: 4px 0;
            }
            .submenu-card {
                padding: 14px 16px;
            }
            .submenu-card-title {
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .app-container {
                padding: 20px 12px 16px;
                border-radius: 20px;
            }
            .item-actions button {
                font-size: 8px;
                padding: 3px 0;
            }
        }

        .page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            transition: color 0.2s ease;
            font-weight: 400;
            letter-spacing: 0.2px;
            padding: 4px 0;
        }

        .back-row:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .back-row .back-icon {
            font-size: 18px;
            line-height: 1;
        }

        .back-home {
            display: inline-block;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 18px;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        .back-home:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .submenu-title {
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .submenu-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 18px;
            font-weight: 300;
        }

        .submenu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .submenu-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .submenu-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .submenu-card:active {
            transform: scale(0.98);
        }

        .submenu-card-title {
            font-size: 16px;
            font-weight: 450;
            color: #fff;
        }

        .submenu-card-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
            font-weight: 300;
        }

        .search-section {
            margin-top: 6px;
        }

        .search-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            margin-bottom: 6px;
            display: block;
        }

        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-row input {
            flex: 1;
            background: transparent;
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 0 8px;
            font-size: 16px;
            color: #fff;
            outline: none;
            transition: border-color 0.25s ease;
            font-family: inherit;
        }

        .search-row input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            font-size: 14px;
        }

        .search-row input:focus {
            border-bottom-color: rgba(255, 255, 255, 0.5);
        }

        .search-row .search-btn-icon {
            background: transparent;
            border: 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            cursor: pointer;
            padding: 6px 4px 6px 10px;
            transition: color 0.2s ease;
        }

        .search-row .search-btn-icon:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-favorite-btn {
            background: transparent;
            border: 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            cursor: pointer;
            padding: 6px 4px 6px 6px;
            transition: color 0.2s ease;
            white-space: nowrap;
            font-family: inherit;
        }

        .search-favorite-btn:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-favorite-btn.favorited {
            color: #ffd700;
        }

        .favorites-panel {
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
        }

        .favorite-empty {
            padding: 16px 14px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            font-weight: 300;
            text-align: center;
        }

        .favorite-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .favorite-item:last-child {
            border-bottom: 0;
        }

        .favorite-item .fav-info {
            flex: 1;
            min-width: 0;
        }

        .favorite-item .fav-name {
            font-size: 14px;
            color: #fff;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .favorite-item .fav-handle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 1px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .favorite-item .fav-handle:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .favorite-item .fav-actions {
            display: flex;
            gap: 6px;
        }

        .favorite-item .fav-actions button {
            background: transparent;
            border: 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .favorite-item .fav-actions .fav-use {
            color: rgba(255, 255, 255, 0.6);
        }

        .favorite-item .fav-actions .fav-use:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .favorite-item .fav-actions .fav-delete:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.08);
        }

        .favorite-toggle-btn {
            width: 100%;
            background: transparent;
            border: 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-weight: 300;
            padding: 10px 0 6px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: color 0.2s ease;
        }

        .favorite-toggle-btn:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        .option-section {
            margin-top: 18px;
        }

        .option-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
            margin-bottom: 8px;
            display: block;
        }

        .option-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: 300;
        }

        .option-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
        }

        .option-btn.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .date-row input[type="date"] {
            background: transparent;
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 0 6px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            outline: none;
            font-family: inherit;
            transition: border-color 0.25s ease;
        }

        .date-row input[type="date"]:focus {
            border-bottom-color: rgba(255, 255, 255, 0.4);
        }

        .date-row input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
        }

        .primary-btn {
            width: 100%;
            padding: 14px 0;
            background: #fff;
            color: #0a0a0a;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 18px;
        }

        .primary-btn:hover {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .primary-btn:active {
            transform: scale(0.96);
        }

        .primary-btn:disabled {
            opacity: 0.3;
            cursor: default;
            transform: none;
        }

        .status-box {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            line-height: 1.6;
            min-height: 20px;
        }

        .status-box.error {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.15);
            background: rgba(255, 107, 107, 0.04);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            margin-bottom: 12px;
        }

        .result-title {
            font-size: 15px;
            font-weight: 450;
            color: #fff;
        }

        .result-count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .gallery.fade-in {
            animation: fadeIn 0.35s ease;
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .folder-card {
            background: hsla(0, 0%, 8%, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 0;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.16,1,0.3,1),
                        box-shadow 0.25s ease,
                        border-color 0.25s ease;
            overflow: hidden;
            min-width: 0;
        }

        .folder-card:hover {
            border-color: rgba(56,189,248,0.4);
            box-shadow: 0 12px 32px -8px rgba(56,189,248,0.15);
            transform: translateY(-3px);
        }

        .folder-cover {
            width: 100%;
            height: 90px;
            object-fit: cover;
            display: block;
        }
        .folder-cover-placeholder {
            width: 100%;
            height: 90px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
        }
        .folder-body {
            padding: 14px 16px 16px;
            text-align: center;
        }

        .folder-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            margin: -36px auto 8px;
            border: 3px solid hsla(0, 0%, 8%, 0.85);
            display: block;
            background: rgba(255, 255, 255, 0.06);
        }

        .folder-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.35;
        }

        .folder-handle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.3;
        }

        .folder-count {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .folder-back-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 4px 12px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .folder-back-btn {
            cursor: pointer;
            color: #4da3ff;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(77, 163, 255, 0.12);
            transition: background 0.2s ease;
            white-space: nowrap;
        }

        .folder-back-btn:hover {
            background: rgba(77, 163, 255, 0.25);
        }

        .folder-back-title {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            max-width: 40%;
            min-width: 0;
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.35;
        }

        .folder-back-count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-left: auto;
            white-space: nowrap;
        }

        .folder-toggle-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            padding: 6px 14px;
            border-radius: 999px;
            transition: all 0.2s ease;
        }

        .folder-toggle-btn.active {
            background: rgba(77, 163, 255, 0.18);
            border-color: #4da3ff;
            color: #fff;
        }

        .item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            transition: all 0.2s ease;
        }

        .item.selected {
            border-color: #007aff;
            background: rgba(0, 122, 255, 0.08);
        }

        .select-check {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 10;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .item.in-select-mode .select-check {
            display: flex;
        }

        .item.selected .select-check {
            background: #007aff;
            border-color: #007aff;
        }

        .item.selected .select-check::after {
            content: "✓";
            font-weight: 600;
        }

        .media-wrap {
            position: relative;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        .media-wrap img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
        }

        .item.in-select-mode .media-wrap img {
            cursor: default;
            pointer-events: none;
        }

        .media-error {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            text-align: center;
            padding: 12px;
            font-weight: 300;
        }

        .video-badge {
            position: absolute;
            left: 8px;
            top: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .source-badge {
            position: absolute;
            right: 8px;
            top: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .library-badge {
            position: absolute;
            right: 8px;
            top: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .item-info {
            padding: 8px 10px;
        }

        .item-author {
            font-size: 11px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .item-author:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .item-date {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 2px;
            font-weight: 300;
        }

        .item-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            margin-top: 6px;
        }

        .item-actions button {
            padding: 5px 0;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
            border: 0;
            transition: all 0.2s ease;
            pointer-events: auto;
        }

        .item.in-select-mode .item-actions button {
            pointer-events: none;
            opacity: 0.25;
        }

        .item-actions .btn-view {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
        }

        .item-actions .btn-view:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        .item-actions .btn-download {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
        }

        .item-actions .btn-download:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        .item-actions .btn-original {
            background: rgba(255, 255, 255, 0.05);

        // ---- 页面切换 ----
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            var target = document.getElementById(pageId);
            if (target) target.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (isSelectMode) exitSelectMode();

        // ---- 收藏功能（数据存储在云端数据库） ----
        function loadFavorites() {
            fetch('/api/favorites', { credentials: 'include' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.ok && Array.isArray(data.items)) {
                    favorites = data.items;
                    favoritesLoaded = true;
                    renderFavorites();
                    updateFavoriteButton();
                }
            })
            .catch(function() {
                console.warn('加载收藏失败');
            });
        }

        function renderFavorites() {
            favoritesPanel.innerHTML = '';
            if (!favorites || favorites.length === 0) {
                favoritesPanel.innerHTML = '<div class="favorite-empty">暂时没有收藏的博主</div>';
                return;
            }
            favorites.forEach(function(fav, index) {
                var div = document.createElement('div');
                div.className = 'favorite-item';
                div.innerHTML =
                    '<div class="fav-info"><div class="fav-name">' + (fav.name || fav.username) +
                    '</div><div class="fav-handle" data-username="' + fav.username + '">@' + fav.username +
                    '</div></div>' +
                    '<div class="fav-actions">' +
                    '<button class="fav-delete" data-index="' + index + '">删除</button>' +
                    '</div>';
                favoritesPanel.appendChild(div);
            });

            favoritesPanel.querySelectorAll('.fav-handle').forEach(function(el) {
                el.addEventListener('click', function() {
                    var username = el.dataset.username;
                    if (username) {
                        openGallery(username, null);
                    }
                });
            });

            favoritesPanel.querySelectorAll('.fav-delete').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var idx = parseInt(btn.dataset.index);
                    var fav = favorites[idx];
                    if (fav) {
                        removeFavorite(fav.username);
                    }
                });
            });
        }

        function updateFavoriteButton() {
            var username = normalizeUsername(profileInput.value);
            if (!username) {
                favoriteAddBtn.textContent = '☆ 收藏';
                favoriteAddBtn.classList.remove('favorited');
                return;
            }
            var exists = favorites.some(function(f) { return f.username.toLowerCase() === username.toLowerCase(); });
            favoriteAddBtn.textContent = exists ? '★ 已收藏' : '☆ 收藏';
            if (exists) {
                favoriteAddBtn.classList.add('favorited');
            } else {
                favoriteAddBtn.classList.remove('favorited');
            }
        }

        function bindFavoriteEvents() {
            var oldBtn = favoriteAddBtn;
            var newBtn = oldBtn.cloneNode(true);
            oldBtn.parentNode.replaceChild(newBtn, oldBtn);
            favoriteAddBtn = newBtn;

            favoriteAddBtn.addEventListener('click', function() {
                var username = normalizeUsername(profileInput.value);
                if (!username) {
                    showSearchStatus('请先输入博主名', 'error');
                    return;
                }
                var exists = favorites.some(function(f) { return f.username.toLowerCase() === username.toLowerCase(); });
                if (exists) {
                    removeFavorite(username);
                } else {
                    addFavorite(username);
                }
            });

            var oldToggle = favoriteToggleBtn;
            var newToggle = oldToggle.cloneNode(true);
            oldToggle.parentNode.replaceChild(newToggle, oldToggle);
            favoriteToggleBtn = newToggle;

            favoriteToggleBtn.addEventListener('click', function() {
                favoritesPanel.classList.toggle('hidden');
            });

            profileInput.removeEventListener('input', profileInput._inputHandler);
            profileInput._inputHandler = function() {
                updateFavoriteButton();
            };
            profileInput.addEventListener('input', profileInput._inputHandler);
        }

        function addFavorite(username) {
            fetch('/api/favorites', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, name: username }),
                credentials: 'include'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.ok) {
                    loadFavorites();
                } else {
                    alert('收藏失败：' + (data.detail || '未知错误'));
                }
            })
            .catch(function() {
                alert('收藏失败，请检查服务是否运行');
            });
        }

        function removeFavorite(username) {
            fetch('/api/favorites/' + encodeURIComponent(username), {
                method: 'DELETE',
                credentials: 'include'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.ok) {
                    loadFavorites();
                } else {
                    alert('取消收藏失败：' + (data.detail || '未知错误'));
                }
            })
            .catch(function() {
                alert('取消收藏失败，请检查服务是否运行');
            });
        }

        // ---- 博主专属模式 ----
        function openGallery(username, source) {
            isGalleryMode = true;
            galleryUsername = username;
            returnSource = source || '';

            searchPageTitle.textContent = '@' + username + ' 的媒体';
            searchPageDesc.textContent = '';

            var inputRow = document.querySelector('.search-row');
            if (inputRow) {
                inputRow.querySelector('input').style.display = 'none';
                inputRow.querySelector('.search-btn-icon').style.display = 'none';
                var favBtn = inputRow.querySelector('.search-favorite-btn');
                if (favBtn) favBtn.style.display = 'inline-block';
            }

            var favoriteEntry = document.querySelector('.favorite-entry');
            if (favoriteEntry) favoriteEntry.style.display = 'none';

            var sourceLabel = returnSource === 'likes' ? '我的喜欢' : (returnSource === 'bookmarks' ? '我的书签' : '搜索博主');
            backFromSearchText.textContent = '返回 ' + sourceLabel;

            profileInput.value = username;
            updateFavoriteButton();

            showPage('pageSearch');

            searchGallery.innerHTML = '';
            searchResultHeader.classList.add('hidden');
            hideSearchStatus();

            performSearch();
        }

        function exitGallery() {
            var source = returnSource;
            isGalleryMode = false;
            galleryUsername = '';
            returnSource = '';

            searchPageTitle.textContent = '搜索博主';
            searchPageDesc.textContent = '输入 X 用户名，搜索该博主的所有媒体';

            var inputRow = document.querySelector('.search-row');
            if (inputRow) {
                inputRow.querySelector('input').style.display = '';
                inputRow.querySelector('.search-btn-icon').style.display = '';
                var favBtn = inputRow.querySelector('.search-favorite-btn');
                if (favBtn) favBtn.style.display = 'inline-block';
            }

            var favoriteEntry = document.querySelector('.favorite-entry');
            if (favoriteEntry) favoriteEntry.style.display = '';

            backFromSearchText.textContent = '返回';

            profileInput.value = '';
            updateFavoriteButton();
            searchGallery.innerHTML = '';
            searchResultHeader.classList.add('hidden');
            hideSearchStatus();

            setTimeout(function() {
                if (source === 'likes' || source === 'bookmarks') {
                    openLibrary(source);
                } else {
                    showPage('pageSearch');
                }
            }, 50);
        }

        // ---- 工具函数 ----
        function normalizeUsername(input) {
            var value = input.trim();
            if (!value) return null;
            if (value.includes('x.com/') || value.includes('twitter.com/')) {
                if (!value.startsWith('http://') && !value.startsWith('https://')) {
                    value = 'https://' + value;
                }
                try {
                    var url = new URL(value);
                    var parts = url.pathname.split('/').filter(function(p) { return p; });
                    if (parts.length) value = parts[0];
                } catch (e) {
                    return null;
                }
            }
            value = value.replace(/^@+/, '').replace(/\/+$/, '').replace(/[^A-Za-z0-9_]/g, '');
            return value || null;
        }

        function formatDateFromX(value) {
            if (!value) return '';
            var match = value.match(/^\w+\s+(\w+)\s+(\d+).*?(\d{4})$/);
            if (!match) return value;
            var months = { Jan: '01', Feb: '02', Mar: '03', Apr: '04', May: '05', Jun: '06', Jul: '07', Aug: '08', Sep: '09',
                Oct: '10', Nov: '11', Dec: '12' };
            var month = months[match[1]];
            if (!month) return value;
            return match[3] + '-' + month + '-' + String(match[2]).padStart(2, '0');
        }

        function formatLibraryDate(value) {
            if (!value) return '';
            try {
                var date = new Date(value);
                if (isNaN(date.getTime())) return '';
                return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date
                    .getDate()).padStart(2, '0');
            } catch (e) { return ''; }
        }

        function getLibraryDateRange() {
            if (libraryRange === 'all') return { start: null, end: null };
            if (libraryRange === 'custom') {
                return { start: libraryStartDate.value || null, end: libraryEndDate.value || null };
            }
            var now = new Date();
            var start = new Date(now);
            start.setDate(start.getDate() - Number(libraryRange));
            return {
                start: start.getFullYear() + '-' + String(start.getMonth() + 1).padStart(2, '0') + '-' + String(start
                    .getDate()).padStart(2, '0'),
                end: now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now
                    .getDate()).padStart(2, '0')
            };
        }

        function getDates() {
            if (range === 'all') return { start: null, end: null };
            if (range === 'custom') return { start: startDate.value || null, end: endDate.value || null };
            var now = new Date();
            var start = new Date(now);
            start.setDate(start.getDate() - Number(range));
            return {
                start: start.getFullYear() + '-' + String(start.getMonth() + 1).padStart(2, '0') + '-' + String(start
                    .getDate()).padStart(2, '0'),
                end: now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now
                    .getDate()).padStart(2, '0')
            };
        }

        function getFilename(item) {
            var date = formatDateFromX(item.created_at || item.createdAt) || 'x-media';
            var suffix = (item.media_total && item.media_total > 1) ? '-' + item.media_index : '';
            var extension = '.jpg';
            var type = item.media_type || item.type;
            var rawUrl = item.originalUrl || item.sourceUrl || item.media_url || item.url || '';
            var lower = String(rawUrl).toLowerCase();
            if (type === 'video') extension = '.mp4';
            else if (lower.includes('.png')) extension = '.png';
            else if (lower.includes('.webp')) extension = '.webp';
            else if (lower.includes('.gif')) extension = '.gif';
            return date + suffix + extension;
        }

        function showSearchStatus(msg, type) {
            type = type || '';
            searchStatus.classList.remove('hidden');
            searchStatus.textContent = msg;
            searchStatus.className = 'status-box' + (type === 'error' ? ' error' : '');
        }

        function hideSearchStatus() {
            searchStatus.classList.add('hidden');
            searchStatus.textContent = '';
            searchStatus.className = 'status-box';
        }

        // ---- 搜索（流式：边抓边展示，首批 7 个 → 每批 7 个 → 49 后按 50 一批） ----
        function performSearch() {
            var raw = profileInput.value.trim();
            var username = normalizeUsername(raw);
            if (!username) {
                showSearchStatus('无法识别博主。可以输入：NASA / @NASA / x.com/NASA', 'error');
                return;
            }
            var dates = getDates();
            if (dates.start && dates.end && dates.start > dates.end) {
                showSearchStatus('开始日期不能晚于结束日期', 'error');
                return;
            }
            searchSubmitBtn.disabled = true;
            searchSubmitBtn.textContent = '正在收集…';
            hideSearchStatus();
            searchResultHeader.classList.add('hidden');
            searchGallery.innerHTML = '';
            searchItems = [];
            searchUsername = username;
            searchRenderedCount = 0;
            searchTotal = 0;
            clearSearchSentinel();
            window.scrollTo(0, 0);

            var params = new URLSearchParams();
            params.set('profile', 'https://x.com/' + username);
            params.set('media_type', mediaType);
            params.set('source_type', sourceType);
            if (dates.start) params.set('start_date', dates.start);
            if (dates.end) params.set('end_date', dates.end);

            showSearchStatus('正在获取 @' + username + ' 的媒体…');

            fetch('/api/search/stream?' + params.toString())
                .then(function(res) {
                    if (!res.ok || !res.body) {
                        return res.json().then(function(d) {
                            throw new Error(d.detail || '搜索失败');
                        });
                    }
                    var reader = res.body.getReader();
                    var decoder = new TextDecoder();
                    var buf = '';
                    function pump() {
                        return reader.read().then(function(result) {
                            if (result.done) {
                                if (buf.trim()) handleStreamMsg(buf);
                                finishStreamSearch();
                                return;
                            }
                            buf += decoder.decode(result.value, { stream: true });
                            var lines = buf.split('\n');
                            buf = lines.pop();
                            lines.forEach(handleStreamMsg);
                            return pump();
                        });
                    }
                    return pump();
                })
                .catch(function(err) {
                    showSearchStatus(err.message || '搜索失败', 'error');
                    finishStreamSearch();
                });
        }

        function handleStreamMsg(line) {
            line = (line || '').trim();
            if (!line) return;
            var msg;
            try { msg = JSON.parse(line); } catch (e) { return; }
            if (msg.type === 'batch') {
                var batch = msg.items || [];
                if (batch.length === 0) return;
                batch.forEach(function(item) {
                    searchItems.push(item);
                });
                searchResultHeader.classList.remove('hidden');
                searchResultTitle.textContent = '@' + searchUsername;
                searchResultCount.textContent = '已获取 ' + searchItems.length + ' 个媒体，继续获取中…';
                renderSearchVisibleBatch();
            } else if (msg.type === 'done') {
                var suffix = msg.from_cache ? '（缓存秒开）' : '';
                searchTotal = msg.count || searchItems.length;
                searchResultCount.textContent = '找到 ' + searchTotal + ' 个媒体 · 查询 ' + msg.pages + ' 页' + suffix;
                if (searchItems.length === 0) {
                    searchResultHeader.classList.remove('hidden');
                    searchResultTitle.textContent = '@' + searchUsername;
                    searchGallery.innerHTML = '<div class="loader">没有找到媒体</div>';
                } else {
                    renderSearchVisibleBatch();
                }
            } else if (msg.type === 'error') {
                showSearchStatus(msg.detail || '搜索失败', 'error');
            }
        }

        function finishStreamSearch() {
            searchSubmitBtn.disabled = false;
            searchSubmitBtn.textContent = '开始收集媒体';
        }

        // ---- 搜索结果分批渲染（哨兵控制） ----
        function clearSearchSentinel() {
            if (searchSentinelObserver && searchLoadSentinel) {
                searchSentinelObserver.unobserve(searchLoadSentinel);
            }
            searchLoadSentinel = null;
        }

        function setupSearchSentinel() {
            clearSearchSentinel();
            var items = searchGallery.querySelectorAll('.item');
            if (!items.length) return;
            var target = items.length >= 50 ? items[items.length - 50] : items[items.length - 1];
            searchLoadSentinel = target;
            if (!searchSentinelObserver) {
                searchSentinelObserver = new IntersectionObserver(function(entries) {
                    entries.forEach(function(en) {
                        if (en.isIntersecting) renderSearchVisibleBatch();
                    });
                }, { rootMargin: '100px 0px' });
            }
            searchSentinelObserver.observe(searchLoadSentinel);
        }

        function renderSearchVisibleBatch() {
            if (searchRenderedCount >= searchItems.length) return;
            var end = Math.min(searchRenderedCount + 100, searchItems.length);
            var fragment = document.createDocumentFragment();
            for (var i = searchRenderedCount; i < end; i++) {
                fragment.appendChild(createMediaItem(searchItems[i], 'search'));
            }
            searchGallery.appendChild(fragment);
            searchRenderedCount = end;
            if (searchTotal > 0) {
                searchResultCount.textContent = '已显示 ' + searchRenderedCount + ' / ' + searchTotal + ' 个媒体';
            }
            setupSearchSentinel();
        }

        function renderSearchResults(data, username) {
            searchResultHeader.classList.remove('hidden');
            searchResultTitle.textContent = '@' + username;
            searchTotal = data.count || (data.items || []).length;
            searchGallery.innerHTML = '';
            searchItems = data.items || [];
            searchRenderedCount = 0;
            searchResultCount.textContent = '找到 ' + searchTotal + ' 个媒体 · 查询 ' + data.pages + ' 页';
            if (searchItems.length === 0) {
                searchGallery.innerHTML = '<div class="loader">没有找到媒体</div>';
                return;
            }
            renderSearchVisibleBatch();
        }

        // ---- 媒体库 ----
        function loadLibraryFromServer(source) {
            if (source !== cachedLibrarySource || cachedLibraryItems.length === 0) {
                libraryCount.textContent = '正在读取…';
                libraryStatus.classList.add('hidden');
                libraryResultHeader.classList.add('hidden');
                libraryGallery.innerHTML = '';
                libraryGallery.classList.remove('fade-in');

                var params = new URLSearchParams();
                params.set('source', source);
                params.set('media_type', 'all');

                fetch('/api/media?' + params.toString(), { credentials: 'include' })
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        if (!data.ok) throw new Error(data.detail || '读取媒体库失败');
                        cachedLibraryItems = data.items || [];
                        cachedLibrarySource = source;
                        selectToggleBtn.classList.remove('hidden');
                        resetPagination();
                        renderLibraryResults();
                    })
                    .catch(function(err) {
                        libraryCount.textContent = '读取失败';
                        libraryStatus.classList.remove('hidden');
                        libraryStatus.textContent = err.message || '读取媒体库失败';
                        libraryStatus.className = 'status-box error';
                        selectToggleBtn.classList.add('hidden');
                    });
                return;
            }

            selectToggleBtn.classList.remove('hidden');
            resetPagination();
            renderLibraryResults();
        }

        function openLibrary(source) {
            currentSubPage = source;
            folderAuthor = ''; // 切页回到文件夹列表级
            window.scrollTo(0, 0);
            if (source === 'likes') {
                libraryTitle.textContent = '我的喜欢';
                libraryDesc.textContent = '查看采集器上传的喜欢列表';
            } else {
                libraryTitle.textContent = '我的书签';
                libraryDesc.textContent = '查看采集器上传的书签列表';
            }
            showPage('pageLibrary');

            loadLibraryFromServer(source);
        }

        function renderLibraryResults() {
            window.scrollTo(0, 0);
            var filtered = cachedLibraryItems;
            if (libraryMediaType === 'image') {
                filtered = cachedLibraryItems.filter(function(item) { return item.type === 'image'; });
            } else if (libraryMediaType === 'video') {
                filtered = cachedLibraryItems.filter(function(item) { return item.type === 'video'; });
            }

            var dateRange = getLibraryDateRange();
            if (dateRange.start || dateRange.end) {
                var startDt = dateRange.start ? new Date(dateRange.start + 'T00:00:00Z') : null;
                var endDt = dateRange.end ? new Date(dateRange.end + 'T23:59:59Z') : null;
                filtered = filtered.filter(function(item) {
                    var timeStr = item.tweetCreatedAt || item.createdAt || '';
                    if (!timeStr) return true;
                    try {
                        var dt = new Date(timeStr);
                        if (isNaN(dt.getTime())) return true;
                        if (startDt && dt < startDt) return false;
                        if (endDt && dt > endDt) return false;
                        return true;
                    } catch (e) { return true; }
                });
            }

            // 博主文件夹视图
            if (libraryFolderMode) {
                var oldBar = document.querySelector('.folder-back-bar');
                if (oldBar) oldBar.remove();
                libraryGallery.classList.remove('folder-grid');

                if (folderAuthor) {
                    filtered = filtered.filter(function(item) { return (item.author || '') === folderAuthor; });
                    var curGroup = null;
                    for (var gi = 0; gi < allFolderGroups.length; gi++) {
                        if (allFolderGroups[gi].author === folderAuthor) { curGroup = allFolderGroups[gi]; break; }
                    }
                    if (curGroup) renderFolderBackBar(curGroup);
                    selectToggleBtn.classList.remove('hidden');
                } else {
                    renderFolderGrid(filtered);
                    return;
                }
            }

            allFilteredItems = filtered;
            libraryCount.textContent = '共 ' + allFilteredItems.length + ' 个媒体';
            libraryResultHeader.classList.remove('hidden');
            libraryResultTitle.textContent = currentSubPage === 'likes' ? '我的喜欢' : '我的书签';
            libraryResultCount.textContent = '共 ' + allFilteredItems.length + ' 个媒体';

            libraryGallery.innerHTML = '';
            libraryGallery.classList.remove('fade-in');

            if (!allFilteredItems || allFilteredItems.length === 0) {
                libraryGallery.innerHTML = '<div class="loader">没有符合条件的媒体</div>';
                libraryGallery.classList.add('fade-in');
                return;
            }

            allFilteredItems.sort(function(a, b) {
                var timeA = a.tweetCreatedAt || a.createdAt || '';
                var timeB = b.tweetCreatedAt || b.createdAt || '';
                if (timeA && timeB) return timeB.localeCompare(timeA);
                if (timeA && !timeB) return -1;
                if (!timeA && timeB) return 1;
                return 0;
            });

            currentBatch = 0;
            allLoaded = false;
            isLoadingMore = false;
            if (isSelectMode) exitSelectMode();
            loadNextBatch();

            if (!scrollListenerAttached) {
                window.addEventListener('scroll', handleScroll);
                scrollListenerAttached = true;
            }
        }

        function resetPagination() {
            allFilteredItems = [];
            currentBatch = 0;
            allLoaded = false;
            isLoadingMore = false;
        }

        function resetPaginationAndRender() {
            resetPagination();
            renderLibraryResults();
        }

        function loadNextBatch() {
            if (libraryFolderMode && !folderAuthor) {
                loadNextFolderBatch();
                return;
            }
            if (allLoaded || isLoadingMore) return;
            if (currentBatch * BATCH_SIZE >= allFilteredItems.length) {
                allLoaded = true;
                libraryGallery.classList.add('fade-in');
                return;
            }

            clearLoadSentinel();
            isLoadingMore = true;
            requestAnimationFrame(function() {
                var start = currentBatch * BATCH_SIZE;
                var end = Math.min(start + BATCH_SIZE, allFilteredItems.length);
                var fragment = document.createDocumentFragment();
                for (var i = start; i < end; i++) {
                    var el = createMediaItem(allFilteredItems[i], 'library');
                    fragment.appendChild(el);
                }
                libraryGallery.appendChild(fragment);
                currentBatch++;

                if (currentBatch * BATCH_SIZE >= allFilteredItems.length) {
                    allLoaded = true;
                    libraryGallery.classList.add('fade-in');
                }
                isLoadingMore = false;
                setupLoadSentinel();
            });
        }

        var scrollTimeout = null;

        function handleScroll() {
            // 加载由哨兵(IntersectionObserver)控制，见 setupLoadSentinel
        }

        function clearLoadSentinel() {
            if (sentinelObserver && loadSentinel) {
                sentinelObserver.unobserve(loadSentinel);
            }
            loadSentinel = null;
        }

        function setupLoadSentinel() {
            if (sentinelObserver && loadSentinel) {
                sentinelObserver.unobserve(loadSentinel);
                loadSentinel = null;
            }
            if (allLoaded || isLoadingMore) return;
            if (libraryFolderMode && !folderAuthor) return;
            var items = libraryGallery.querySelectorAll('.item');
            if (!items.length) return;
            var target = items.length >= 50 ? items[items.length - 50] : items[items.length - 1];
            loadSentinel = target;
            if (!sentinelObserver) {
                sentinelObserver = new IntersectionObserver(function(entries) {
                    entries.forEach(function(en) {
                        if (en.isIntersecting && !allLoaded && !isLoadingMore) {
                            loadNextBatch();
                        }
                    });
                }, { rootMargin: '100px 0px' });
            }
            sentinelObserver.observe(loadSentinel);
        }

        refreshLibraryBtn.addEventListener('click', function() {
            cachedLibraryItems = [];
            cachedLibrarySource = '';
            resetPagination();
            if (currentSubPage) {
                openLibrary(currentSubPage);
            }
        });

        // ---- 博主文件夹视图 ----
        function updateFolderBtn() {
            libraryFolderBtn.classList.toggle('active', libraryFolderMode);
            libraryFolderBtn.textContent = libraryFolderMode ? '▦ 瀑布流视图' : '📁 按博主分类';
        }

        function renderFolderGrid(filtered) {
            var map = {};
            filtered.forEach(function(item) {
                var a = item.author || '未知博主';
                if (!map[a]) {
                    map[a] = { author: a, name: item.author_name || '', avatar: item.author_avatar || '', cover: item.author_cover || '', count: 0 };
                }
                map[a].count++;
            });

            allFolderGroups = Object.keys(map).map(function(k) { return map[k]; })
                .sort(function(x, y) { return y.count - x.count; });

            libraryGallery.innerHTML = '';
            libraryGallery.classList.add('folder-grid');
            libraryGallery.classList.remove('fade-in');
            clearLoadSentinel();
            if (isSelectMode) exitSelectMode();
            selectToggleBtn.classList.add('hidden');

            libraryCount.textContent = '共 ' + allFolderGroups.length + ' 位博主';
            libraryResultHeader.classList.remove('hidden');
            libraryResultTitle.textContent = currentSubPage === 'likes' ? '我的喜欢 · 博主分类' : '我的书签 · 博主分类';
            libraryResultCount.textContent = '共 ' + allFolderGroups.length + ' 位博主';

            currentFolderBatch = 0;
            allLoaded = false;
            isLoadingMore = false;
            loadNextFolderBatch();
        }

        function loadNextFolderBatch() {
            if (allLoaded || isLoadingMore) return;
            if (currentFolderBatch * FOLDER_BATCH_SIZE >= allFolderGroups.length) {
                allLoaded = true;
                libraryGallery.classList.add('fade-in');
                return;
            }
            isLoadingMore = true;
            requestAnimationFrame(function() {
                var start = currentFolderBatch * FOLDER_BATCH_SIZE;
                var end = Math.min(start + FOLDER_BATCH_SIZE, allFolderGroups.length);
                var fragment = document.createDocumentFragment();
                for (var i = start; i < end; i++) {
                    fragment.appendChild(createFolderCard(allFolderGroups[i]));
                }
                libraryGallery.appendChild(fragment);
                currentFolderBatch++;
                if (currentFolderBatch * FOLDER_BATCH_SIZE >= allFolderGroups.length) {
                    allLoaded = true;
                    libraryGallery.classList.add('fade-in');
                }
                isLoadingMore = false;
            });
        }

        function createFolderCard(group) {
            var card = document.createElement('div');
            card.className = 'folder-card';

            // 顶部封面图
            if (group.cover) {
                var cover = document.createElement('img');
                cover.className = 'folder-cover';
                cover.src = '/api/media-proxy?url=' + encodeURIComponent(group.cover);
                cover.loading = 'lazy';
                cover.alt = '';
                cover.onerror = function() { this.style.display = 'none'; };
                card.appendChild(cover);
            } else {
                var ph = document.createElement('div');
                ph.className = 'folder-cover-placeholder';
                card.appendChild(ph);
            }

            var body = document.createElement('div');
            body.className = 'folder-body';

            if (group.avatar) {
                var img = document.createElement('img');
                img.className = 'folder-avatar';
                img.src = '/api/media-proxy?url=' + encodeURIComponent(group.avatar);
                img.loading = 'lazy';
                img.alt = '';
                img.onerror = function() { this.style.display = 'none'; };
                body.appendChild(img);
            }

            var name = document.createElement('div');
            name.className = 'folder-name';
            name.textContent = group.name || ('@' + group.author);
            body.appendChild(name);

            var handle = document.createElement('div');
            handle.className = 'folder-handle';
            handle.textContent = '@' + group.author;
            body.appendChild(handle);

            var count = document.createElement('div');
            count.className = 'folder-count';
            count.textContent = group.count + ' 个媒体';
            body.appendChild(count);

            card.appendChild(body);

            card.addEventListener('click', function() {
                folderAuthor = group.author;
                resetPagination();
                renderLibraryResults();
                window.scrollTo(0, 0);
            });
            return card;
        }

        function renderFolderBackBar(group) {
            var bar = document.createElement('div');
            bar.className = 'folder-back-bar';

            var back = document.createElement('span');
            back.className = 'folder-back-btn';
            back.textContent = '‹ 返回博主列表';
            back.addEventListener('click', function() {
                folderAuthor = '';
                resetPagination();
                renderLibraryResults();
                window.scrollTo(0, 0);
            });
            bar.appendChild(back);

            var title = document.createElement('span');
            title.className = 'folder-back-title';
            title.textContent = group.name || ('@' + group.author);
            bar.appendChild(title);

            var cnt = document.createElement('span');
            cnt.className = 'folder-back-count';
            cnt.textContent = group.count + ' 个媒体';
            bar.appendChild(cnt);

            libraryGallery.parentNode.insertBefore(bar, libraryGallery);
