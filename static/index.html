<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<title>X 媒体找图器</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f7;
    color: #111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

.container {
    width: 100%;
    max-width: 950px;
    margin: auto;
    padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(30px + env(safe-area-inset-bottom));
}

h1 {
    margin: 0 0 6px;
    font-size: 25px;
}

.subtitle {
    color: #777;
    font-size: 14px;
    margin-bottom: 18px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow:
        0 2px 10px rgba(0,0,0,.04);
}

label {
    display: block;
    color: #666;
    font-size: 13px;
    margin-bottom: 7px;
}

input[type="text"],
input[type="date"] {
    width: 100%;
    height: 46px;
    border: 1px solid #ddd;
    border-radius: 11px;
    padding: 0 12px;
    font-size: 16px;
    background: white;
    outline: none;
}

input:focus {
    border-color: #111;
}

.date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.section {
    margin-top: 15px;
}

.option-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.option {
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 20px;
    padding: 8px 13px;
    font-size: 13px;
}

.option.active {
    background: #111;
    color: white;
    border-color: #111;
}

.primary {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: 600;
    margin-top: 16px;
}

.primary:disabled {
    opacity: .45;
}

.status {
    font-size: 14px;
    line-height: 1.6;
}

.error {
    color: #d00;
    white-space: pre-wrap;
}

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.result-count {
    color: #777;
    font-size: 13px;
    margin-top: 4px;
}

.gallery {
    columns: 2;
    column-gap: 8px;
}

.item {
    break-inside: avoid;
    margin-bottom: 8px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
}

.media-wrap {
    position: relative;
    background: #eee;
}

.media-wrap img {
    display: block;
    width: 100%;
    height: auto;
    cursor: pointer;
}

.video-badge {
    position: absolute;
    left: 8px;
    top: 8px;
    background: rgba(0,0,0,.75);
    color: white;
    border-radius: 20px;
    padding: 5px 9px;
    font-size: 11px;
}

.source-badge {
    position: absolute;
    right: 8px;
    top: 8px;
    background: rgba(0,0,0,.75);
    color: white;
    border-radius: 20px;
    padding: 5px 9px;
    font-size: 11px;
}

.item-info {
    padding: 8px;
}

.item-date {
    color: #888;
    font-size: 11px;
}

.item-actions {
    display: grid;
    grid-template-columns:
        1fr 1fr 1fr;
    gap: 5px;
    margin-top: 7px;
}

.small-btn {
    height: 34px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 8px;
    font-size: 11px;
    padding: 0 3px;
}

.small-btn:active {
    background: #eee;
}

.loader {
    text-align: center;
    padding: 20px;
    color: #777;
}

/* 大图 / 视频 */

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,.95);
    display: flex;
    flex-direction: column;
}

.modal.hidden,
.hidden {
    display: none !important;
}

.modal-top {
    min-height: 58px;
    padding:
        env(safe-area-inset-top)
        12px
        0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-button {
    border: 0;
    background: rgba(255,255,255,.12);
    color: white;
    border-radius: 20px;
    padding: 8px 13px;
}

.modal-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: auto;
}

.modal-content img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.modal-content video {
    max-width: 100%;
    max-height: 100%;
}

.modal-bottom {
    padding:
        10px 12px
        calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
}

.modal-bottom button {
    flex: 1;
    height: 45px;
    border: 0;
    border-radius: 10px;
    font-size: 14px;
}

.download {
    background: white;
    color: #111;
}

.original {
    background: rgba(255,255,255,.15);
    color: white;
}

@media (min-width: 700px) {

    .gallery {
        columns: 3;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>🖼️ X 媒体找图器</h1>

<div class="subtitle">
输入 X 博主主页，快速查找其发布的图片和视频
</div>


<div class="card">

<label>
X 博主主页
</label>

<input
    id="profile"
    type="text"
    placeholder="例如：https://x.com/NASA"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
/>


<div class="section">

<label>
时间范围
</label>

<div class="option-row">

<button
    class="option active"
    data-group="range"
    data-value="all"
>
全部
</button>

<button
    class="option"
    data-group="range"
    data-value="7"
>
最近7天
</button>

<button
    class="option"
    data-group="range"
    data-value="30"
>
最近30天
</button>

<button
    class="option"
    data-group="range"
    data-value="365"
>
最近1年
</button>

<button
    class="option"
    data-group="range"
    data-value="custom"
>
自定义
</button>

</div>

</div>


<div
    id="customDates"
    class="date-row hidden"
    style="margin-top:12px;"
>

<div>

<label>
开始日期
</label>

<input
    id="startDate"
    type="date"
/>

</div>

<div>

<label>
结束日期
</label>

<input
    id="endDate"
    type="date"
/>

</div>

</div>


<div class="section">

<label>
媒体类型
</label>

<div class="option-row">

<button
    class="option active"
    data-group="media"
    data-value="photo"
>
🖼️ 图片
</button>

<button
    class="option"
    data-group="media"
    data-value="video"
>
🎬 视频
</button>

<button
    class="option"
    data-group="media"
    data-value="all"
>
🖼️+🎬 全部
</button>

</div>

</div>


<div class="section">

<label>
帖子来源
</label>

<div class="option-row">

<button
    class="option active"
    data-group="source"
    data-value="all"
>
全部
</button>

<button
    class="option"
    data-group="source"
    data-value="original"
>
原创
</button>

<button
    class="option"
    data-group="source"
    data-value="repost"
>
转帖 / 引用
</button>

</div>

</div>


<button
    id="searchButton"
    class="primary"
>
开始找图
</button>

</div>


<div
    id="statusCard"
    class="card hidden"
>

<div
    id="status"
    class="status"
></div>

</div>


<div
    id="resultCard"
    class="card hidden"
>

<div class="result-header">

<div>

<strong id="resultTitle">
图片
</strong>

<div
    id="resultCount"
    class="result-count"
></div>

</div>

</div>

<div
    id="gallery"
    class="gallery"
></div>

</div>

</div>


<!-- 大图 / 视频 -->

<div
    id="modal"
    class="modal hidden"
>

<div class="modal-top">

<button
    id="closeModal"
    class="modal-button"
>
✕ 关闭
</button>

</div>

<div
    id="modalContent"
    class="modal-content"
>
</div>

<div class="modal-bottom">

<button
    id="downloadButton"
    class="download"
>
⬇ 下载原图
</button>

<button
    id="originalButton"
    class="original"
>
🔗 打开原帖
</button>

</div>

</div>


<script>

const profileInput =
    document.getElementById(
        "profile"
    );

const searchButton =
    document.getElementById(
        "searchButton"
    );

const statusCard =
    document.getElementById(
        "statusCard"
    );

const status =
    document.getElementById(
        "status"
    );

const resultCard =
    document.getElementById(
        "resultCard"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultCount =
    document.getElementById(
        "resultCount"
    );

const gallery =
    document.getElementById(
        "gallery"
    );

const customDates =
    document.getElementById(
        "customDates"
    );

const startDate =
    document.getElementById(
        "startDate"
    );

const endDate =
    document.getElementById(
        "endDate"
    );

const modal =
    document.getElementById(
        "modal"
    );

const modalContent =
    document.getElementById(
        "modalContent"
    );

const closeModal =
    document.getElementById(
        "closeModal"
    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );

const originalButton =
    document.getElementById(
        "originalButton"
    );


let range =
    "all";

let mediaType =
    "photo";

let sourceType =
    "all";

let currentItem =
    null;


/* -------------------------------------------------
   菜单
------------------------------------------------- */

document
    .querySelectorAll(".option")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const group =
                    button.dataset.group;

                const value =
                    button.dataset.value;

                document
                    .querySelectorAll(
                        `.option[data-group="${group}"]`
                    )
                    .forEach(b => {

                        b.classList.remove(
                            "active"
                        );

                    });

                button.classList.add(
                    "active"
                );

                if (
                    group === "range"
                ) {

                    range =
                        value;

                    if (
                        value ===
                        "custom"
                    ) {

                        customDates
                            .classList
                            .remove(
                                "hidden"
                            );

                    } else {

                        customDates
                            .classList
                            .add(
                                "hidden"
                            );

                    }

                }

                if (
                    group === "media"
                ) {

                    mediaType =
                        value;

                }

                if (
                    group === "source"
                ) {

                    sourceType =
                        value;

                }

            }
        );

    });


/* -------------------------------------------------
   日期
------------------------------------------------- */

function formatDate(
    date
) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;

}


function getDates() {

    if (
        range ===
        "all"
    ) {

        return {
            start: null,
            end: null
        };

    }

    if (
        range ===
        "custom"
    ) {

        return {
            start:
                startDate.value ||
                null,

            end:
                endDate.value ||
                null
        };

    }

    const now =
        new Date();

    const start =
        new Date(now);

    start.setDate(
        start.getDate()
        - Number(range)
    );

    return {
        start:
            formatDate(start),

        end:
            formatDate(now)
    };

}


/* -------------------------------------------------
   搜索
------------------------------------------------- */

searchButton.addEventListener(
    "click",
    search
);


profileInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            search();

        }

    }
);


async function search() {

    const profile =
        profileInput.value.trim();

    if (!profile) {

        showError(
            "请输入 X 博主主页链接"
        );

        return;

    }

    const dates =
        getDates();

    if (
        dates.start &&
        dates.end &&
        dates.start >
        dates.end
    ) {

        showError(
            "开始日期不能晚于结束日期"
        );

        return;

    }

    searchButton.disabled =
        true;

    searchButton.textContent =
        "正在寻找媒体…";

    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status";

    status.textContent =
        "正在连接 X 媒体数据源…";

    resultCard.classList.add(
        "hidden"
    );

    gallery.innerHTML = "";

    try {

        const params =
            new URLSearchParams();

        params.set(
            "profile",
            profile
        );

        params.set(
            "media_type",
            mediaType
        );

        params.set(
            "source_type",
            sourceType
        );

        if (dates.start) {

            params.set(
                "start_date",
                dates.start
            );

        }

        if (dates.end) {

            params.set(
                "end_date",
                dates.end
            );

        }

        const response =
            await fetch(
                `/api/search?${params.toString()}`
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "搜索失败"
            );

        }

        renderResults(
            data
        );

    } catch (error) {

        showError(
            error.message ||
            "搜索失败"
        );

    } finally {

        searchButton.disabled =
            false;

        searchButton.textContent =
            "开始找图";

    }

}


function showError(
    message
) {

    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status error";

    status.textContent =
        message;

}


/* -------------------------------------------------
   结果
------------------------------------------------- */

function renderResults(
    data
) {

    statusCard.classList.add(
        "hidden"
    );

    resultCard.classList.remove(
        "hidden"
    );

    resultTitle.textContent =
        `@${data.username}`;

    resultCount.textContent =
        `找到 ${data.count} 个媒体 · 查询 ${data.pages} 页`;

    if (
        !data.items ||
        data.items.length === 0
    ) {

        gallery.innerHTML = `
            <div class="loader">
                这个条件下没有找到媒体。
            </div>
        `;

        return;

    }

    data.items.forEach(
        item => {

            gallery.appendChild(
                createItem(item)
            );

        }
    );

}


/* -------------------------------------------------
   文件名
------------------------------------------------- */

function getFilename(
    item
) {

    /*
      规则：

      单图：
      2026-08-11.jpg

      同一帖子多图：
      2026-08-11-1.jpg
      2026-08-11-2.jpg

      视频：
      2026-08-11.mp4

      不加入具体时间。
    */

    const match =
        item.created_at.match(
            /(\w+)\s+(\w+)\s+(\d+).*?(\d{4})$/
        );

    let date =
        formatDateFromX(
            item.created_at
        );

    if (!date) {

        date =
            "x-media";

    }

    let suffix =
        "";

    if (
        item.media_total &&
        item.media_total > 1
    ) {

        suffix =
            `-${item.media_index}`;

    }

    let extension =
        ".jpg";

    if (
        item.media_type ===
        "video"
    ) {

        extension =
            ".mp4";

    } else if (
        item.media_url
        &&
        item.media_url
            .toLowerCase()
            .includes(".png")
    ) {

        extension =
            ".png";

    } else if (
        item.media_url
        &&
        item.media_url
            .toLowerCase()
            .includes(".webp")
    ) {

        extension =
            ".webp";

    }

    return (
        `${date}${suffix}${extension}`
    );

}


function formatDateFromX(
    value
) {

    if (!value) {
        return null;
    }

    const match =
        value.match(
            /^\w+\s+(\w+)\s+(\d+).*?(\d{4})$/
        );

    if (!match) {
        return null;
    }

    const months = {
        Jan: "01",
        Feb: "02",
        Mar: "03",
        Apr: "04",
        May: "05",
        Jun: "06",
        Jul: "07",
        Aug: "08",
        Sep: "09",
        Oct: "10",
        Nov: "11",
        Dec: "12"
    };

    const month =
        months[match[1]];

    if (!month) {
        return null;
    }

    return (
        `${match[3]}-` +
        `${month}-` +
        `${String(
            match[2]
        ).padStart(2, "0")}`
    );

}


/* -------------------------------------------------
   创建媒体卡片
------------------------------------------------- */

function createItem(
    item
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "item";


    const mediaWrap =
        document.createElement(
            "div"
        );

    mediaWrap.className =
        "media-wrap";


    const img =
        document.createElement(
            "img"
        );

    if (
        item.media_type ===
        "video"
    ) {

        img.src =
            item.thumbnail ||
            "";

    } else {

        img.src =
            item.media_url;

    }

    img.loading =
        "lazy";

    img.alt =
        item.alt ||
        "";

    img.addEventListener(
        "click",
        () => openModal(item)
    );

    mediaWrap.appendChild(
        img
    );


    if (
        item.media_type ===
        "video"
    ) {

        const badge =
            document.createElement(
                "div"
            );

        badge.className =
            "video-badge";

        badge.textContent =
            "▶ 视频";

        mediaWrap.appendChild(
            badge
        );

    }


    if (
        item.source !==
        "original"
    ) {

        const source =
            document.createElement(
                "div"
            );

        source.className =
            "source-badge";

        source.textContent =
            item.source ===
            "repost"
                ? "转帖"
                : "引用";

        mediaWrap.appendChild(
            source
        );

    }


    wrapper.appendChild(
        mediaWrap
    );


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "item-info";


    const date =
        document.createElement(
            "div"
        );

    date.className =
        "item-date";

    date.textContent =
        formatDateFromX(
            item.created_at
        ) ||
        item.created_at;

    info.appendChild(
        date
    );


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "item-actions";


    const view =
        document.createElement(
            "button"
        );

    view.className =
        "small-btn";

    view.textContent =
        item.media_type ===
        "video"
            ? "▶ 播放"
            : "查看大图";

    view.addEventListener(
        "click",
        () => openModal(item)
    );


    const download =
        document.createElement(
            "button"
        );

    download.className =
        "small-btn";

    download.textContent =
        item.media_type ===
        "video"
            ? "⬇ 下载视频"
            : "⬇ 下载原图";

    download.addEventListener(
        "click",
        () => downloadItem(item)
    );


    const post =
        document.createElement(
            "button"
        );

    post.className =
        "small-btn";

    post.textContent =
        "原帖";

    post.addEventListener(
        "click",
        () => {

            window.open(
                item.tweet_url,
                "_blank"
            );

        }
    );


    actions.appendChild(
        view
    );

    actions.appendChild(
        download
    );

    actions.appendChild(
        post
    );

    info.appendChild(
        actions
    );

    wrapper.appendChild(
        info
    );

    return wrapper;

}


/* -------------------------------------------------
   下载
------------------------------------------------- */

function downloadItem(
    item
) {

    const filename =
        getFilename(item);

    const url =
        "/api/download?url=" +
        encodeURIComponent(
            item.media_url
        ) +
        "&filename=" +
        encodeURIComponent(
            filename
        );

    window.location.href =
        url;

}


/* -------------------------------------------------
   大图 / 视频
------------------------------------------------- */

function openModal(
    item
) {

    currentItem =
        item;

    modalContent.innerHTML =
        "";

    if (
        item.media_type ===
        "video"
    ) {

        const video =
            document.createElement(
                "video"
            );

        video.src =
            item.video_url ||
            item.media_url;

        video.controls =
            true;

        video.autoplay =
            true;

        video.playsInline =
            true;

        modalContent.appendChild(
            video
        );

        downloadButton.textContent =
            "⬇ 下载视频";

    } else {

        const img =
            document.createElement(
                "img"
            );

        img.src =
            item.media_url;

        img.alt =
            item.alt || "";

        modalContent.appendChild(
            img
        );

        downloadButton.textContent =
            "⬇ 下载原图";

    }

    modal.classList.remove(
        "hidden"
    );

}


closeModal.addEventListener(
    "click",
    closeModalWindow
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modal
        ) {

            closeModalWindow();

        }

    }
);


function closeModalWindow() {

    modal.classList.add(
        "hidden"
    );

    modalContent.innerHTML =
        "";

    currentItem =
        null;

}


/* -------------------------------------------------
   大图页面下载
------------------------------------------------- */

downloadButton.addEventListener(
    "click",
    () => {

        if (
            !currentItem
        ) {

            return;

        }

        downloadItem(
            currentItem
        );

    }
);


/* -------------------------------------------------
   原帖
------------------------------------------------- */

originalButton.addEventListener(
    "click",
    () => {

        if (
            !currentItem
        ) {

            return;

        }

        window.open(
            currentItem.tweet_url,
            "_blank"
        );

    }
);

</script>

</body>

</html>
