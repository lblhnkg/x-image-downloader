<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<title>X 媒体找图器</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f7;
    color: #111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

button,
input {
    font-family: inherit;
}

.container {
    width: 100%;
    max-width: 950px;
    margin: auto;
    padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(30px + env(safe-area-inset-bottom));
}

h1 {
    margin: 0 0 5px;
    font-size: 25px;
    letter-spacing: -0.5px;
}

.subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 17px;
}


/* =====================================================
   通用卡片
===================================================== */

.card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow:
        0 2px 10px rgba(0,0,0,.04);
}

label {
    display: block;
    color: #666;
    font-size: 13px;
    margin-bottom: 7px;
}


/* =====================================================
   博主输入
===================================================== */

.profile-row {
    display: flex;
    gap: 8px;
}

.profile-input-wrap {
    flex: 1;
}

input[type="text"],
input[type="date"] {
    width: 100%;
    height: 46px;
    border: 1px solid #ddd;
    border-radius: 11px;
    padding: 0 12px;
    font-size: 16px;
    background: white;
    outline: none;
}

input:focus {
    border-color: #111;
}

.favorite-add {
    height: 46px;
    min-width: 78px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 11px;
    font-size: 13px;
    white-space: nowrap;
}

.favorite-add:active {
    background: #eee;
}


/* =====================================================
   收藏入口
===================================================== */

.favorite-entry {
    margin-top: 10px;
}

.favorite-main-button {
    width: 100%;
    height: 42px;
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 11px;
    font-size: 14px;
    text-align: left;
    padding: 0 13px;
}

.favorite-main-button:active {
    background: #eee;
}


/* =====================================================
   收藏列表
===================================================== */

.favorites-panel {
    margin-top: 10px;
    border: 1px solid #eee;
    border-radius: 12px;
    overflow: hidden;
}

.favorite-empty {
    padding: 18px 12px;
    color: #999;
    font-size: 13px;
    text-align: center;
}

.favorite-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 10px;
    border-bottom: 1px solid #eee;
}

.favorite-item:last-child {
    border-bottom: 0;
}

.favorite-info {
    flex: 1;
    min-width: 0;
}

.favorite-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.favorite-handle {
    color: #888;
    font-size: 12px;
    margin-top: 2px;
}

.favorite-actions {
    display: flex;
    gap: 5px;
}

.favorite-use,
.favorite-delete {
    height: 32px;
    border-radius: 8px;
    padding: 0 8px;
    font-size: 11px;
    border: 1px solid #ddd;
    background: white;
}

.favorite-use {
    background: #111;
    color: white;
    border-color: #111;
}


/* =====================================================
   时间 / 选项
===================================================== */

.section {
    margin-top: 15px;
}

.option-row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.option {
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 20px;
    padding: 8px 12px;
    font-size: 13px;
}

.option.active {
    background: #111;
    color: white;
    border-color: #111;
}

.date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.custom-dates {
    margin-top: 11px;
}


/* =====================================================
   搜索按钮
===================================================== */

.primary {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: 600;
    margin-top: 17px;
}

.primary:disabled {
    opacity: .45;
}


/* =====================================================
   状态
===================================================== */

.status {
    font-size: 14px;
    line-height: 1.6;
}

.error {
    color: #d00;
    white-space: pre-wrap;
}

.loader {
    text-align: center;
    padding: 20px;
    color: #777;
}


/* =====================================================
   结果
===================================================== */

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.result-title {
    font-size: 16px;
    font-weight: 700;
}

.result-count {
    color: #777;
    font-size: 12px;
    margin-top: 4px;
}


/* =====================================================
   重点：正常 Grid，不再使用 columns 瀑布流
===================================================== */

.gallery {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 9px;

    align-items: start;
}


/* =====================================================
   媒体卡片
===================================================== */

.item {
    min-width: 0;
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    overflow: hidden;
}

.media-wrap {
    position: relative;
    width: 100%;
    background: #eee;
    overflow: hidden;
}

.media-wrap img {
    display: block;
    width: 100%;

    /*
       统一卡片比例，避免左右高度疯狂变化。
       图片仍然通过大图查看查看完整原图。
    */
    aspect-ratio: 1 / 1;
    object-fit: cover;

    cursor: pointer;
}

.video-badge {
    position: absolute;
    left: 7px;
    top: 7px;
    background: rgba(0,0,0,.75);
    color: white;
    border-radius: 20px;
    padding: 5px 8px;
    font-size: 10px;
}

.source-badge {
    position: absolute;
    right: 7px;
    top: 7px;
    background: rgba(0,0,0,.75);
    color: white;
    border-radius: 20px;
    padding: 5px 8px;
    font-size: 10px;
}

.item-info {
    padding: 8px;
}

.item-date {
    color: #888;
    font-size: 10px;
}

.item-actions {
    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 4px;

    margin-top: 7px;
}

.small-btn {
    height: 32px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 7px;
    font-size: 10px;
    padding: 0 2px;
    white-space: nowrap;
}

.small-btn:active {
    background: #eee;
}


/* =====================================================
   大图 / 视频
===================================================== */

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,.95);
    display: flex;
    flex-direction: column;
}

.modal.hidden,
.hidden {
    display: none !important;
}

.modal-top {
    min-height: 58px;

    padding:
        env(safe-area-inset-top)
        12px
        0
        12px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-button {
    border: 0;
    background: rgba(255,255,255,.12);
    color: white;
    border-radius: 20px;
    padding: 8px 13px;
}

.modal-content {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 10px;

    overflow: auto;
}

.modal-content img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.modal-content video {
    max-width: 100%;
    max-height: 100%;
}

.modal-bottom {
    padding:
        10px
        12px
        calc(12px + env(safe-area-inset-bottom));

    display: flex;
    gap: 8px;
}

.modal-bottom button {
    flex: 1;
    height: 45px;
    border: 0;
    border-radius: 10px;
    font-size: 14px;
}

.download {
    background: white;
    color: #111;
}

.original {
    background: rgba(255,255,255,.15);
    color: white;
}


/* =====================================================
   大屏幕
===================================================== */

@media (min-width: 700px) {

    .gallery {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

}


/* =====================================================
   小屏幕
===================================================== */

@media (max-width: 380px) {

    .item-actions {
        grid-template-columns:
            1fr 1fr;
    }

    .item-actions
    .small-btn:last-child {
        grid-column:
            1 / -1;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>🖼️ X 媒体找图器</h1>

<div class="subtitle">
输入博主名、@用户名或 X 主页链接
</div>


<!-- ==================================================
     搜索卡片
================================================== -->

<div class="card">

<label>
博主
</label>

<div class="profile-row">

<div class="profile-input-wrap">

<input
    id="profile"
    type="text"
    placeholder="@NASA / NASA / x.com/NASA"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
/>

</div>

<button
    id="favoriteAdd"
    class="favorite-add"
>
☆ 收藏
</button>

</div>


<!-- 收藏入口 -->

<div class="favorite-entry">

<button
    id="favoriteToggle"
    class="favorite-main-button"
>
⭐ 我的收藏
</button>

<div
    id="favoritesPanel"
    class="favorites-panel hidden"
></div>

</div>


<!-- ==================================================
     时间范围
================================================== -->

<div class="section">

<label>
时间范围
</label>

<div class="option-row">

<button
    class="option active"
    data-group="range"
    data-value="all"
>
全部
</button>

<button
    class="option"
    data-group="range"
    data-value="7"
>
最近7天
</button>

<button
    class="option"
    data-group="range"
    data-value="30"
>
最近30天
</button>

<button
    class="option"
    data-group="range"
    data-value="365"
>
最近1年
</button>

<button
    class="option"
    data-group="range"
    data-value="custom"
>
自定义
</button>

</div>

</div>


<div
    id="customDates"
    class="custom-dates hidden"
>

<div class="date-row">

<div>

<label>
开始日期
</label>

<input
    id="startDate"
    type="date"
/>

</div>

<div>

<label>
结束日期
</label>

<input
    id="endDate"
    type="date"
/>

</div>

</div>

</div>


<!-- ==================================================
     媒体类型
================================================== -->

<div class="section">

<label>
媒体类型
</label>

<div class="option-row">

<button
    class="option active"
    data-group="media"
    data-value="photo"
>
🖼️ 图片
</button>

<button
    class="option"
    data-group="media"
    data-value="video"
>
🎬 视频
</button>

<button
    class="option"
    data-group="media"
    data-value="all"
>
🖼️+🎬 全部
</button>

</div>

</div>


<!-- ==================================================
     帖子来源
================================================== -->

<div class="section">

<label>
帖子来源
</label>

<div class="option-row">

<button
    class="option active"
    data-group="source"
    data-value="all"
>
全部
</button>

<button
    class="option"
    data-group="source"
    data-value="original"
>
原创
</button>

<button
    class="option"
    data-group="source"
    data-value="repost"
>
转帖 / 引用
</button>

</div>

</div>


<button
    id="searchButton"
    class="primary"
>
开始找图
</button>

</div>


<!-- ==================================================
     状态
================================================== -->

<div
    id="statusCard"
    class="card hidden"
>

<div
    id="status"
    class="status"
></div>

</div>


<!-- ==================================================
     搜索结果
================================================== -->

<div
    id="resultCard"
    class="card hidden"
>

<div class="result-header">

<div>

<div
    id="resultTitle"
    class="result-title"
>
图片
</div>

<div
    id="resultCount"
    class="result-count"
></div>

</div>

</div>

<div
    id="gallery"
    class="gallery"
></div>

</div>


</div>


<!-- ==================================================
     大图 / 视频 Modal
================================================== -->

<div
    id="modal"
    class="modal hidden"
>

<div class="modal-top">

<button
    id="closeModal"
    class="modal-button"
>
✕ 关闭
</button>

</div>


<div
    id="modalContent"
    class="modal-content"
></div>


<div class="modal-bottom">

<button
    id="downloadButton"
    class="download"
>
⬇ 下载原图
</button>

<button
    id="originalButton"
    class="original"
>
🔗 打开原帖
</button>

</div>

</div>


<script>


/* =====================================================
   DOM
===================================================== */

const profileInput =
    document.getElementById(
        "profile"
    );

const favoriteAdd =
    document.getElementById(
        "favoriteAdd"
    );

const favoriteToggle =
    document.getElementById(
        "favoriteToggle"
    );

const favoritesPanel =
    document.getElementById(
        "favoritesPanel"
    );

const searchButton =
    document.getElementById(
        "searchButton"
    );

const statusCard =
    document.getElementById(
        "statusCard"
    );

const status =
    document.getElementById(
        "status"
    );

const resultCard =
    document.getElementById(
        "resultCard"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultCount =
    document.getElementById(
        "resultCount"
    );

const gallery =
    document.getElementById(
        "gallery"
    );

const customDates =
    document.getElementById(
        "customDates"
    );

const startDate =
    document.getElementById(
        "startDate"
    );

const endDate =
    document.getElementById(
        "endDate"
    );

const modal =
    document.getElementById(
        "modal"
    );

const modalContent =
    document.getElementById(
        "modalContent"
    );

const closeModal =
    document.getElementById(
        "closeModal"
    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );

const originalButton =
    document.getElementById(
        "originalButton"
    );


/* =====================================================
   状态
===================================================== */

let range = "all";

let mediaType = "photo";

let sourceType = "all";

let currentItem = null;


/* =====================================================
   本地收藏
===================================================== */

const FAVORITE_KEY =
    "x_media_finder_favorites_v31";


function getFavorites() {

    try {

        const data =
            localStorage.getItem(
                FAVORITE_KEY
            );

        if (!data) {
            return [];
        }

        const parsed =
            JSON.parse(data);

        if (!Array.isArray(parsed)) {
            return [];
        }

        return parsed;

    } catch (e) {

        return [];

    }

}


function saveFavorites(
    favorites
) {

    localStorage.setItem(
        FAVORITE_KEY,
        JSON.stringify(
            favorites
        )
    );

}


/* =====================================================
   解析用户名
===================================================== */

function normalizeUsername(
    input
) {

    let value =
        input.trim();

    if (!value) {
        return null;
    }


    /*
       https://x.com/NASA
       http://x.com/NASA
       x.com/NASA
       www.x.com/NASA
    */

    if (
        value.includes("x.com/")
        ||
        value.includes("twitter.com/")
    ) {

        if (
            !value.startsWith(
                "http://"
            )
            &&
            !value.startsWith(
                "https://"
            )
        ) {

            value =
                "https://" +
                value;

        }

        try {

            const url =
                new URL(value);

            const parts =
                url.pathname
                    .split("/")
                    .filter(Boolean);

            if (
                parts.length > 0
            ) {

                value =
                    parts[0];

            }

        } catch (e) {

            return null;

        }

    }


    /*
       @NASA
    */

    value =
        value.replace(
            /^@+/,
            ""
        );


    /*
       清理尾部 /
    */

    value =
        value.replace(
            /\/+$/,
            ""
        );


    /*
       用户名只能包含
       字母、数字、下划线
    */

    value =
        value.replace(
            /[^A-Za-z0-9_]/g,
            ""
        );


    if (!value) {
        return null;
    }


    /*
       X 用户名大小写
       不影响我们的查询
    */

    return value;

}


/* =====================================================
   收藏按钮状态
===================================================== */

function updateFavoriteButton() {

    const username =
        normalizeUsername(
            profileInput.value
        );

    if (!username) {

        favoriteAdd.textContent =
            "☆ 收藏";

        return;

    }

    const favorites =
        getFavorites();

    const exists =
        favorites.some(
            item =>
                item.username
                    .toLowerCase()
                ===
                username
                    .toLowerCase()
        );

    favoriteAdd.textContent =
        exists
            ? "★ 已收藏"
            : "☆ 收藏";

}


profileInput.addEventListener(
    "input",
    updateFavoriteButton
);


/* =====================================================
   添加 / 取消收藏
===================================================== */

favoriteAdd.addEventListener(
    "click",
    () => {

        const username =
            normalizeUsername(
                profileInput.value
            );

        if (!username) {

            showError(
                "请先输入博主名，例如 NASA 或 @NASA"
            );

            return;

        }

        let favorites =
            getFavorites();

        const existingIndex =
            favorites.findIndex(
                item =>
                    item.username
                        .toLowerCase()
                    ===
                    username
                        .toLowerCase()
            );


        /*
           已存在 → 删除
        */

        if (
            existingIndex !== -1
        ) {

            favorites.splice(
                existingIndex,
                1
            );

            saveFavorites(
                favorites
            );

            updateFavoriteButton();

            renderFavorites();

            return;

        }


        /*
           新收藏
        */

        favorites.push({

            username:
                username,

            name:
                username,

            addedAt:
                Date.now()

        });

        saveFavorites(
            favorites
        );

        updateFavoriteButton();

        renderFavorites();

        statusCard.classList.remove(
            "hidden"
        );

        status.className =
            "status";

        status.textContent =
            `已收藏 @${username}`;

    }
);


/* =====================================================
   收藏入口
===================================================== */

favoriteToggle.addEventListener(
    "click",
    () => {

        favoritesPanel.classList.toggle(
            "hidden"
        );

        if (
            !favoritesPanel.classList.contains(
                "hidden"
            )
        ) {

            renderFavorites();

        }

    }
);


/* =====================================================
   渲染收藏
===================================================== */

function renderFavorites() {

    const favorites =
        getFavorites();

    favoritesPanel.innerHTML =
        "";

    if (
        favorites.length === 0
    ) {

        favoritesPanel.innerHTML = `
            <div class="favorite-empty">
                还没有收藏博主
            </div>
        `;

        return;

    }


    favorites.forEach(
        (favorite, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "favorite-item";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "favorite-info";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "favorite-name";

            name.textContent =
                favorite.name ||
                favorite.username;


            const handle =
                document.createElement(
                    "div"
                );

            handle.className =
                "favorite-handle";

            handle.textContent =
                "@" +
                favorite.username;


            info.appendChild(
                name
            );

            info.appendChild(
                handle
            );


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "favorite-actions";


            const use =
                document.createElement(
                    "button"
                );

            use.className =
                "favorite-use";

            use.textContent =
                "查找";


            use.addEventListener(
                "click",
                () => {

                    profileInput.value =
                        favorite.username;

                    updateFavoriteButton();

                    favoritesPanel.classList.add(
                        "hidden"
                    );

                    window.scrollTo({
                        top: 0,
                        behavior:
                            "smooth"
                    });

                }
            );


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "favorite-delete";

            remove.textContent =
                "删除";


            remove.addEventListener(
                "click",
                () => {

                    const list =
                        getFavorites();

                    list.splice(
                        index,
                        1
                    );

                    saveFavorites(
                        list
                    );

                    renderFavorites();

                    updateFavoriteButton();

                }
            );


            actions.appendChild(
                use
            );

            actions.appendChild(
                remove
            );


            item.appendChild(
                info
            );

            item.appendChild(
                actions
            );

            favoritesPanel.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   选项菜单
===================================================== */

document
    .querySelectorAll(".option")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const group =
                        button.dataset.group;

                    const value =
                        button.dataset.value;


                    document
                        .querySelectorAll(
                            `.option[data-group="${group}"]`
                        )

/* =====================================================
   日期
===================================================== */

function formatDate(
    date
) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const d =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        `${y}-${m}-${d}`
    );

}


function getDates() {

    if (
        range ===
        "all"
    ) {

        return {
            start: null,
            end: null
        };

    }


    if (
        range ===
        "custom"
    ) {

        return {

            start:
                startDate.value ||
                null,

            end:
                endDate.value ||
                null

        };

    }


    const now =
        new Date();

    const start =
        new Date(now);

    start.setDate(
        start.getDate()
        - Number(range)
    );


    return {

        start:
            formatDate(
                start
            ),

        end:
            formatDate(
                now
            )

    };

}

async function search() {

    const raw =
        profileInput.value.trim();

    const username =
        normalizeUsername(
            raw
        );


    if (!username) {

        showError(
            "无法识别博主。\n\n" +
            "可以输入：\n" +
            "NASA\n" +
            "@NASA\n" +
            "x.com/NASA\n" +
            "https://x.com/NASA"
        );

        return;

    }


    /*
       自动把输入转换成标准主页 URL
    */

    const profile =
        `https://x.com/${username}`;


    const dates =
        getDates();


    if (
        dates.start &&
        dates.end &&
        dates.start >
        dates.end
    ) {

        showError(
            "开始日期不能晚于结束日期"
        );

        return;

    }


    searchButton.disabled =
        true;

    searchButton.textContent =
        "正在寻找媒体…";


    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status";

    status.textContent =
        `正在搜索 @${username}…`;


    resultCard.classList.add(
        "hidden"
    );

    gallery.innerHTML =
        "";


    try {

        const params =
            new URLSearchParams();


        params.set(
            "profile",
            profile
        );


        params.set(
            "media_type",
            mediaType
        );


        params.set(
            "source_type",
            sourceType
        );


        if (
            dates.start
        ) {

            params.set(
                "start_date",
                dates.start
            );

        }


        if (
            dates.end
        ) {

            params.set(
                "end_date",
                dates.end
            );

        }


        const response =
            await fetch(
                `/api/search?${params.toString()}`
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.detail ||
                "搜索失败"
            );

        }


        renderResults(
            data
        );


    } catch (error) {

        showError(
            error.message ||
            "搜索失败"
        );


    } finally {

        searchButton.disabled =
            false;

        searchButton.textContent =
            "开始找图";

    }

}

/* =====================================================
   日期
===================================================== */

function formatDateFromX(
    value
) {

    if (!value) {
        return null;
    }


    const match =
        value.match(
            /^\w+\s+(\w+)\s+(\d+).*?(\d{4})$/
        );


    if (!match) {
        return null;
    }


    const months = {

        Jan: "01",
        Feb: "02",
        Mar: "03",
        Apr: "04",
        May: "05",
        Jun: "06",
        Jul: "07",
        Aug: "08",
        Sep: "09",
        Oct: "10",
        Nov: "11",
        Dec: "12"

    };


    const month =
        months[
            match[1]
        ];


    if (!month) {
        return null;
    }


    return (
        `${match[3]}-` +
        `${month}-` +
        `${String(
            match[2]
        ).padStart(
            2,
            "0"
        )}`
    );

}


/* =====================================================
   文件名
===================================================== */

function getFilename(
    item
) {

    let date =
        formatDateFromX(
            item.created_at
        );


    if (!date) {

        date =
            "x-media";

    }


    let suffix =
        "";


    /*
       同一条帖子多张媒体：

       2026-08-11-1
       2026-08-11-2
       2026-08-11-3
    */

    if (
        item.media_total &&
        item.media_total > 1
    ) {

        suffix =
            `-${item.media_index}`;

    }


    let extension =
        ".jpg";


    if (
        item.media_type ===
        "video"
    ) {

        extension =
            ".mp4";

    }


    else if (
        item.media_url
        &&
        item.media_url
            .toLowerCase()
            .includes(".png")
    ) {

        extension =
            ".png";

    }


    else if (
        item.media_url
        &&
        item.media_url
            .toLowerCase()
            .includes(".webp")
    ) {

        extension =
            ".webp";

    }


    return (
        `${date}${suffix}${extension}`
    );

}

    );


    wrapper.appendChild(
        info
    );

function downloadItem(
    item
) {

    const filename =
        getFilename(item);


    const url =
        "/api/download?url=" +
        encodeURIComponent(
            item.media_url
        ) +
        "&filename=" +
        encodeURIComponent(
            filename
        );


    window.location.href =
        url;

}

                                `.xid-library-option[data-library-group="${group}"]`
                            )
                            .forEach(
                                function (other) {

                                    other.classList.remove(
                                        "active"
                                    );

                                }
                            );

                        button.classList.add(
                            "active"
                        );


                        if (
                            group ===
                            "media"
                        ) {

                            xidLibraryMediaType =
                                value;

                        }


                        if (
                            group ===
                            "downloaded"
                        ) {

                            xidLibraryDownloaded =
                                value;

                        }


                        if (
                            group ===
                            "range"
                        ) {

                            xidLibraryRange =
                                value;

                        }

                    }
                );

            }
        );


    /* =====================================================
       加载按钮
    ===================================================== */

    xidLibraryLoad.addEventListener(
        "click",
        loadXidLibrary
    );


    /* =====================================================
       切换模式
    ===================================================== */

    function switchMode(
        mode
    ) {

        xidMode =
            mode;


        searchTab.classList.toggle(
            "active",
            mode ===
            "search"
        );

        likesTab.classList.toggle(
            "active",
            mode ===
            "likes"
        );

        bookmarksTab.classList.toggle(
            "active",
            mode ===
            "bookmarks"
        );


        if (
            mode ===
            "search"
        ) {

            if (
                originalSearchCard
            ) {

                originalSearchCard
                    .classList
                    .remove(
                        "hidden"
                    );

            }

            xidLibraryCard
                .classList
                .add(
                    "hidden"
                );

            xidLibraryGallery
                .classList
                .add(
                    "hidden"
                );

            return;

        }


        /* Likes / Bookmarks */

        if (
            originalSearchCard
        ) {

            originalSearchCard
                .classList
                .add(
                    "hidden"
                );

        }


        xidLibraryCard
            .classList
            .remove(
                "hidden"
            );

        xidLibraryGallery
            .classList
            .remove(
                "hidden"
            );


        const title =
            mode ===
            "likes"
                ? "❤️ 我的喜欢"
                : "🔖 我的书签";

        document.getElementById(
            "xid-library-result-title"
        ).textContent =
            title;

    }


    /* =====================================================
       加载服务器媒体库
    ===================================================== */

    async function loadXidLibrary() {

        if (
            xidMode ===
            "search"
        ) {

            return;

        }


        const source =
            xidMode;


        xidLibraryLoad.disabled =
            true;

        xidLibraryLoad.textContent =
            "正在加载…";


        xidLibraryStatus.className =
            "xid-library-status";

        xidLibraryStatus.textContent =
            (
                source ===
                "likes"
                    ? "正在加载我的喜欢…"
                    : "正在加载我的书签…"
            );


        xidLibraryGalleryInner.innerHTML =
            "";


        try {

            const params =
                new URLSearchParams();


            params.set(
                "source",
                source
            );


            params.set(
                "media_type",
                xidLibraryMediaType
            );


            params.set(
                "downloaded",
                xidLibraryDownloaded
            );


            const response =
                await fetch(
                    `/api/media?${params.toString()}`
                );


            let data = null;


            try {

                data =
                    await response.json();

            } catch (_) {

                throw new Error(
                    "服务器返回的不是有效 JSON"
                );

            }


            if (
                !response.ok
            ) {

                throw new Error(
                    data &&
                    data.detail
                        ? data.detail
                        : `HTTP ${response.status}`
                );

            }


            if (
                !data ||
                data.ok !== true
            ) {

                throw new Error(
                    data &&
                    data.detail
                        ? data.detail
                        : "媒体库读取失败"
                );

            }


            let items =
                Array.isArray(
                    data.items
                )
                    ? data.items
                    : [];


            /*
             * 时间筛选
             *
             * 后端当前 /api/media
             * 没有日期参数。
             *
             * 因此这里在浏览器端过滤。
             */

            items =
                filterLibraryByDate(
                    items
                );


            xidLibraryItems =
                items;


            renderXidLibrary(
                items
            );


            xidLibraryStatus.textContent =
                `服务器返回 ${data.count || 0} 个媒体。\n` +
                `当前筛选显示 ${items.length} 个。`;


        } catch (
            error
        ) {

            console.error(
                "[XID] media library error:",
                error
            );


            xidLibraryStatus.className =
                "xid-library-status error";


            xidLibraryStatus.textContent =
                "媒体库加载失败：\n" +
                (
                    error &&
                    error.message
                        ? error.message
                        : String(error)
                );

        } finally {

            xidLibraryLoad.disabled =
                false;

            xidLibraryLoad.textContent =
                "加载媒体";

        }

    }


    /* =====================================================
       日期过滤
    ===================================================== */

    function filterLibraryByDate(
        items
    ) {

        if (
            xidLibraryRange ===
            "all"
        ) {

            return items;

        }


        const days =
            Number(
                xidLibraryRange
            );


        if (
            !days ||
            days <= 0
        ) {

            return items;

        }


        const now =
            Date.now();


        const cutoff =
            now -
            days *
            24 *
            60 *
            60 *
            1000;


        return items.filter(
            function (item) {

                const value =
                    item.createdAt;


                if (!value) {

                    return true;

                }


                const time =
                    Date.parse(
                        value
                    );


                if (
                    Number.isNaN(
                        time
                    )
                ) {

                    return true;

                }


                return (
                    time >=
                    cutoff
                );

            }
        );

    }


    /* =====================================================
       媒体库渲染
    ===================================================== */

    function renderXidLibrary(
        items
    ) {

        xidLibraryGalleryInner.innerHTML =
            "";


        const count =
            document.getElementById(
                "xid-library-result-count"
            );


        count.textContent =
            `找到 ${items.length} 个媒体`;


        if (
            !items.length
        ) {

            xidLibraryGalleryInner.innerHTML = `

                <div
                    class="loader"
                    style="grid-column:1/-1;"
                >
                    当前条件下没有媒体。
                </div>

            `;

            return;

        }


        items.forEach(
            function (item) {

                xidLibraryGalleryInner.appendChild(
                    createLibraryItem(
                        item
                    )
                );

            }
        );

    }


    /* =====================================================
       统一媒体字段
    ===================================================== */

    function normalizeLibraryItem(
        item
    ) {

        return {

            id:
                item.id || "",

            type:
                item.type ||
                item.media_type ||
                "image",

            url:
                item.url ||
                item.media_url ||
                "",

            originalUrl:
                item.originalUrl ||
                item.original_url ||
                item.url ||
                item.media_url ||
                "",

            thumbnail:
                item.thumbnail ||
                item.url ||
                item.media_url ||
                "",

            streamType:
                item.streamType ||
                "",

            tweet_url:
                item.tweet_url ||
                "",

            tweet_id:
                item.tweet_id ||
                "",

            author:
                item.author ||
                "",

            source:
                item.source ||
                "",

            createdAt:
                item.createdAt ||
                "",

            downloaded:
                item.downloaded === true

        };

    }


    /* =====================================================
       创建 Likes / Bookmarks 媒体卡片
    ===================================================== */

    function createLibraryItem(
        rawItem
    ) {

        const item =
            normalizeLibraryItem(
                rawItem
            );


        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "item xid-library-item";


        const mediaWrap =
            document.createElement(
                "div"
            );

        mediaWrap.className =
            "media-wrap";


        const img =
            document.createElement(
                "img"
            );


        if (
            item.type ===
            "video"
        ) {

            img.src =
                item.thumbnail ||
                "";

        } else {

            img.src =
                item.thumbnail ||
                item.url ||
                "";

        }


        img.loading =
            "lazy";


        img.alt =
            item.author
                ? `@${item.author}`
                : "";


        img.addEventListener(
            "click",
            function () {

                openLibraryModal(
                    item
                );

            }
        );


        mediaWrap.appendChild(
            img
        );


        if (
            item.type ===
            "video"
        ) {

            const badge =
                document.createElement(
                    "div"
                );

            badge.className =
                "video-badge";

            badge.textContent =
                "▶ 视频";

            mediaWrap.appendChild(
                badge
            );

        }


        if (
            item.downloaded
        ) {

            const badge =
                document.createElement(
                    "div"
                );

            badge.className =
                "xid-downloaded-badge";

            badge.textContent =
                "✓ 已下载";

            mediaWrap.appendChild(
                badge
            );

        }


        const info =
            document.createElement(
                "div"
            );

        info.className =
            "item-info";


        const date =
            document.createElement(
                "div"
            );

        date.className =
            "item-date";

        date.textContent =
            formatLibraryDate(
                item.createdAt
            );


        info.appendChild(
            date
        );


        const author =
            document.createElement(
                "div"
            );

        author.className =
            "item-date";

        author.style.marginTop =
            "3px";

        author.textContent =
            item.author
                ? `@${item.author}`
                : "";


        info.appendChild(
            author
        );


        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "item-actions";


        const view =
            document.createElement(
                "button"
            );

        view.className =
            "small-btn";

        view.textContent =
            item.type ===
            "video"
                ? "▶ 播放"
                : "查看大图";


        view.addEventListener(
            "click",
            function () {

                openLibraryModal(
                    item
                );

            }
        );


        const download =
            document.createElement(
                "button"
            );

        download.className =
            "small-btn";

        download.textContent =
            item.type ===
            "video"
                ? "⬇ 下载视频"
                : "⬇ 下载原图";


        download.addEventListener(
            "click",
            function () {

                downloadLibraryItem(
                    item
                );

            }
        );


        const post =
            document.createElement(
                "button"
            );

        post.className =
            "small-btn";

        post.textContent =
            "原帖";


        post.addEventListener(
            "click",
            function () {

                if (
                    item.tweet_url
                ) {

                    window.open(
                        item.tweet_url,
                        "_blank"
                    );

                }

            }
        );


        actions.appendChild(
            view
        );

        actions.appendChild(
            download
        );

        actions.appendChild(
            post
        );


        info.appendChild(
            actions
        );


        wrapper.appendChild(
            mediaWrap
        );

        wrapper.appendChild(
            info
        );


        return wrapper;

    }


    /* =====================================================
       日期显示
    ===================================================== */

    function formatLibraryDate(
        value
    ) {

        if (!value) {

            return "";

        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return value;

        }


        return date.toLocaleString(
            "zh-CN",
            {
                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        );

    }


    /* =====================================================
       下载文件名
    ===================================================== */

    function getLibraryFilename(
        item
    ) {

        const date =
            item.createdAt
                ? item.createdAt
                    .slice(
                        0,
                        10
                    )
                : "x-media";


        if (
            item.type ===
            "video"
        ) {

            return (
                `${date}-${item.id || "video"}.mp4`
            );

        }


        let extension =
            ".jpg";


        const url =
            (
                item.originalUrl ||
                item.url ||
                ""
            ).toLowerCase();


        if (
            url.includes(
                ".png"
            )
        ) {

            extension =
                ".png";

        } else if (
            url.includes(
                ".webp"
            )
        ) {

            extension =
                ".webp";
        }


        return (
            `${date}-${item.id || "image"}${extension}`
        );

    }


    /* =====================================================
       标记服务器已下载
    ===================================================== */

    async function markLibraryDownloaded(
        item
    ) {

        if (
            !item.id
        ) {

            return;

        }


        try {

            await fetch(
                `/api/media/${encodeURIComponent(item.id)}/downloaded`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            downloaded:
                                true
                        })
                }
            );


            item.downloaded =
                true;


        } catch (
            error
        ) {

            console.warn(
                "[XID] mark downloaded failed:",
                error
            );

        }

    }


    /* =====================================================
       下载媒体
    ===================================================== */

    async function downloadLibraryItem(
        item
    ) {

        const normalized =
            normalizeLibraryItem(
                item
            );


        const filename =
            getLibraryFilename(
                normalized
            );


        try {

            /*
             * HLS 视频：
             * 必须交给 FFmpeg 转 MP4。
             */

            if (
                normalized.type ===
                "video" &&
                (
                    normalized.streamType ===
                    "hls" ||
                    normalized.url
                        .includes(
                            ".m3u8"
                        )
                )
            ) {

                xidLibraryStatus.className =
                    "xid-library-status";

                xidLibraryStatus.textContent =
                    "正在请求服务器转换视频为 MP4…";


                const url =
                    "/api/video-download?url=" +
                    encodeURIComponent(
                        normalized.url
                    ) +
                    "&filename=" +
                    encodeURIComponent(
                        filename
                    );


                window.location.href =
                    url;


                /*
                 * 浏览器已经开始下载。
                 * 这里记录服务器状态。
                 */

                await markLibraryDownloaded(
                    normalized
                );


                return;

            }


            /*
             * 普通图片 / MP4
             */

            const mediaUrl =
                normalized.originalUrl ||
                normalized.url;


            if (
                !mediaUrl
            ) {

                throw new Error(
                    "媒体地址为空"
                );

            }


            const url =
                "/api/download?url=" +
                encodeURIComponent(
                    mediaUrl
                ) +
                "&filename=" +
                encodeURIComponent(
                    filename
                );


            window.location.href =
                url;


            await markLibraryDownloaded(
                normalized
            );


        } catch (
            error
        ) {

            console.error(
                "[XID] library download error:",
                error
            );


            xidLibraryStatus.className =
                "xid-library-status error";


            xidLibraryStatus.textContent =
                "下载失败：\n" +
                (
                    error &&
                    error.message
                        ? error.message
                        : String(error)
                );

        }

    }


    /* =====================================================
       媒体库 Modal
    ===================================================== */

    function openLibraryModal(
        rawItem
    ) {

        const item =
            normalizeLibraryItem(
                rawItem
            );


        currentItem =
            item;


        modalContent.innerHTML =
            "";


        if (
            item.type ===
            "video"
        ) {

            const video =
                document.createElement(
                    "video"
                );


            /*
             * HLS 可以直接交给支持 HLS 的浏览器。
             *
             * 下载仍然走 /api/video-download。
             */

            video.src =
                item.url ||
                "";


            video.controls =
                true;

            video.autoplay =
                true;

            video.playsInline =
                true;


            video.style.maxWidth =
                "100%";

            video.style.maxHeight =
                "100%";


            modalContent.appendChild(
                video
            );


            downloadButton.textContent =
                "⬇ 下载 MP4";


        } else {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                item.originalUrl ||
                item.url ||
                "";


            img.alt =
                item.author
                    ? `@${item.author}`
                    : "";


            modalContent.appendChild(
                img
            );


            downloadButton.textContent =
                "⬇ 下载原图";

        }


        originalButton.textContent =
            "🔗 打开原帖";


        modal.classList.remove(
            "hidden"
        );

    }


    /* =====================================================
       覆盖原下载按钮
       ===================================================== */

    downloadButton.addEventListener(
        "click",
        function (event) {

            if (
                xidMode ===
                "search"
            ) {

                return;

            }


            event.stopImmediatePropagation();


            if (
                currentItem
            ) {

                downloadLibraryItem(
                    currentItem
                );

            }

        },
        true
    );


    /* =====================================================
       模式下原帖按钮
    ===================================================== */

    originalButton.addEventListener(
        "click",
        function (event) {

            if (
                xidMode ===
                "search"
            ) {

                return;

            }


            event.stopImmediatePropagation();


            if (
                currentItem &&
                currentItem.tweet_url
            ) {

                window.open(
                    currentItem.tweet_url,
                    "_blank"
                );

            }

        },
        true
    );


    /* =====================================================
       初始状态
    ===================================================== */

    switchMode(
        "search"
    );


})();

</script>
