<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<title>X 媒体找图器</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #f5f5f7;

    color: #111;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

button,
input {

    font-family: inherit;
}

button {

    cursor: pointer;
}

.container {

    width: 100%;

    max-width: 950px;

    margin: auto;

    padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(30px + env(safe-area-inset-bottom));
}

h1 {

    margin: 0 0 5px;

    font-size: 25px;

    letter-spacing: -.5px;
}

.subtitle {

    color: #777;

    font-size: 13px;

    margin-bottom: 17px;
}


/* =====================================================
   通用卡片
===================================================== */

.card {

    background: #fff;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 14px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.04);
}

.hidden {

    display: none !important;
}

label {

    display: block;

    color: #666;

    font-size: 13px;

    margin-bottom: 7px;
}


/* =====================================================
   一级模式菜单
===================================================== */

.mode-grid {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 10px;

    margin-bottom: 14px;
}

.mode-button {

    min-height: 92px;

    border: 1px solid #ddd;

    border-radius: 15px;

    background: #fff;

    text-align: left;

    padding: 13px;

    transition:
        transform .12s,
        background .12s,
        border-color .12s;
}

.mode-button:active {

    transform: scale(.98);
}

.mode-button.active {

    background: #111;

    color: #fff;

    border-color: #111;
}

.mode-icon {

    display: block;

    font-size: 24px;

    margin-bottom: 7px;
}

.mode-title {

    display: block;

    font-size: 14px;

    font-weight: 700;
}

.mode-desc {

    display: block;

    margin-top: 4px;

    font-size: 11px;

    color: #888;
}

.mode-button.active .mode-desc {

    color: #bbb;
}


/* =====================================================
   搜索博主
===================================================== */

.profile-row {

    display: flex;

    gap: 8px;
}

.profile-input-wrap {

    flex: 1;
}

input[type="text"],
input[type="date"] {

    width: 100%;

    height: 46px;

    border: 1px solid #ddd;

    border-radius: 11px;

    padding: 0 12px;

    font-size: 16px;

    background: #fff;

    outline: none;
}

input:focus {

    border-color: #111;
}

.favorite-add {

    height: 46px;

    min-width: 78px;

    border: 1px solid #ddd;

    background: #fff;

    border-radius: 11px;

    font-size: 13px;

    white-space: nowrap;
}


/* =====================================================
   收藏博主
===================================================== */

.favorite-entry {

    margin-top: 10px;
}

.favorite-main-button {

    width: 100%;

    height: 42px;

    border: 1px solid #ddd;

    background: #fafafa;

    border-radius: 11px;

    font-size: 14px;

    text-align: left;

    padding: 0 13px;
}

.favorites-panel {

    margin-top: 10px;

    border: 1px solid #eee;

    border-radius: 12px;

    overflow: hidden;
}

.favorite-empty {

    padding: 18px 12px;

    color: #999;

    font-size: 13px;

    text-align: center;
}

.favorite-item {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 11px 10px;

    border-bottom: 1px solid #eee;
}

.favorite-item:last-child {

    border-bottom: 0;
}

.favorite-info {

    flex: 1;

    min-width: 0;
}

.favorite-name {

    font-size: 14px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.favorite-handle {

    color: #888;

    font-size: 12px;

    margin-top: 2px;
}

.favorite-actions {

    display: flex;

    gap: 5px;
}

.favorite-use,
.favorite-delete {

    height: 32px;

    border-radius: 8px;

    padding: 0 8px;

    font-size: 11px;

    border: 1px solid #ddd;

    background: #fff;
}

.favorite-use {

    background: #111;

    color: #fff;

    border-color: #111;
}


/* =====================================================
   时间 / 筛选
===================================================== */

.section {

    margin-top: 15px;
}

.option-row {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}

.option {

    border: 1px solid #ddd;

    background: #fafafa;

    border-radius: 20px;

    padding: 8px 12px;

    font-size: 13px;
}

.option.active {

    background: #111;

    color: #fff;

    border-color: #111;
}

.date-row {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.custom-dates {

    margin-top: 11px;
}


/* =====================================================
   主按钮
===================================================== */

.primary {

    width: 100%;

    height: 48px;

    border: 0;

    border-radius: 12px;

    background: #111;

    color: #fff;

    font-size: 16px;

    font-weight: 600;

    margin-top: 17px;
}

.primary:disabled {

    opacity: .45;
}


/* =====================================================
   媒体库工具栏
===================================================== */

.library-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 12px;
}

.library-title {

    font-size: 17px;

    font-weight: 700;
}

.library-count {

    color: #777;

    font-size: 12px;

    margin-top: 3px;
}

.refresh-button {

    border: 1px solid #ddd;

    background: #fff;

    border-radius: 9px;

    padding: 8px 11px;

    font-size: 12px;
}


/* =====================================================
   状态
===================================================== */

.status {

    font-size: 14px;

    line-height: 1.6;
}

.error {

    color: #d00;

    white-space: pre-wrap;
}

.loader {

    text-align: center;

    padding: 20px;

    color: #777;
}


/* =====================================================
   结果
===================================================== */

.result-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 13px;
}

.result-title {

    font-size: 16px;

    font-weight: 700;
}

.result-count {

    color: #777;

    font-size: 12px;

    margin-top: 4px;
}


/* =====================================================
   正常 Grid
   左 → 右
   上 → 下
===================================================== */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 9px;

    align-items: start;
}


/* =====================================================
   媒体卡片
===================================================== */

.item {

    min-width: 0;

    background: #fff;

    border: 1px solid #eee;

    border-radius: 12px;

    overflow: hidden;
}

.media-wrap {

    position: relative;

    width: 100%;

    background: #eee;

    overflow: hidden;
}

.media-wrap img {

    display: block;

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    cursor: pointer;
}

.media-error {

    width: 100%;

    aspect-ratio: 1 / 1;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #eee;

    color: #999;

    font-size: 13px;

    text-align: center;

    padding: 12px;
}

.video-badge {

    position: absolute;

    left: 7px;

    top: 7px;

    background: rgba(0,0,0,.75);

    color: #fff;

    border-radius: 20px;

    padding: 5px 8px;

    font-size: 10px;
}

.source-badge {

    position: absolute;

    right: 7px;

    top: 7px;

    background: rgba(0,0,0,.75);

    color: #fff;

    border-radius: 20px;

    padding: 5px 8px;

    font-size: 10px;
}

.library-badge {

    position: absolute;

    right: 7px;

    top: 7px;

    background: rgba(0,0,0,.75);

    color: #fff;

    border-radius: 20px;

    padding: 5px 8px;

    font-size: 10px;
}

.item-info {

    padding: 8px;
}

.item-author {

    font-size: 11px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-bottom: 3px;
}

.item-date {

    color: #888;

    font-size: 10px;
}

.item-actions {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 4px;

    margin-top: 7px;
}

.small-btn {

    height: 32px;

    border: 1px solid #ddd;

    background: #fff;

    border-radius: 7px;

    font-size: 10px;

    padding: 0 2px;

    white-space: nowrap;
}


/* =====================================================
   Modal
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 1000;

    background: rgba(0,0,0,.95);

    display: flex;

    flex-direction: column;
}

.modal-top {

    min-height: 58px;

    padding:
        env(safe-area-inset-top)
        12px
        0
        12px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.modal-button {

    border: 0;

    background: rgba(255,255,255,.12);

    color: #fff;

    border-radius: 20px;

    padding: 8px 13px;
}

.modal-content {

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10px;

    overflow: auto;
}

.modal-content img {

    max-width: 100%;

    max-height: 100%;

    object-fit: contain;
}

.modal-content video {

    max-width: 100%;

    max-height: 100%;
}

.modal-bottom {

    padding:
        10px
        12px
        calc(12px + env(safe-area-inset-bottom));

    display: flex;

    gap: 8px;
}

.modal-bottom button {

    flex: 1;

    height: 45px;

    border: 0;

    border-radius: 10px;

    font-size: 14px;
}

.download {

    background: #fff;

    color: #111;
}

.original {

    background: rgba(255,255,255,.15);

    color: #fff;
}


/* =====================================================
   大屏
===================================================== */

@media (min-width: 700px) {

    .gallery {

        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

}


/* =====================================================
   小屏
===================================================== */

@media (max-width: 560px) {

    .mode-grid {

        grid-template-columns:
            1fr;
    }

    .mode-button {

        min-height: 70px;
    }

    .mode-icon {

        display: inline;

        margin-right: 6px;

        font-size: 20px;
    }

}

@media (max-width: 380px) {

    .item-actions {

        grid-template-columns:
            1fr 1fr;
    }

    .item-actions
    .small-btn:last-child {

        grid-column:
            1 / -1;
    }

}

</style>

<!-- HLS 视频播放支持（m3u8） -->

</head>

/* =====================================================
   API URL
===================================================== */

function buildDownloadUrl(
    url,
    filename
) {

    if (!url) {

        return "";
    }

    return (
        "/api/download?url=" +
        encodeURIComponent(
            url
        ) +
        "&filename=" +
        encodeURIComponent(
            filename ||
            "x-media"
        )
    );

}


function buildVideoDownloadUrl(
    url,
    filename
) {

    if (!url) {

        return "";
    }

    return (
        "/api/video-download?url=" +
        encodeURIComponent(
            url
        ) +
        "&filename=" +
        encodeURIComponent(
            filename ||
            "x-video.mp4"
        )
    );

}


/* =====================================================
   收藏博主
===================================================== */

const FAVORITE_KEY =
    "x_media_finder_favorites_v31";


function getFavorites() {

    try {

        const data =
            localStorage.getItem(
                FAVORITE_KEY
            );

        if (!data) {

            return [];
        }

        const parsed =
            JSON.parse(
                data
            );

        return Array.isArray(
            parsed
        )
            ? parsed
            : [];

    } catch (e) {

        return [];

    }

}


function saveFavorites(
    favorites
) {

    localStorage.setItem(
        FAVORITE_KEY,
        JSON.stringify(
            favorites
        )
    );

}


/* =====================================================
   用户名
===================================================== */

function normalizeUsername(
    input
) {

    let value =
        input.trim();

    if (!value) {

        return null;
    }


    if (
        value.includes(
            "x.com/"
        )
        ||
        value.includes(
            "twitter.com/"
        )
    ) {

        if (
            !value.startsWith(
                "http://"
            )
            &&
            !value.startsWith(
                "https://"
            )
        ) {

            value =
                "https://" +
                value;
        }

        try {

            const url =
                new URL(
                    value
                );

            const parts =
                url.pathname
                    .split("/")
                    .filter(
                        Boolean
                    );

            if (
                parts.length
            ) {

                value =
                    parts[0];
            }

        } catch (e) {

            return null;
        }

    }


    value =
        value.replace(
            /^@+/,
            ""
        );

    value =
        value.replace(
            /\/+$/,
            ""
        );

    value =
        value.replace(
            /[^A-Za-z0-9_]/g,
            ""
        );

    return (
        value ||
        null
    );

}


/* =====================================================
   收藏按钮
===================================================== */

function updateFavoriteButton() {

    const username =
        normalizeUsername(
            profileInput.value
        );

    if (!username) {

        favoriteAdd.textContent =
            "☆ 收藏";

        return;
    }


    const favorites =
        getFavorites();

    const exists =
        favorites.some(
            item =>
                item.username
                    .toLowerCase()
                ===
                username
                    .toLowerCase()
        );


    favoriteAdd.textContent =
        exists
            ? "★ 已收藏"
            : "☆ 收藏";

}


profileInput.addEventListener(
    "input",
    updateFavoriteButton
);


/* =====================================================
   添加 / 删除收藏
===================================================== */

favoriteAdd.addEventListener(
    "click",
    () => {

        const username =
            normalizeUsername(
                profileInput.value
            );

        if (!username) {

            showError(
                "请先输入博主名，例如 NASA 或 @NASA"
            );

            return;
        }


        const favorites =
            getFavorites();

        const index =
            favorites.findIndex(
                item =>
                    item.username
                        .toLowerCase()
                    ===
                    username
                        .toLowerCase()
            );


        if (
            index >= 0
        ) {

            favorites.splice(
                index,
                1
            );

        } else {

            favorites.push({

                username:
                    username,

                name:
                    username,

                addedAt:
                    Date.now()

            });

        }


        saveFavorites(
            favorites
        );

        updateFavoriteButton();

        renderFavorites();

    }
);

function renderFavorites() {

    const favorites =
        getFavorites();

    favoritesPanel.innerHTML =
        "";


    if (
        !favorites.length
    ) {

        favoritesPanel.innerHTML =
            `
            <div class="favorite-empty">
                暂时没有收藏的博主
            </div>
            `;

        return;
    }


    favorites.forEach(
        (
            favorite,
            index
        ) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "favorite-item";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "favorite-info";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "favorite-name";

            name.textContent =
                favorite.name ||
                favorite.username;


            const handle =
                document.createElement(
                    "div"
                );

            handle.className =
                "favorite-handle";

            handle.textContent =
                "@" +
                favorite.username;


            info.appendChild(
                name
            );

            info.appendChild(
                handle
            );


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "favorite-actions";


            const use =
                document.createElement(
                    "button"
                );

            use.className =
                "favorite-use";

            use.textContent =
                "查找";


            use.addEventListener(
                "click",
                () => {

                    profileInput.value =
                        favorite.username;

                    updateFavoriteButton();

                    favoritesPanel.classList.add(
                        "hidden"
                    );

                    window.scrollTo({

                        top: 0,

                        behavior:
                            "smooth"

                    });

                }
            );


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "favorite-delete";

            remove.textContent =
                "删除";


            remove.addEventListener(
                "click",
                () => {

                    const list =
                        getFavorites();

                    list.splice(
                        index,
                        1
                    );

                    saveFavorites(
                        list
                    );

                    renderFavorites();

                    updateFavoriteButton();

                }
            );


            actions.appendChild(
                use
            );

            actions.appendChild(
                remove
            );


            item.appendChild(
                info
            );

            item.appendChild(
                actions
            );


            favoritesPanel.appendChild(
                item
            );

        }
    );

}

) {

    currentMode =
        mode;


    modeSearch.classList.toggle(
        "active",
        mode === "search"
    );

    modeLikes.classList.toggle(
        "active",
        mode === "likes"
    );

    modeBookmarks.classList.toggle(

        mode === "bookmarks"
    );


    if (
        mode === "search"
    ) {

        searchPanel.classList.remove(
            "hidden"

        libraryPanel.classList.add(
            "hidden"

/* =====================================================
   日期
===================================================== */

function formatDate(
    date
) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const d =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        `${y}-${m}-${d}`
    );

}


function getDates() {

    if (
        range ===
        "all"
    ) {

        return {

            start:
                null,

            end:
                null

        };

    }


    if (
        range ===
        "custom"
    ) {

        return {

            start:
                startDate.value ||
                null,

            end:
                endDate.value ||
                null

        };

    }


    const now =
        new Date();

    const start =
        new Date(
            now
        );

    start.setDate(
        start.getDate()
        -
        Number(
            range
        )
    );


    return {

        start:
            formatDate(
                start
            ),

        end:
            formatDate(
                now
            )

    };

}

searchButton.addEventListener(

async function search() {

    const raw =
        profileInput.value.trim();

    const username =
        normalizeUsername(
            raw
        );


    if (!username) {

        showError(
            "无法识别博主。\n\n" +
            "可以输入：\n" +
            "NASA\n" +
            "@NASA\n" +
            "x.com/NASA\n" +
            "https://x.com/NASA"
        );

        return;
    }


    const profile =
        `https://x.com/${username}`;


    const dates =
        getDates();


    if (
        dates.start &&
        dates.end &&
        dates.start >
        dates.end
    ) {

        showError(
            "开始日期不能晚于结束日期"
        );

        return;
    }


    searchButton.disabled =
        true;

    searchButton.textContent =
        "正在寻找媒体…";


    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status";

    status.textContent =
        `正在搜索 @${username}…`;


    resultCard.classList.add(
        "hidden"
    );

    gallery.innerHTML =
        "";


    try {

        const params =
            new URLSearchParams();


        params.set(
            "profile",
            profile
        );


        params.set(
            "media_type",
            mediaType
        );


        /*
         * 搜索博主模式才发送 source_type。
         * Likes / Bookmarks 完全不经过这里。
         */

        params.set(
            "source_type",
            sourceType
        );


        if (
            dates.start
        ) {

            params.set(
                "start_date",
                dates.start
            );

        }


        if (
            dates.end
        ) {

            params.set(
                "end_date",
                dates.end
            );

        }


        const response =
            await fetch(
                `/api/search?${params.toString()}`
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.detail ||
                "搜索失败"
            );

        }


        renderSearchResults(
            data
        );


    } catch (error) {

        showError(
            error.message ||
            "搜索失败"
        );


    } finally {

        searchButton.disabled =
            false;

        searchButton.textContent =
            "开始找图";

    }

}

async function loadLibrary() {

    if (
        currentMode !==
        "likes"
        &&
        currentMode !==
        "bookmarks"
    ) {

        return;
    }


    updateLibraryTitle();


    libraryCount.textContent =
        "正在读取媒体库……";


    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status";

    status.textContent =
        "正在读取服务器媒体库……";


    resultCard.classList.add(
        "hidden"
    );

    gallery.innerHTML =
        "";


    try {

        const params =
            new URLSearchParams();


        params.set(
            "source",
            currentMode
        );


        params.set(
            "media_type",
            libraryMediaType
        );


        const response =
            await fetch(
                `/api/media?${params.toString()}`
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.detail ||
                "读取媒体库失败"
            );

        }


        if (
            !data.ok
        ) {

            throw new Error(
                data.detail ||
                "媒体库返回异常"
            );

        }


        renderLibraryResults(
            data
        );


    } catch (error) {

        libraryCount.textContent =
            "读取失败";

        showError(
            "媒体库读取失败：\n\n" +
            (
                error.message ||
                String(
                    error
                )
            )
        );

    }

}

            );

/* =====================================================
   媒体库结果
   =====================================================
   
   核心修改：
   
   Likes / Bookmarks 的数据在这里按照 createdAt
   从最新 → 最旧排序。

   搜索博主不经过这个排序。

   因此：
   
   第一张 = 最新
   第二张 = 第二新
   第三张 = 第三新
   ...
   
   同一时间的媒体保持服务器原始顺序。
===================================================== */

function renderLibraryResults(
    data
) {

    statusCard.classList.add(
        "hidden"
    );

    resultCard.classList.remove(
        "hidden"
    );


    const title =
        currentMode ===
        "likes"
            ? "❤️ 我的喜欢"
            : "🔖 我的书签";


    resultTitle.textContent =
        title;


    resultCount.textContent =
        `共 ${data.count || 0} 个媒体`;


    libraryCount.textContent =
        `共 ${data.count || 0} 个媒体`;


    gallery.innerHTML =
        "";


    if (
        !data.items ||
        data.items.length === 0
    ) {

        gallery.innerHTML =
            `
            <div
                class="loader"
                style="grid-column:1/-1;"
            >
                目前还没有上传到这里的媒体。
            </div>
            `;

        return;
    }


    /*
     * =================================================
     * 最新 → 最旧
     *
     * 使用副本排序，绝不修改后端返回的 data.items。
     *
     * 服务器返回：
     *
     * [
     *   最新，
     *   旧，
     *   更旧，
     *   ...
     * ]
     *
     * 或者：
     *
     * [
     *   旧，
     *   新，
     *   更新，
     *   ...
     * ]
     *
     * 最终都会被统一整理为：
     *
     * 最新 → 最旧
     * =================================================
     */

    const sortedItems =
        [...data.items].sort(
            (
                a,
                b
            ) => {

                const valueA =
                    a.createdAt ||
                    a.created_at ||
                    a.created ||
                    a.timestamp ||
                    "";

                const valueB =
                    b.createdAt ||
                    b.created_at ||
                    b.created ||
                    b.timestamp ||
                    "";


                const timeA =
                    Date.parse(
                        valueA
                    );

                const timeB =
                    Date.parse(
                        valueB
                    );


                const validA =
                    Number.isFinite(
                        timeA
                    );

                const validB =
                    Number.isFinite(
                        timeB
                    );


                /*
                 * 两个都有有效时间：
                 *
                 * 新 → 旧
                 */
                if (
                    validA &&
                    validB
                ) {

                    return (
                        timeB -
                        timeA
                    );

                }


                /*
                 * A 没有时间，
                 * B 有时间：
                 *
                 * B 应该排前面。
                 */
                if (
                    !validA &&
                    validB
                ) {

                    return 1;

                }


                /*
                 * A 有时间，
                 * B 没有时间：
                 *
                 * A 应该排前面。
                 */
                if (
                    validA &&
                    !validB
                ) {

                    return -1;

                }


                /*
                 * 两个都没有时间：
                 *
                 * 保持原始顺序。
                 */
                return 0;

            }
        );


    /*
     * =================================================
     * 按照排序后的结果进行渲染。
     * =================================================
     */

    sortedItems.forEach(
        item => {

            gallery.appendChild(
                createLibraryItem(
                    item
                )
            );

        }
    );

}


/* =====================================================
   X 日期格式
===================================================== */

function formatDateFromX(
    value
) {

    if (!value) {

        return "";
    }


    const match =
        value.match(
            /^\w+\s+(\w+)\s+(\d+).*?(\d{4})$/
        );


    if (!match) {

        return value;
    }


    const months = {

        Jan:
            "01",

        Feb:
            "02",

        Mar:
            "03",

        Apr:
            "04",

        May:
            "05",

        Jun:
            "06",

        Jul:
            "07",

        Aug:
            "08",

        Sep:
            "09",

        Oct:
            "10",

        Nov:
            "11",

        Dec:
            "12"

    };


    const month =
        months[
            match[1]
        ];


    if (!month) {

        return value;
    }


    return (
        `${match[3]}-` +
        `${month}-` +
        `${String(
            match[2]
        ).padStart(
            2,
            "0"
        )}`
    );

}


/* =====================================================
   文件名
===================================================== */

function getFilename(
    item
) {

    let date =
        formatDateFromX(
            item.created_at ||
            item.createdAt
        );


    if (!date) {

        date =
            "x-media";
    }


    let suffix =
        "";


    if (
        item.media_total &&
        item.media_total > 1
    ) {

        suffix =
            `-${item.media_index}`;

    }


    let extension =
        ".jpg";


    const type =
        item.media_type ||
        item.type;


    const rawUrl =
        item.originalUrl ||
        item.sourceUrl ||
        item.media_url ||
        item.url ||
        "";


    const lower =
        String(
            rawUrl
        ).toLowerCase();


    if (
        type ===
        "video"
    ) {

        extension =
            ".mp4";

    } else if (
        lower.includes(
            ".png"
        )
    ) {

        extension =
            ".png";

    } else if (
        lower.includes(
            ".webp"
        )
    ) {

        extension =
            ".webp";

    } else if (
        lower.includes(
            ".gif"
        )
    ) {

        extension =
            ".gif";

    }


    return (
        `${date}${suffix}${extension}`
    );

}


/* =====================================================
   媒体错误处理
===================================================== */

function replaceBrokenMedia(
    img,
    mediaWrap
) {

    if (!img) {

        return;
    }


    if (
        img.dataset.failed ===
        "1"
    ) {

        return;
    }


    img.dataset.failed =
        "1";


    /*
     * 如果当前地址已经是本地媒体代理，
     * 再失败一次就显示错误。
     *
     * 不再无限循环请求。
     */

    const currentSrc =
        img.src ||
        "";


    if (
        currentSrc.includes(
            "/api/media-proxy"
        )
    ) {

        const error =
            document.createElement(
                "div"
            );

        error.className =
            "media-error";

        error.textContent =
            "媒体暂时无法加载";

        img.replaceWith(
            error
        );

        return;
    }


    /*
     * 如果不是代理地址，
     * 尝试使用后端媒体代理。
     */

    const source =
        img.getAttribute(
            "src"
        );


    if (!source) {

        const error =
            document.createElement(
                "div"
            );

        error.className =
            "media-error";

        error.textContent =
            "媒体暂时无法加载";

        img.replaceWith(
            error
        );

        return;
    }


    const proxy =
        "/api/media-proxy?url=" +
        encodeURIComponent(
            source
        );


    img.dataset.originalSrc =
        source;

    img.src =
        proxy;


    img.dataset.proxyAttempted =
        "1";


    img.onerror =
        () => {

            const error =
                document.createElement(
                    "div"
                );

            error.className =
                "media-error";

            error.textContent =
                "媒体暂时无法加载";

            img.replaceWith(
                error
            );

        };

}


/* =====================================================
   创建搜索媒体卡片
===================================================== */

function createSearchItem(
    item
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "item";


    const mediaWrap =
        document.createElement(
            "div"
        );

    mediaWrap.className =
        "media-wrap";


    const img =
        document.createElement(

/* =====================================================
   媒体库数据转换
===================================================== */

function normalizeLibraryItem(
    item
) {

    const type =
        item.type ||
        item.media_type ||
        "image";


    const mediaUrl =
        item.url ||
        item.media_url ||
        item.sourceUrl ||
        "";


    const originalUrl =
        item.originalUrl ||
        item.sourceUrl ||
        mediaUrl;


    return {

        media_type:
            type,

        media_url:
            mediaUrl,

        video_url:
            type ===
            "video"
                ? mediaUrl
                : "",

        thumbnail:
            item.thumbnail ||
            "",

        tweet_url:
            item.tweet_url ||
            "",

        author:
            item.author ||
            "",

        created_at:
            item.createdAt ||
            item.created_at ||
            "",

        originalUrl:
            originalUrl,

        libraryId:
            item.id ||
            "",

        width:
            item.width ||
            0,

        height:
            item.height ||
            0,

        bitrate:
            item.bitrate ||
            0,

        streamType:
            item.streamType ||
            ""

    };

}


/* =====================================================
   媒体库日期
===================================================== */

function formatLibraryDate(
    value
) {

    if (!value) {

        return "";
    }


    try {

        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";
        }


        return (
            date.getFullYear() +
            "-" +
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            ) +
            "-" +
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            )
        );

    } catch (e) {

        return "";

    }

}


/* =====================================================
   下载
===================================================== */

function downloadItem(
    item
) {

    const url =
        item.originalUrl ||
        item.media_url ||
        item.url ||
        "";


    if (!url) {

        alert(
            "这个媒体暂时没有可下载地址。"
        );

        return;
    }


    /*
     * 扩展视频检测：
     * type 标记或 URL 后缀为 .m3u8 / .mp4 / .webm
     */
    const isVideo =
        item.media_type ===
        "video"
        ||
        item.type ===
        "video"
        ||
        url.includes(
            ".m3u8"
        )
        ||
        url.includes(
            ".mp4"
        )
        ||
        url.includes(
            ".webm"
        );


    const filename =
        getFilename(
            item
        );


    if (
        isVideo
    ) {

        const videoFilename =
            filename.endsWith(
                ".mp4"
            )
                ? filename
                : filename +
                  ".mp4";


        window.location.href =
            buildVideoDownloadUrl(
                url,
                videoFilename
            );

        return;

    }


    window.location.href =
        buildDownloadUrl(
            url,
            filename
        );

}


/* =====================================================
   Modal - 核心修复 v3：利用后端代理在线播放 MP4
===================================================== */

function openModal(item) {

    currentItem = item;

    modalContent.innerHTML = "";

    // 获取视频 URL（此时后端已经返回了 /api/media-proxy 地址）
    let rawVideoUrl =
        item.video_url ||
        item.media_url ||
        item.url ||
        "";

    // 判断是不是 HLS（.m3u8）
    const isHlsUrl =
        rawVideoUrl.includes(".m3u8") ||
        item.streamType === "hls";

    // 判断是不是普通 MP4
    const isMp4Url =
        rawVideoUrl.includes(".mp4");

    // 综合判断是不是视频
    const isVideo =
        item.media_type === "video" ||
        item.type === "video" ||
        isHlsUrl ||
        isMp4Url;

    if (isVideo) {

        if (!rawVideoUrl) {
            modalContent.innerHTML =
                `
                <div class="media-error" style="width:100%;max-width:500px;color:#fff;background:#222;">
                    该视频暂无可用播放地址
                </div>
                `;
            downloadButton.textContent = "⬇ 下载视频";
            modal.classList.remove("hidden");
            return;
        }

        const video = document.createElement("video");
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.preload = "metadata";

        // =============================================
        // 核心改动：如果是 MP4，强制走后端代理
        // 这样就能像“下载”一样拿到数据了
        // =============================================
        if (isMp4Url) {
            // 如果 URL 还不是代理地址，手动转成代理地址
            if (!rawVideoUrl.startsWith("/api/media-proxy")) {
                rawVideoUrl = "/api/media-proxy?url=" + encodeURIComponent(rawVideoUrl);
            }
            video.src = rawVideoUrl;
        } 
        // HLS 处理（m3u8）：Safari 原生支持，Chrome 用 hls.js
        else if (isHlsUrl) {
            if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = rawVideoUrl;
            } else if (typeof Hls !== "undefined" && Hls.isSupported()) {
                if (currentHls) {
                    currentHls.destroy();
                    currentHls = null;
                }
                currentHls = new Hls();
                currentHls.loadSource(rawVideoUrl);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.ERROR, function(_event, data) {
                    if (data.fatal) {
                        modalContent.innerHTML =
                            `
                            <div class="media-error" style="width:100%;max-width:500px;color:#fff;background:#222;">
                                视频暂时无法加载
                            </div>
                            `;
                    }
                });
            } else {
                modalContent.innerHTML =
                    `
                    <div class="media-error" style="width:100%;max-width:500px;color:#fff;background:#222;">
                        当前浏览器不支持该视频格式
                    </div>
                    `;
                downloadButton.textContent = "⬇ 下载视频";
                modal.classList.remove("hidden");
                return;
            }
        } else {
            // 兜底
            video.src = rawVideoUrl;
        }

        // 视频加载错误时的备用方案
        video.onerror = function() {
            // 如果加载失败，提示用户下载
            modalContent.innerHTML =
                `
                <div class="media-error" style="width:100%;max-width:500px;color:#fff;background:#222;">
                    视频在线预览失败，请点击下方“下载视频”保存到本地观看
                </div>
                `;
        };

        modalContent.appendChild(video);
        downloadButton.textContent = "⬇ 下载视频";

    } else {

        // 图片显示（保持不变）
        const img = document.createElement("img");
        img.src = item.media_url || item.url || item.originalUrl || "";
        img.alt = item.alt || "";

        img.onerror = function() {
            const proxySource = item.originalUrl || item.sourceUrl || "";
            if (proxySource && !img.dataset.proxy) {
                img.dataset.proxy = "1";
                img.src = "/api/media-proxy?url=" + encodeURIComponent(proxySource);
                return;
            }
            modalContent.innerHTML =
                `
                <div class="media-error" style="width:100%;max-width:500px;color:#fff;background:#222;">
                    图片暂时无法加载
                </div>
                `;
        };

        modalContent.appendChild(img);
        downloadButton.textContent = "⬇ 下载原图";
    }

    modal.classList.remove("hidden");
}


/* =====================================================
   Modal 关闭 - 核心修复：停止视频播放
===================================================== */

closeModal.addEventListener(
    "click",
    closeModalWindow
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modal
        ) {

            closeModalWindow();

        }

    }
);


function closeModalWindow() {

    const existingVideo =
        modalContent.querySelector("video");

    if (existingVideo) {
        existingVideo.pause();
        existingVideo.removeAttribute("src");
        existingVideo.load();
        existingVideo.remove();
    }

    if (currentHls) {
        currentHls.destroy();
        currentHls = null;
    }

    modal.classList.add("hidden");
    modalContent.innerHTML = "";
    currentItem = null;
}
