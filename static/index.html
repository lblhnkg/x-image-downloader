<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<title>X 图片找图器</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f7;
    color: #111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(30px + env(safe-area-inset-bottom));
}

h1 {
    font-size: 25px;
    margin: 0 0 6px;
}

.subtitle {
    color: #777;
    font-size: 14px;
    margin-bottom: 18px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow:
        0 2px 10px rgba(0,0,0,.04);
}

label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 7px;
}

input[type="text"],
input[type="date"] {
    width: 100%;
    height: 46px;
    border: 1px solid #ddd;
    border-radius: 11px;
    padding: 0 12px;
    font-size: 16px;
    background: #fff;
    outline: none;
}

input:focus {
    border-color: #111;
}

.date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.quick-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.quick {
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 20px;
    padding: 8px 13px;
    font-size: 13px;
}

.quick.active {
    background: #111;
    color: white;
    border-color: #111;
}

.primary {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: 600;
    margin-top: 14px;
}

.primary:disabled {
    opacity: .45;
}

.status {
    font-size: 14px;
    line-height: 1.6;
}

.error {
    color: #d00;
    white-space: pre-wrap;
}

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.result-count {
    font-size: 14px;
    color: #666;
}

.gallery {
    columns: 2;
    column-gap: 8px;
}

.item {
    break-inside: avoid;
    margin-bottom: 8px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}

.item img {
    display: block;
    width: 100%;
    height: auto;
    cursor: pointer;
}

.item-info {
    padding: 8px 9px;
}

.item-date {
    font-size: 11px;
    color: #888;
}

.item-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
}

.small-btn {
    flex: 1;
    min-width: 0;
    height: 34px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 8px;
    font-size: 12px;
}

.small-btn:active {
    background: #eee;
}

.loader {
    text-align: center;
    padding: 20px;
    color: #777;
}

.hidden {
    display: none !important;
}

/* 大图 */

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,.94);
    display: flex;
    flex-direction: column;
}

.modal-top {
    height: 58px;
    padding:
        env(safe-area-inset-top)
        12px
        0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-button {
    border: 0;
    background: rgba(255,255,255,.12);
    color: white;
    border-radius: 20px;
    padding: 8px 13px;
    font-size: 14px;
}

.modal-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: auto;
}

.modal-content img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.modal-bottom {
    padding:
        10px
        12px
        calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
}

.modal-bottom button {
    flex: 1;
    height: 45px;
    border: 0;
    border-radius: 10px;
    font-size: 14px;
}

.download {
    background: white;
    color: #111;
}

.original {
    background: rgba(255,255,255,.15);
    color: white;
}

@media (min-width: 700px) {

    .gallery {
        columns: 3;
    }

}

</style>

</head>

<body>

<div class="container">

    <h1>🖼️ X 图片找图器</h1>

    <div class="subtitle">
        输入 X 博主主页，只显示他发过的图片
    </div>

    <div class="card">

        <label>
            X 博主主页
        </label>

        <input
            id="profile"
            type="text"
            placeholder="例如：https://x.com/NASA"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <label
            style="margin-top:15px;"
        >
            时间范围
        </label>

        <div class="quick-buttons">

            <button
                class="quick active"
                data-range="all"
            >
                全部
            </button>

            <button
                class="quick"
                data-range="7"
            >
                最近7天
            </button>

            <button
                class="quick"
                data-range="30"
            >
                最近30天
            </button>

            <button
                class="quick"
                data-range="365"
            >
                最近1年
            </button>

            <button
                class="quick"
                data-range="custom"
            >
                自定义
            </button>

        </div>

        <div
            id="customDates"
            class="date-row hidden"
            style="margin-top:12px;"
        >

            <div>

                <label>
                    开始日期
                </label>

                <input
                    id="startDate"
                    type="date"
                >

            </div>

            <div>

                <label>
                    结束日期
                </label>

                <input
                    id="endDate"
                    type="date"
                >

            </div>

        </div>

        <button
            id="searchButton"
            class="primary"
        >
            开始找图
        </button>

    </div>

    <div
        id="statusCard"
        class="card hidden"
    >

        <div
            id="status"
            class="status"
        ></div>

    </div>

    <div
        id="resultCard"
        class="card hidden"
    >

        <div class="result-header">

            <div>

                <strong id="resultTitle">
                    图片
                </strong>

                <div
                    id="resultCount"
                    class="result-count"
                ></div>

            </div>

        </div>

        <div
            id="gallery"
            class="gallery"
        ></div>

    </div>

</div>


<!-- 大图 -->

<div
    id="modal"
    class="modal hidden"
>

    <div class="modal-top">

        <button
            id="closeModal"
            class="modal-button"
        >
            ✕ 关闭
        </button>

    </div>

    <div class="modal-content">

        <img
            id="modalImage"
            src=""
            alt=""
        >

    </div>

    <div class="modal-bottom">

        <button
            id="downloadButton"
            class="download"
        >
            ⬇ 下载原图
        </button>

        <button
            id="originalButton"
            class="original"
        >
            🔗 打开原帖
        </button>

    </div>

</div>


<script>

const profileInput =
    document.getElementById("profile");

const searchButton =
    document.getElementById("searchButton");

const statusCard =
    document.getElementById("statusCard");

const status =
    document.getElementById("status");

const resultCard =
    document.getElementById("resultCard");

const resultTitle =
    document.getElementById("resultTitle");

const resultCount =
    document.getElementById("resultCount");

const gallery =
    document.getElementById("gallery");

const customDates =
    document.getElementById("customDates");

const startDate =
    document.getElementById("startDate");

const endDate =
    document.getElementById("endDate");

const modal =
    document.getElementById("modal");

const modalImage =
    document.getElementById("modalImage");

const closeModal =
    document.getElementById("closeModal");

const downloadButton =
    document.getElementById("downloadButton");

const originalButton =
    document.getElementById("originalButton");


let selectedRange = "all";

let currentImage = null;


/* 时间快捷按钮 */

document
    .querySelectorAll(".quick")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".quick")
                    .forEach(b =>
                        b.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );

                selectedRange =
                    button.dataset.range;

                if (
                    selectedRange ===
                    "custom"
                ) {

                    customDates
                        .classList
                        .remove(
                            "hidden"
                        );

                } else {

                    customDates
                        .classList
                        .add(
                            "hidden"
                        );

                }

            }
        );

    });


/* 设置日期 */

function getDates() {

    const now =
        new Date();

    let start = null;
    let end = null;

    if (
        selectedRange ===
        "custom"
    ) {

        start =
            startDate.value || null;

        end =
            endDate.value || null;

        return {
            start,
            end
        };

    }

    if (
        selectedRange ===
        "all"
    ) {

        return {
            start: null,
            end: null
        };

    }

    const days =
        Number(
            selectedRange
        );

    const startDateObj =
        new Date(now);

    startDateObj.setDate(
        startDateObj.getDate()
        - days
    );

    start =
        formatDate(
            startDateObj
        );

    end =
        formatDate(now);

    return {
        start,
        end
    };

}


function formatDate(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;

}


/* 开始搜索 */

searchButton.addEventListener(
    "click",
    search
);


profileInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            search();

        }

    }
);


async function search() {

    const profile =
        profileInput.value.trim();

    if (!profile) {

        showError(
            "请输入 X 博主主页链接"
        );

        return;

    }

    const dates =
        getDates();

    if (
        dates.start &&
        dates.end &&
        dates.start >
        dates.end
    ) {

        showError(
            "开始日期不能晚于结束日期"
        );

        return;

    }

    searchButton.disabled =
        true;

    searchButton.textContent =
        "正在寻找图片…";

    resultCard.classList.add(
        "hidden"
    );

    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status";

    status.textContent =
        "正在连接图片数据源…";

    gallery.innerHTML = "";

    try {

        const params =
            new URLSearchParams();

        params.set(
            "profile",
            profile
        );

        if (dates.start) {

            params.set(
                "start_date",
                dates.start
            );

        }

        if (dates.end) {

            params.set(
                "end_date",
                dates.end
            );

        }

        const response =
            await fetch(
                `/api/search?${params.toString()}`
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "搜索失败"
            );

        }

        renderResults(data);

    } catch (error) {

        showError(
            error.message ||
            "搜索失败"
        );

    } finally {

        searchButton.disabled =
            false;

        searchButton.textContent =
            "开始找图";

    }

}


/* 显示错误 */

function showError(message) {

    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status error";

    status.textContent =
        message;

}


/* 显示结果 */

function renderResults(data) {

    statusCard.classList.add(
        "hidden"
    );

    resultCard.classList.remove(
        "hidden"
    );

    resultTitle.textContent =
        `@${data.username}`;

    resultCount.textContent =
        `找到 ${data.count} 张图片 · 查询了 ${data.pages} 页`;

    if (
        !data.items ||
        data.items.length === 0
    ) {

        gallery.innerHTML = `
            <div class="loader">
                这个时间范围内没有找到图片。
            </div>
        `;

        return;

    }

    data.items.forEach(
        item => {

            const element =
                createItem(item);

            gallery.appendChild(
                element
            );

        }
    );

}


/* 创建图片 */

function createItem(item) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "item";

    const img =
        document.createElement(
            "img"
        );

    img.src =
        item.image;

    img.loading =
        "lazy";

    img.alt =
        item.alt || "";

    img.addEventListener(
        "click",
        () => {

            openModal(item);

        }
    );

    wrapper.appendChild(img);


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "item-info";


    const date =
        document.createElement(
            "div"
        );

    date.className =
        "item-date";

    date.textContent =
        formatDisplayDate(
            item.created_at
        );

    info.appendChild(date);


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "item-actions";


    const viewButton =
        document.createElement(
            "button"
        );

    viewButton.className =
        "small-btn";

    viewButton.textContent =
        "查看大图";

    viewButton.addEventListener(
        "click",
        () => openModal(item)
    );


    const postButton =
        document.createElement(
            "button"
        );

    postButton.className =
        "small-btn";

    postButton.textContent =
        "原帖";

    postButton.addEventListener(
        "click",
        () => {

            window.open(
                item.tweet_url,
                "_blank"
            );

        }
    );


    actions.appendChild(
        viewButton
    );

    actions.appendChild(
        postButton
    );

    info.appendChild(
        actions
    );

    wrapper.appendChild(info);

    return wrapper;

}


/* 日期格式 */

function formatDisplayDate(value) {

    if (!value) {
        return "";
    }

    const match =
        value.match(
            /^(?:\w+)\s+(\w+)\s+(\d+)\s+(\d+):(\d+):(\d+).+?(\d{4})$/
        );

    if (!match) {
        return value;
    }

    return `${match[7]}-${match[1]}-${match[2]}`;

}


/* 打开大图 */

function openModal(item) {

    currentImage =
        item;

    modalImage.src =
        item.image;

    modalImage.alt =
        item.alt || "";

    modal.classList.remove(
        "hidden"
    );

}


/* 关闭 */

closeModal.addEventListener(
    "click",
    () => {

        modal.classList.add(
            "hidden"
        );

        modalImage.src =
            "";

        currentImage =
            null;

    }
);


/* 点击黑色区域关闭 */

modal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modal
        ) {

            modal.classList.add(
                "hidden"
            );

        }

    }
);


/* 下载 */

downloadButton.addEventListener(
    "click",
    async () => {

        if (!currentImage) {
            return;
        }

        const url =
            `/api/download?url=` +
            encodeURIComponent(
                currentImage.image
            );

        window.location.href =
            url;

    }
);


/* 打开原帖 */

originalButton.addEventListener(
    "click",
    () => {

        if (!currentImage) {
            return;
        }

        window.open(
            currentImage.tweet_url,
            "_blank"
        );

    }
);

</script>

</body>

</html>
