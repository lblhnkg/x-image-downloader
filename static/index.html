<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>测试</title>
</head>
<body>
    <h1 style="color:#fff;">🧪 测试页面</h1>
    <button onclick="alert('✅ 内联点击成功！')" style="padding:12px 24px;margin:10px;font-size:18px;">点我测试（内联）</button>
    <button id="testBtn" style="padding:12px 24px;margin:10px;font-size:18px;">点我测试（ID绑定）</button>
    <hr>
    <div id="status" style="color:#0f0;font-size:16px;">⏳ 等待脚本执行...</div>
    <script>
        document.getElementById('testBtn').addEventListener('click', function() {
            alert('✅ ID 绑定点击成功！');
        });
        document.getElementById('status').textContent = '✅ 脚本已执行，页面可交互';
        alert('✅ 页面加载完成，JavaScript 正常运行！');
        console.log('✅ 脚本已加载');
    </script>
</body>
</html>
