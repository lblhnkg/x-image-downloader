<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<title>X 媒体找图器</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #f5f5f7;

    color: #111;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

button,
input {

    font-family: inherit;
}

button {

    cursor: pointer;
}

.container {

    width: 100%;

    max-width: 950px;

    margin: auto;

    padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(30px + env(safe-area-inset-bottom));
}

h1 {

    margin: 0 0 5px;

    font-size: 25px;

    letter-spacing: -.5px;
}

.subtitle {

    color: #777;

    font-size: 13px;

    margin-bottom: 17px;
}


/* =====================================================
   通用卡片
===================================================== */

.card {

    background: #fff;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 14px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.04);
}

.hidden {

    display: none !important;
}

label {

    display: block;

    color: #666;

    font-size: 13px;

    margin-bottom: 7px;
}


/* =====================================================
   一级模式菜单
===================================================== */

.mode-grid {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 10px;

    margin-bottom: 14px;
}

.mode-button {

    min-height: 92px;

    border: 1px solid #ddd;

    border-radius: 15px;

    background: #fff;

    text-align: left;

    padding: 13px;

    transition:
        transform .12s,
        background .12s,
        border-color .12s;
}

.mode-button:active {

    transform: scale(.98);
}

.mode-button.active {

    background: #111;

    color: #fff;

    border-color: #111;
}

.mode-icon {

    display: block;

    font-size: 24px;

    margin-bottom: 7px;
}

.mode-title {

    display: block;

    font-size: 14px;

    font-weight: 700;
}

.mode-desc {

    display: block;

    margin-top: 4px;

    font-size: 11px;

    color: #888;
}

.mode-button.active .mode-desc {

    color: #bbb;
}


/* =====================================================
   搜索博主
===================================================== */

.profile-row {

    display: flex;

    gap: 8px;
}

.profile-input-wrap {

    flex: 1;
}

input[type="text"],
input[type="date"] {

    width: 100%;

    height: 46px;

    border: 1px solid #ddd;

    border-radius: 11px;

    padding: 0 12px;

    font-size: 16px;

    background: #fff;

    outline: none;
}

input:focus {

    border-color: #111;
}

.favorite-add {

    height: 46px;

    min-width: 78px;

    border: 1px solid #ddd;

    background: #fff;

    border-radius: 11px;

    font-size: 13px;

    white-space: nowrap;
}


/* =====================================================
   收藏博主
===================================================== */

.favorite-entry {

    margin-top: 10px;
}

.favorite-main-button {

    width: 100%;

    height: 42px;

    border: 1px solid #ddd;

    background: #fafafa;

    border-radius: 11px;

    font-size: 14px;

    text-align: left;

    padding: 0 13px;
}

.favorites-panel {

    margin-top: 10px;

    border: 1px solid #eee;

    border-radius: 12px;

    overflow: hidden;
}

.favorite-empty {

    padding: 18px 12px;

    color: #999;

    font-size: 13px;

    text-align: center;
}

.favorite-item {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 11px 10px;

    border-bottom: 1px solid #eee;
}

.favorite-item:last-child {

    border-bottom: 0;
}

.favorite-info {

    flex: 1;

    min-width: 0;
}

.favorite-name {

    font-size: 14px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.favorite-handle {

    color: #888;

    font-size: 12px;

    margin-top: 2px;
}

.favorite-actions {

    display: flex;

    gap: 5px;
}

.favorite-use,
.favorite-delete {

    height: 32px;

    border-radius: 8px;

    padding: 0 8px;

    font-size: 11px;

    border: 1px solid #ddd;

    background: #fff;
}

.favorite-use {

    background: #111;

    color: #fff;

    border-color: #111;
}


/* =====================================================
   时间 / 筛选
===================================================== */

.section {

    margin-top: 15px;
}

.option-row {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}

.option {

    border: 1px solid #ddd;

    background: #fafafa;

    border-radius: 20px;

    padding: 8px 12px;

    font-size: 13px;
}

.option.active {

    background: #111;

    color: #fff;

    border-color: #111;
}

.date-row {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.custom-dates {

    margin-top: 11px;
}


/* =====================================================
   主按钮
===================================================== */

.primary {

    width: 100%;

    height: 48px;

    border: 0;

    border-radius: 12px;

    background: #111;

    color: #fff;

    font-size: 16px;

    font-weight: 600;

    margin-top: 17px;
}

.primary:disabled {

    opacity: .45;
}


/* =====================================================
   媒体库工具栏
===================================================== */

.library-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 12px;
}

.library-title {

    font-size: 17px;

    font-weight: 700;
}

.library-count {

    color: #777;

    font-size: 12px;

    margin-top: 3px;
}

.refresh-button {

    border: 1px solid #ddd;

    background: #fff;

    border-radius: 9px;

    padding: 8px 11px;

    font-size: 12px;
}


/* =====================================================
   状态
===================================================== */

.status {

    font-size: 14px;

    line-height: 1.6;
}

.error {

    color: #d00;

    white-space: pre-wrap;
}

.loader {

    text-align: center;

    padding: 20px;

    color: #777;
}


/* =====================================================
   结果
===================================================== */

.result-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 13px;
}

.result-title {

    font-size: 16px;

    font-weight: 700;
}

.result-count {

    color: #777;

    font-size: 12px;

    margin-top: 4px;
}


/* =====================================================
   关键：正常 Grid
   左 → 右
   上 → 下
===================================================== */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 9px;

    align-items: start;
}


/* =====================================================
   媒体卡片
===================================================== */

.item {

    min-width: 0;

    background: #fff;

    border: 1px solid #eee;

    border-radius: 12px;

    overflow: hidden;
}

.media-wrap {

    position: relative;

    width: 100%;

    background: #eee;

    overflow: hidden;
}

.media-wrap img {

    display: block;

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    cursor: pointer;
}

.video-badge {

    position: absolute;

    left: 7px;

    top: 7px;

    background: rgba(0,0,0,.75);

    color: #fff;

    border-radius: 20px;

    padding: 5px 8px;

    font-size: 10px;
}

.source-badge {

    position: absolute;

    right: 7px;

    top: 7px;

    background: rgba(0,0,0,.75);

    color: #fff;

    border-radius: 20px;

    padding: 5px 8px;

    font-size: 10px;
}

.library-badge {

    position: absolute;

    right: 7px;

    top: 7px;

    background: rgba(0,0,0,.75);

    color: #fff;

    border-radius: 20px;

    padding: 5px 8px;

    font-size: 10px;
}

.item-info {

    padding: 8px;
}

.item-author {

    font-size: 11px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-bottom: 3px;
}

.item-date {

    color: #888;

    font-size: 10px;
}

.item-actions {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 4px;

    margin-top: 7px;
}

.small-btn {

    height: 32px;

    border: 1px solid #ddd;

    background: #fff;

    border-radius: 7px;

    font-size: 10px;

    padding: 0 2px;

    white-space: nowrap;
}


/* =====================================================
   Modal
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 1000;

    background: rgba(0,0,0,.95);

    display: flex;

    flex-direction: column;
}

.modal-top {

    min-height: 58px;

    padding:
        env(safe-area-inset-top)
        12px
        0
        12px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.modal-button {

    border: 0;

    background: rgba(255,255,255,.12);

    color: #fff;

    border-radius: 20px;

    padding: 8px 13px;
}

.modal-content {

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10px;

    overflow: auto;
}

.modal-content img {

    max-width: 100%;

    max-height: 100%;

    object-fit: contain;
}

.modal-content video {

    max-width: 100%;

    max-height: 100%;
}

.modal-bottom {

    padding:
        10px
        12px
        calc(12px + env(safe-area-inset-bottom));

    display: flex;

    gap: 8px;
}

.modal-bottom button {

    flex: 1;

    height: 45px;

    border: 0;

    border-radius: 10px;

    font-size: 14px;
}

.download {

    background: #fff;

    color: #111;
}

.original {

    background: rgba(255,255,255,.15);

    color: #fff;
}


/* =====================================================
   大屏
===================================================== */

@media (min-width: 700px) {

    .gallery {

        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

}


/* =====================================================
   小屏
===================================================== */

@media (max-width: 560px) {

    .mode-grid {

        grid-template-columns:
            1fr;
    }

    .mode-button {

        min-height: 70px;
    }

    .mode-icon {

        display: inline;

        margin-right: 6px;

        font-size: 20px;
    }

}

@media (max-width: 380px) {

    .item-actions {

        grid-template-columns:
            1fr 1fr;
    }

    .item-actions
    .small-btn:last-child {

        grid-column:
            1 / -1;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>🖼️ X 媒体找图器</h1>

<div class="subtitle">
    搜索博主媒体，或浏览采集器上传的 Likes / Bookmarks
</div>


<!-- =====================================================
     一级入口
===================================================== -->

<div class="mode-grid">

    <button

<!-- =====================================================

                    开始日期

   DOM

const favoritesPanel =

/* =====================================================
   状态
===================================================== */

let currentMode =
    "search";

let range =
    "all";

let mediaType =
    "photo";

let sourceType =
    "all";

let libraryMediaType =
    "all";

let currentItem =
    null;


/* =====================================================
   收藏博主
===================================================== */

const FAVORITE_KEY =
    "x_media_finder_favorites_v31";


function getFavorites() {

    try {

        const data =
            localStorage.getItem(
                FAVORITE_KEY
            );

        if (!data) {

            return [];
        }

        const parsed =
            JSON.parse(data);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (e) {

        return [];
    }

}


function saveFavorites(
    favorites
) {

    localStorage.setItem(
        FAVORITE_KEY,
        JSON.stringify(
            favorites
        )
    );

}


/* =====================================================
   用户名
===================================================== */

function normalizeUsername(
    input
) {

    let value =
        input.trim();

    if (!value) {

        return null;
    }


    if (
        value.includes("x.com/")
        ||
        value.includes("twitter.com/")
    ) {

        if (
            !value.startsWith(
                "http://"
            )
            &&
            !value.startsWith(
                "https://"
            )
        ) {

            value =
                "https://" +
                value;
        }

        try {

            const url =
                new URL(value);

            const parts =
                url.pathname
                    .split("/")
                    .filter(Boolean);

            if (
                parts.length
            ) {

                value =
                    parts[0];
            }

        } catch (e) {

            return null;
        }

    }


    value =
        value.replace(
            /^@+/,
            ""
        );

    value =
        value.replace(
            /\/+$/,
            ""
        );

    value =
        value.replace(
            /[^A-Za-z0-9_]/g,
            ""
        );

    return value || null;

}


/* =====================================================
   收藏按钮

        return;

        );

favoriteAdd.addEventListener(
    "click",
    () => {

            normalizeUsername(
                profileInput.value
            );

        if (!username) {

            showError(
                "请先输入博主名，例如 NASA 或 @NASA"
            );

            return;
        }

        const favorites =
            getFavorites();

        const index =
            favorites.findIndex(
                item =>
                    item.username
                        .toLowerCase()
                    ===
                    username
                        .toLowerCase()
            );

        if (
            index >= 0
        ) {

            favorites.splice(
                index,
                1
            );

        } else {

            favorites.push({

                username:
                    username,

                name:
                    username,

                addedAt:
                    Date.now()

            });

        }

        saveFavorites(
            favorites
        );

        updateFavoriteButton();

        renderFavorites();

    }
);

/* =====================================================
   日期
===================================================== */

function formatDate(
    date
) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const d =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        `${y}-${m}-${d}`
    );

}


function getDates() {

    if (
        range ===
        "all"
    ) {

        return {
            start: null,
            end: null
        };

    }


    if (
        range ===
        "custom"
    ) {

        return {

            start:
                startDate.value ||
                null,

            end:
                endDate.value ||
                null

        };

    }


    const now =
        new Date();

    const start =
        new Date(
            now
        );

    start.setDate(
        start.getDate()
        -
        Number(range)
    );


    return {

        start:
            formatDate(
                start
            ),

        end:
            formatDate(
                now
            )

    };

}

async function search() {

    const raw =
        profileInput.value.trim();

    const username =
        normalizeUsername(
            raw
        );


    if (!username) {

        showError(
            "无法识别博主。\n\n" +
            "可以输入：\n" +
            "NASA\n" +
            "@NASA\n" +
            "x.com/NASA\n" +
            "https://x.com/NASA"
        );

        return;
    }


    const profile =
        `https://x.com/${username}`;


    const dates =
        getDates();


    if (
        dates.start &&
        dates.end &&
        dates.start >
        dates.end
    ) {

        showError(
            "开始日期不能晚于结束日期"
        );

        return;
    }


    searchButton.disabled =
        true;

    searchButton.textContent =
        "正在寻找媒体…";


    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status";

    status.textContent =
        `正在搜索 @${username}…`;


    resultCard.classList.add(
        "hidden"
    );

    gallery.innerHTML =
        "";


    try {

        const params =
            new URLSearchParams();


        params.set(
            "profile",
            profile
        );


        params.set(
            "media_type",
            mediaType
        );


        /*
         * 只有搜索博主模式
         * 才发送 source_type
         */

        params.set(
            "source_type",
            sourceType
        );


        if (
            dates.start
        ) {

            params.set(
                "start_date",
                dates.start
            );

        }


        if (
            dates.end
        ) {

            params.set(
                "end_date",
                dates.end
            );

        }


        const response =
            await fetch(
                `/api/search?${params.toString()}`
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.detail ||
                "搜索失败"
            );

        }


        renderSearchResults(
            data
        );


    } catch (error) {

        showError(
            error.message ||
            "搜索失败"
        );


    } finally {

        searchButton.disabled =
            false;

        searchButton.textContent =
            "开始找图";

    }

}

/* =====================================================
   日期
===================================================== */

function formatDateFromX(
    value
) {

    if (!value) {

        return "";
    }


    const match =
        value.match(
            /^\w+\s+(\w+)\s+(\d+).*?(\d{4})$/
        );


    if (!match) {

        return value;
    }


    const months = {

        Jan: "01",
        Feb: "02",
        Mar: "03",
        Apr: "04",
        May: "05",
        Jun: "06",
        Jul: "07",
        Aug: "08",
        Sep: "09",
        Oct: "10",
        Nov: "11",
        Dec: "12"

    };


    const month =
        months[
            match[1]
        ];


    if (!month) {

        return value;
    }


    return (
        `${match[3]}-` +
        `${month}-` +
        `${String(
            match[2]
        ).padStart(
            2,
            "0"
        )}`
    );

}


/* =====================================================
   文件名
===================================================== */

function getFilename(
    item
) {

    let date =
        formatDateFromX(
            item.created_at
            ||
            item.createdAt
        );


    if (!date) {

        date =
            "x-media";
    }


    let suffix =
        "";


    if (
        item.media_total &&
        item.media_total > 1
    ) {

        suffix =
            `-${item.media_index}`;

    }


    let extension =
        ".jpg";


    const type =
        item.media_type ||
        item.type;


    if (
        type ===
        "video"
    ) {

        extension =
            ".mp4";

    }

    else if (
        (
            item.media_url ||
            item.url
        )
        &&
        (
            item.media_url ||
            item.url
        )
            .toLowerCase()
            .includes(
                ".png"
            )
    ) {

        extension =
            ".png";

    }

    else if (
        (
            item.media_url ||
            item.url
        )
        &&
        (
            item.media_url ||
            item.url
        )
            .toLowerCase()
            .includes(
                ".webp"
            )
    ) {

        extension =
            ".webp";

    }


    return (
        `${date}${suffix}${extension}`
    );

}

function createSearchItem(

        document.createElement(
            "div"
        );

    mediaWrap.className =

        document.createElement(
            "img"
        );


    if (
        item.media_type ===
        "video"
    ) {

        img.src =
            item.thumbnail ||
            "";

    } else {

        img.src =
            item.media_url;

    }


    img.loading =
        "lazy";


    img.alt =
        item.alt ||
        "";


    img.addEventListener(
        "click",
        () =>
            openModal(
                item
            )
    );


    mediaWrap.appendChild(
        img
    );


    if (
        item.media_type ===
        "video"
    ) {

        const badge =
            document.createElement(
                "div"
            );

        badge.className =
            "video-badge";

        badge.textContent =
            "▶ 视频";

            badge
        );

    }

     */

        item.source &&
        item.source !==
        "original"
    ) {

            document.createElement(
                "div"
            );

        source.className =
            "source-badge";

        source.textContent =
            item.source ===

            source
        );

    }


    wrapper.appendChild(
        mediaWrap
    );


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "item-info";


    const date =
        document.createElement(
            "div"
        );

    date.className =
        "item-date";

    date.textContent =
        formatDateFromX(
            item.created_at
        );


    info.appendChild(
        date
    );


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "item-actions";

        document.createElement(
            "button"
        );

        "small-btn";

        item.media_type ===
        "video"

        () =>
            openModal(
                item
            );


    const download =
        document.createElement(
            "button"
        );

    download.className =
        "small-btn";

    download.textContent =
        item.media_type ===
        "video"
            ? "⬇ 下载视频"

    );

    actions.appendChild(
        post
    );


    info.appendChild(
        actions
    );


    wrapper.appendChild(
        info
    );


    return wrapper;

}

            : "⬇ 下载原图";


    download.onclick =
        () =>
            downloadItem(
                normalized
            );


    const post =
        document.createElement(
            "button"
        );

    post.className =
        "small-btn";

    post.textContent =
        "原帖";


    post.onclick =
        () => {

            if (
                item.tweet_url
            ) {

                window.open(
                    item.tweet_url,
                    "_blank"
                );

            }

        };


    actions.appendChild(
        view
    );

    actions.appendChild(
        download
    );

    actions.appendChild(
        post
    );


    info.appendChild(
        actions
    );


    wrapper.appendChild(
        info
    );


    return wrapper;

}


/* =====================================================
   媒体库数据转换
===================================================== */

function normalizeLibraryItem(
    item
) {

    return {

        media_type:
            item.type,

        media_url:
            item.url,

        video_url:
            item.type ===
            "video"
                ? item.url
                : "",

        thumbnail:
            item.thumbnail ||
            "",

        tweet_url:
            item.tweet_url ||
            "",

        author:
            item.author ||
            "",

        created_at:
            item.createdAt ||
            "",

        originalUrl:
            item.originalUrl ||
            item.url ||
            "",

        libraryId:
            item.id ||
            ""

    };

}


/* =====================================================
   媒体库日期
===================================================== */

function formatLibraryDate(
    value
) {

    if (!value) {

        return "";
    }


    try {

        const date =
            new Date(
                value
            );

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";
        }


        return (
            date.getFullYear() +
            "-" +
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            ) +
            "-" +
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            )
        );

    } catch (e) {

        return "";
    }

}


/* =====================================================
   下载
===================================================== */

function downloadItem(
    item
) {

    const url =
        item.media_url ||
        item.url ||
        "";


    if (!url) {

        alert(
            "这个媒体暂时没有可下载地址。"
        );

        return;
    }


    const filename =
        getFilename(
            item
        );


    const downloadUrl =
        "/api/download?url=" +
        encodeURIComponent(
            url
        ) +
        "&filename=" +
        encodeURIComponent(
            filename
        );


    window.location.href =
        downloadUrl;

}


/* =====================================================
   Modal
===================================================== */

function openModal(
    item
) {

    currentItem =
        item;


    modalContent.innerHTML =
        "";


    if (
        item.media_type ===
        "video"
    ) {

        const video =
            document.createElement(
                "video"
            );


        video.src =
            item.video_url ||
            item.media_url ||
            "";


        video.controls =
            true;

        video.autoplay =
            true;

        video.playsInline =
            true;


        modalContent.appendChild(
            video
        );


        downloadButton.textContent =
            "⬇ 下载视频";


    } else {

        const img =
            document.createElement(
                "img"
            );


        img.src =
            item.media_url ||
            item.url ||
            "";


        img.alt =
            item.alt ||
            "";


        modalContent.appendChild(
            img
        );


        downloadButton.textContent =
            "⬇ 下载原图";

    }


    modal.classList.remove(
        "hidden"
    );

}


closeModal.addEventListener(
    "click",
    closeModalWindow
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modal
        ) {

            closeModalWindow();

        }

    }
);


function closeModalWindow() {

    modal.classList.add(
        "hidden"
    );

    modalContent.innerHTML =
        "";

    currentItem =
        null;

}


/* =====================================================
   Modal 下载
===================================================== */

downloadButton.addEventListener(
    "click",
    () => {

        if (
            !currentItem
        ) {

            return;
        }


        downloadItem(
            currentItem
        );

    }
);


/* =====================================================
   Modal 原帖
===================================================== */

originalButton.addEventListener(
    "click",
    () => {

        if (
            !currentItem
        ) {

            return;
        }


        if (
            currentItem.tweet_url
        ) {

            window.open(
                currentItem.tweet_url,
                "_blank"
            );

        }

    }
);


/* =====================================================
   ESC 关闭 Modal
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            closeModalWindow();

        }

    }
);


/* =====================================================
   初始
===================================================== */

renderFavorites();

updateFavoriteButton();

setMode(
    "search"
);

</script>
