<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>万能媒体下载器</title>
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@7.3.0/dist/turbo.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: 80px;
        }

        .hidden {
            display: none !important;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(145deg, #141414 0%, #1a1a1a 100%);
            border-radius: 32px;
            padding: 40px 28px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            min-height: 560px;
            position: relative;
            transition: all 0.3s ease;
        }

        @media (min-width: 700px) {
            .app-container {
                max-width: 900px;
                padding: 50px 40px 40px;
                border-radius: 36px;
            }
            .login-footer-text {
                font-size: 13px;
            }
            .search-row input {
                font-size: 18px;
            }
            .option-btn {
                padding: 8px 18px;
                font-size: 13px;
            }
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 1100px;
                padding: 60px 50px 50px;
                border-radius: 40px;
            }
            .login-footer-text {
                font-size: 14px;
            }
        }

        .page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-title {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: 6px;
            color: #fff;
        }

        .login-divider {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.15), transparent);
            margin: 28px 0 32px;
        }

        .login-section-title {
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 16px;
        }

        .login-input-group {
            margin-bottom: 18px;
        }

        .login-input-group input {
            width: 100%;
            background: transparent;
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 0 8px;
            font-size: 17px;
            color: #fff;
            outline: none;
            transition: border-color 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .login-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            font-size: 16px;
        }

        .login-input-group input:focus {
            border-bottom-color: rgba(255, 255, 255, 0.6);
        }

        .login-btn {
            width: 100%;
            padding: 14px 0;
            background: #fff;
            color: #0a0a0a;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
            margin-top: 6px;
        }

        .login-btn:hover {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .login-btn:active {
            transform: scale(0.96);
        }

        .login-guest-btn {
            width: 100%;
            padding: 14px 0;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
            margin-top: 10px;
        }

        .login-guest-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .login-guest-btn:active {
            transform: scale(0.98);
        }

        .login-footer-text {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.7;
            margin-top: 22px;
            padding: 0 4px;
        }

        .login-footer-text .small-note {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        .login-dev-signature {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 32px;
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        /* ============================================
           菜单：永远一列
           ============================================ */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 18px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 22px 24px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .menu-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .menu-card:active {
            transform: scale(0.98);
        }

        .menu-card-title {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            letter-spacing: -0.2px;
        }

        .menu-card-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
            font-weight: 300;
            letter-spacing: 0.2px;
        }

        .menu-card .menu-arrow {
            float: right;
            color: rgba(255, 255, 255, 0.2);
            font-size: 18px;
            margin-top: 2px;
        }

        .mode-banner {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            color: rgba(255, 215, 0, 0.6);
            text-align: center;
            font-weight: 300;
        }

        .mode-banner.developer {
            background: rgba(0, 200, 255, 0.06);
            border-color: rgba(0, 200, 255, 0.1);
            color: rgba(0, 200, 255, 0.5);
        }

        .guest-tip-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .guest-tip-overlay.hidden {
            display: none !important;
        }

        .guest-tip-box {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 30px 28px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        .guest-tip-box .tip-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }

        .guest-tip-box .tip-title {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 8px;
        }

        .guest-tip-box .tip-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.7;
            font-weight: 300;
        }

        .guest-tip-box .tip-btn {
            margin-top: 18px;
            padding: 10px 32px;
            background: rgba(255, 255, 255, 0.08);
            border: 0;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .guest-tip-box .tip-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- =====================================================
        登录页（初始无 active，由 JS 控制显示）
        ===================================================== -->
        <div class="page" id="pageLogin">
            <div class="app-title">万能媒体下载器</div>
            <hr class="login-divider">
            <div class="login-section-title">开发者通道</div>
            <div class="login-input-group">
                <input type="password" id="loginPassword" placeholder="密码" autocomplete="off">
            </div>
            <button class="login-btn" id="loginBtn">进入</button>
            <div id="loginError" class="login-error"></div>
            <div class="login-section-title" style="margin-top:24px;margin-bottom:12px;">— 或 —</div>
            <button class="login-guest-btn" id="guestBtn">以访客身份浏览</button>
            <div class="login-footer-text">
                访客数据仅保存在本地浏览器中
                <span class="small-note">清除缓存后数据将丢失</span>
                <span class="small-note" style="margin-top:6px;">“我的喜欢”和“我的书签”需搭配采集器使用</span>
            </div>
            <div class="login-dev-signature">开发者：浮生若夢</div>
        </div>

        <!-- =====================================================
        一级菜单（初始无 active，由 JS 控制显示）
        ===================================================== -->
        <div class="page" id="pageMenu">
            <div class="app-title" style="font-size:22px;margin-bottom:4px;">万能媒体下载器</div>
            <div id="menuModeBanner"></div>
            <div class="menu-grid">
                <div class="menu-card" id="menuX">
                    <span class="menu-arrow">›</span>
                    <div class="menu-card-title">下载 X 上的媒体</div>
                    <div class="menu-card-desc">图片 · 视频 · 喜欢 · 书签</div>
                </div>
                <div class="menu-card" id="menuMissav">
                    <span class="menu-arrow">›</span>
                    <div class="menu-card-title">下载 Missav 上的电影</div>
                    <div class="menu-card-desc">番号 · 演员 · 高清</div>
                </div>
                <div class="menu-card" id="menuM3u8">
                    <span class="menu-arrow">›</span>
                    <div class="menu-card-title">M3U8 视频转换下载器</div>
                    <div class="menu-card-desc">在线播放 · 下载视频流</div>
                </div>
                <div class="menu-card" id="menuBilibili">
                    <span class="menu-arrow">›</span>
                    <div class="menu-card-title">下载 Bilibili 视频</div>
                    <div class="menu-card-desc">即将上线</div>
                </div>
            </div>
            <div class="login-dev-signature" style="margin-top:32px;">开发者：浮生若夢</div>
        </div>

    </div>

    <!-- =====================================================
    访客提示弹窗
    ===================================================== -->
    <div class="guest-tip-overlay hidden" id="guestTip">
        <div class="guest-tip-box">
            <div class="tip-icon">📌</div>
            <div class="tip-title">访客模式</div>
            <div class="tip-desc">此功能需要搭配采集器使用<br>安装后即可正常使用</div>
            <button class="tip-btn" id="guestTipBtn">我知道了</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 登录 + 菜单逻辑（无淡出，直接跳转）
        // ============================================================

        const pageLogin = document.getElementById('pageLogin');
        const pageMenu = document.getElementById('pageMenu');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const guestBtn = document.getElementById('guestBtn');
        const guestTip = document.getElementById('guestTip');
        const guestTipBtn = document.getElementById('guestTipBtn');
        const menuModeBanner = document.getElementById('menuModeBanner');

        let currentMode = 'guest';

        // 访客弹窗是否已显示过（存 localStorage）
        const GUEST_TIP_KEY = 'universal_guest_tip_shown';

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            var target = document.getElementById(pageId);
            if (target) target.classList.add('active');
        }

        function showGuestBanner() {
            menuModeBanner.innerHTML = '<div class="mode-banner">📌 访客模式 · 数据仅保存在本地浏览器中</div>';
        }

        function showDeveloperBanner() {
            menuModeBanner.innerHTML = '<div class="mode-banner developer">🔒 开发者模式 · 数据存储在服务器</div>';
        }

        // ============================================================
        // 开发者登录
        // ============================================================

        function handleLogin() {
            var password = loginPassword.value.trim();
            if (!password) {
                loginError.textContent = '请输入密码';
                return;
            }
            loginError.textContent = '';
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中…';

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password }),
                credentials: 'include'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.ok) {
                    currentMode = 'developer';
                    localStorage.setItem('userMode', 'developer');
                    showDeveloperBanner();
                    showPage('pageMenu');
                    loginPassword.value = '';
                } else {
                    loginError.textContent = data.detail || '密码错误';
                }
            })
            .catch(function() {
                loginError.textContent = '连接服务器失败，请稍后重试';
            })
            .finally(function() {
                loginBtn.disabled = false;
                loginBtn.textContent = '进入';
            });
        }

        loginBtn.addEventListener('click', handleLogin);
        loginPassword.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        // ============================================================
        // 访客模式
        // ============================================================

        guestBtn.addEventListener('click', function() {
            currentMode = 'guest';
            localStorage.setItem('userMode', 'guest');
            document.cookie = 'session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            showGuestBanner();

            // 检查是否已显示过弹窗
            var tipShown = localStorage.getItem(GUEST_TIP_KEY);
            if (tipShown === 'true') {
                showPage('pageMenu');
            } else {
                guestTip.classList.remove('hidden');
            }
        });

        guestTipBtn.addEventListener('click', function() {
            guestTip.classList.add('hidden');
            // 记录已显示过
            localStorage.setItem(GUEST_TIP_KEY, 'true');
            showPage('pageMenu');
        });

        // ============================================================
        // 菜单卡片跳转（直接跳转，无淡出）
        // ============================================================

        document.getElementById('menuX').addEventListener('click', function() {
            window.location.href = '/x';
        });

        document.getElementById('menuMissav').addEventListener('click', function() {
            window.location.href = '/missav';
        });

        document.getElementById('menuM3u8').addEventListener('click', function() {
            window.location.href = '/m3u8';
        });

        document.getElementById('menuBilibili').addEventListener('click', function() {
            window.location.href = '/bilibili';
        });

        // ============================================================
        // 初始化函数（用于首次加载和 Turbo 切换）
        // ============================================================

        function initApp() {
            var referrer = document.referrer || '';
            var isFromSubPage = referrer.includes('/x') || referrer.includes('/missav') || referrer.includes('/bilibili') || referrer.includes('/m3u8');
            var savedMode = localStorage.getItem('userMode');

            if (isFromSubPage && savedMode) {
                if (savedMode === 'developer') {
                    fetch('/api/auth/check', { credentials: 'include' })
                        .then(function(res) { return res.json(); })
                        .then(function(data) {
                            if (data.authenticated) {
                                currentMode = 'developer';
                                showDeveloperBanner();
                                showPage('pageMenu');
                            } else {
                                localStorage.setItem('userMode', 'guest');
                                currentMode = 'guest';
                                showGuestBanner();
                                showPage('pageMenu');
                            }
                        })
                        .catch(function() {
                            localStorage.setItem('userMode', 'guest');
                            currentMode = 'guest';
                            showGuestBanner();
                            showPage('pageMenu');
                        });
                } else {
                    currentMode = 'guest';
                    showGuestBanner();
                    showPage('pageMenu');
                }
                return;
            }

            // 默认显示登录页
            showPage('pageLogin');
        }

        // 绑定事件：Turbo 切换 + 常规加载
        document.addEventListener('turbo:load', initApp);
        document.addEventListener('DOMContentLoaded', initApp);

        console.log('📱 万能媒体下载器 已加载（Turbo 模式）');
        console.log('开发者：浮生若夢');
    </script>

</body>
</html>
