<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>万能媒体下载器</title>
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@7.3.0/dist/turbo.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: 80px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(145deg, #141414 0%, #1a1a1a 100%);
            border-radius: 32px;
            padding: 40px 28px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            min-height: 560px;
            position: relative;
            transition: all 0.3s ease;
        }

        @media (min-width: 700px) {
            .app-container {
                max-width: 900px;
                padding: 50px 40px 40px;
                border-radius: 36px;
            }
            .search-row input {
                font-size: 18px;
            }
            .option-btn {
                padding: 8px 18px;
                font-size: 13px;
            }
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 1100px;
                padding: 60px 50px 50px;
                border-radius: 40px;
            }
        }

        .page {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-title {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: 6px;
            color: #fff;
        }

        .app-subtitle {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 300;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 18px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 22px 24px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .menu-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .menu-card:active {
            transform: scale(0.98);
        }

        .menu-card-title {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            letter-spacing: -0.2px;
        }

        .menu-card-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
            font-weight: 300;
            letter-spacing: 0.2px;
        }

        .menu-card .menu-arrow {
            float: right;
            color: rgba(255, 255, 255, 0.2);
            font-size: 18px;
            margin-top: 2px;
        }

        .dev-signature {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 32px;
            letter-spacing: 0.5px;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- =====================================================
        首页菜单
        ===================================================== -->
        <div class="page" id="pageMenu">
            <div class="app-title">万能媒体下载器</div>
            <div class="app-subtitle">本地部署 · 开发者模式</div>
            <div class="menu-grid">
                <div class="menu-card" id="menuX">
                    <span class="menu-arrow">›</span>
                    <div class="menu-card-title">下载 X 上的媒体</div>
                    <div class="menu-card-desc">图片 · 视频 · 喜欢 · 书签</div>
                </div>
                <div class="menu-card" id="menuMissav">
                    <span class="menu-arrow">›</span>
                    <div class="menu-card-title">下载 Missav 上的电影</div>
                    <div class="menu-card-desc">番号 · 演员 · 高清</div>
                </div>
                <div class="menu-card" id="menuM3u8">
                    <span class="menu-arrow">›</span>
                    <div class="menu-card-title">M3U8 视频转换下载器</div>
                    <div class="menu-card-desc">在线播放 · 下载视频流</div>
                </div>
                <div class="menu-card" id="menuBilibili">
                    <span class="menu-arrow">›</span>
                    <div class="menu-card-title">下载 Bilibili 视频</div>
                    <div class="menu-card-desc">即将上线</div>
                </div>
            </div>
            <div class="dev-signature">开发者：浮生若夢</div>
        </div>

    </div>

    <script>
        // ============================================================
        // 首页菜单（本地部署 · 无登录直接进入）
        // ============================================================

        document.getElementById('menuX').addEventListener('click', function() {
            window.location.href = '/x';
        });

        document.getElementById('menuMissav').addEventListener('click', function() {
            window.location.href = '/missav';
        });

        document.getElementById('menuM3u8').addEventListener('click', function() {
            window.location.href = '/m3u8';
        });

        document.getElementById('menuBilibili').addEventListener('click', function() {
            window.location.href = '/bilibili';
        });

        console.log('📱 万能媒体下载器 已加载（本地部署 · 开发者模式）');
        console.log('开发者：浮生若夢');
    </script>

</body>
</html>
