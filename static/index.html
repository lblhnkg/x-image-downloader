<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<title>X 媒体找图器</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f7;
    color: #111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: 100%;
    max-width: 950px;
    margin: auto;
    padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(30px + env(safe-area-inset-bottom));
}

h1 {
    margin: 0 0 5px;
    font-size: 25px;
    letter-spacing: -.5px;
}

.subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 17px;
}

.card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow:
        0 2px 10px rgba(0,0,0,.04);
}

.hidden {
    display: none !important;
}

label {
    display: block;
    color: #666;
    font-size: 13px;
    margin-bottom: 7px;
}

.mode-grid {
    display: grid;
    grid-template-columns:
        repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
}

.mode-button {
    min-height: 92px;
    border: 1px solid #ddd;
    border-radius: 15px;
    background: #fff;
    text-align: left;
    padding: 13px;
    transition:
        transform .12s,
        background .12s,
        border-color .12s;
}

.mode-button:active {
    transform: scale(.98);
}

.mode-button.active {
    background: #111;
    color: #fff;
    border-color: #111;
}

.mode-icon {
    display: block;
    font-size: 24px;
    margin-bottom: 7px;
}

.mode-title {
    display: block;
    font-size: 14px;
    font-weight: 700;
}

.mode-desc {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    color: #888;
}

.mode-button.active .mode-desc {
    color: #bbb;
}

.profile-row {
    display: flex;
    gap: 8px;
}

.profile-input-wrap {
    flex: 1;
}

input[type="text"],
input[type="date"] {
    width: 100%;
    height: 46px;
    border: 1px solid #ddd;
    border-radius: 11px;
    padding: 0 12px;
    font-size: 16px;
    background: #fff;
    outline: none;
}

input:focus {
    border-color: #111;
}

.favorite-add {
    height: 46px;
    min-width: 78px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 11px;
    font-size: 13px;
    white-space: nowrap;
}

.favorite-entry {
    margin-top: 10px;
}

.favorite-main-button {
    width: 100%;
    height: 42px;
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 11px;
    font-size: 14px;
    text-align: left;
    padding: 0 13px;
}

.favorites-panel {
    margin-top: 10px;
    border: 1px solid #eee;
    border-radius: 12px;
    overflow: hidden;
}

.favorite-empty {
    padding: 18px 12px;
    color: #999;
    font-size: 13px;
    text-align: center;
}

.favorite-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 10px;
    border-bottom: 1px solid #eee;
}

.favorite-item:last-child {
    border-bottom: 0;
}

.favorite-info {
    flex: 1;
    min-width: 0;
}

.favorite-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.favorite-handle {
    color: #888;
    font-size: 12px;
    margin-top: 2px;
}

.favorite-actions {
    display: flex;
    gap: 5px;
}

.favorite-use,
.favorite-delete {
    height: 32px;
    border-radius: 8px;
    padding: 0 8px;
    font-size: 11px;
    border: 1px solid #ddd;
    background: #fff;
}

.favorite-use {
    background: #111;
    color: #fff;
    border-color: #111;
}

.section {
    margin-top: 15px;
}

.option-row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.option {
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 20px;
    padding: 8px 12px;
    font-size: 13px;
}

.option.active {
    background: #111;
    color: #fff;
    border-color: #111;
}

.date-row {
    display: grid;
    grid-template-columns:
        1fr 1fr;
    gap: 10px;
}

.custom-dates {
    margin-top: 11px;
}

.primary {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    margin-top: 17px;
}

.primary:disabled {
    opacity: .45;
}

.library-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}

.library-title {
    font-size: 17px;
    font-weight: 700;
}

.library-count {
    color: #777;
    font-size: 12px;
    margin-top: 3px;
}

.refresh-button {
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 9px;
    padding: 8px 11px;
    font-size: 12px;
}

.status {
    font-size: 14px;
    line-height: 1.6;
}

.error {
    color: #d00;
    white-space: pre-wrap;
}

.loader {
    text-align: center;
    padding: 20px;
    color: #777;
}

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.result-title {
    font-size: 16px;
    font-weight: 700;
}

.result-count {
    color: #777;
    font-size: 12px;
    margin-top: 4px;
}

.gallery {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));
    gap: 9px;
    align-items: start;
}

.item {
    min-width: 0;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    overflow: hidden;
}

.media-wrap {
    position: relative;
    width: 100%;
    background: #eee;
    overflow: hidden;
}

.media-wrap img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    cursor: pointer;
}

.media-error {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eee;
    color: #999;
    font-size: 13px;
    text-align: center;
    padding: 12px;
}

.video-badge {
    position: absolute;
    left: 7px;
    top: 7px;
    background: rgba(0,0,0,.75);
    color: #fff;
    border-radius: 20px;
    padding: 5px 8px;
    font-size: 10px;
}

.source-badge {
    position: absolute;
    right: 7px;
    top: 7px;
    background: rgba(0,0,0,.75);
    color: #fff;
    border-radius: 20px;
    padding: 5px 8px;
    font-size: 10px;
}

.library-badge {
    position: absolute;
    right: 7px;
    top: 7px;
    background: rgba(0,0,0,.75);
    color: #fff;
    border-radius: 20px;
    padding: 5px 8px;
    font-size: 10px;
}

.item-info {
    padding: 8px;
}

.item-author {
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
}

.item-date {
    color: #888;
    font-size: 10px;
}

.item-actions {
    display: grid;
    grid-template-columns:
        1fr 1fr 1fr;
    gap: 4px;
    margin-top: 7px;
}

.small-btn {
    height: 32px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 7px;
    font-size: 10px;
    padding: 0 2px;
    white-space: nowrap;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,.95);
    display: flex;
    flex-direction: column;
}

.modal-top {
    min-height: 58px;
    padding:
        env(safe-area-inset-top)
        12px
        0
        12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-button {
    border: 0;
    background: rgba(255,255,255,.12);
    color: #fff;
    border-radius: 20px;
    padding: 8px 13px;
}

.modal-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: auto;
}

.modal-content img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.modal-content video {
    max-width: 100%;
    max-height: 100%;
}

.modal-bottom {
    padding:
        10px
        12px
        calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
}

.modal-bottom button {
    flex: 1;
    height: 45px;
    border: 0;
    border-radius: 10px;
    font-size: 14px;
}

.download {
    background: #fff;
    color: #111;
}

.original {
    background: rgba(255,255,255,.15);
    color: #fff;
}

@media (min-width: 700px) {
    .gallery {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }
}

@media (max-width: 560px) {
    .mode-grid {
        grid-template-columns:
            1fr;
    }

    .mode-button {
        min-height: 70px;
    }

    .mode-icon {
        display: inline;
        margin-right: 6px;
        font-size: 20px;
    }
}

@media (max-width: 380px) {
    .item-actions {
        grid-template-columns:
            1fr 1fr;
    }

    .item-actions
    .small-btn:last-child {
        grid-column:
            1 / -1;
    }
}

</style>

</head>

<body>

<div class="container">

<h1>🖼️ X 媒体找图器</h1>

<div class="subtitle">
    搜索博主媒体，或浏览采集器上传的 Likes / Bookmarks
</div>

<div class="mode-grid">

    <button
        id="modeSearch"
        class="mode-button active"
    >
        <span class="mode-icon">🔎</span>
        <span class="mode-title">搜索博主下载</span>
        <span class="mode-desc">搜索指定博主的媒体</span>
    </button>

    <button
        id="modeLikes"
        class="mode-button"
    >
        <span class="mode-icon">❤️</span>
        <span class="mode-title">我的喜欢</span>
        <span class="mode-desc">查看采集器上传的 Likes</span>
    </button>

    <button
        id="modeBookmarks"
        class="mode-button"
    >
        <span class="mode-icon">🔖</span>
        <span class="mode-title">我的书签</span>
        <span class="mode-desc">查看采集器上传的 Bookmarks</span>
    </button>

</div>

<div
    id="searchPanel"
    class="card"
>

    <label>博主</label>

    <div class="profile-row">

        <div class="profile-input-wrap">

            <input
                id="profile"
                type="text"
                placeholder="@NASA / NASA / x.com/NASA"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
            />

        </div>

        <button
            id="favoriteAdd"
            class="favorite-add"
        >
            ☆ 收藏
        </button>

    </div>

    <div class="favorite-entry">

        <button
            id="favoriteToggle"
            class="favorite-main-button"
        >
            ⭐ 我的收藏
        </button>

        <div
            id="favoritesPanel"
            class="favorites-panel hidden"
        ></div>

    </div>

    <div class="section">

        <label>时间范围</label>

        <div class="option-row">

            <button
                class="option active"
                data-group="range"
                data-value="all"
            >
                全部
            </button>

            <button
                class="option"
                data-group="range"
                data-value="7"
            >
                最近7天
            </button>

            <button
                class="option"
                data-group="range"
                data-value="30"
            >
                最近30天
            </button>

            <button
                class="option"
                data-group="range"
                data-value="365"
            >
                最近1年
            </button>

            <button
                class="option"
                data-group="range"
                data-value="custom"
            >
                自定义
            </button>

        </div>

    </div>

    <div
        id="customDates"
        class="custom-dates hidden"
    >

        <div class="date-row">

            <div>

                <label>开始日期</label>

                <input
                    id="startDate"
                    type="date"
                />

            </div>

            <div>

                <label>结束日期</label>

                <input
                    id="endDate"
                    type="date"
                />

            </div>

        </div>

    </div>

    <div class="section">

        <label>媒体类型</label>

        <div class="option-row">

            <button
                class="option active"
                data-group="media"
                data-value="photo"
            >
                🖼️ 图片
            </button>

            <button
                class="option"
                data-group="media"
                data-value="video"
            >
                🎬 视频
            </button>

            <button
                class="option"
                data-group="media"
                data-value="all"
            >
                🖼️+🎬 全部
            </button>

        </div>

    </div>

    <div class="section">

        <label>帖子来源</label>

        <div class="option-row">

            <button
                class="option active"
                data-group="source"
                data-value="all"
            >
                全部
            </button>

            <button
                class="option"
                data-group="source"
                data-value="original"
            >
                原创
            </button>

            <button
                class="option"
                data-group="source"
                data-value="repost"
            >
                转帖 / 引用
            </button>

        </div>

    </div>

    <button
        id="searchButton"
        class="primary"
    >
        开始找图
    </button>

</div>

<div
    id="libraryPanel"
    class="card hidden"
>

    <div class="library-header">

        <div>

            <div
                id="libraryTitle"
                class="library-title"
            >
                ❤️ 我的喜欢
            </div>

            <div
                id="libraryCount"
                class="library-count"
            >
                正在读取……
            </div>

        </div>

        <button
            id="refreshLibrary"
            class="refresh-button"
        >
            ↻ 刷新
        </button>

    </div>

    <div class="section">

        <label>媒体类型</label>

        <div class="option-row">

            <button
                class="option active"
                data-group="libraryMedia"
                data-value="all"
            >
                全部
            </button>

            <button
                class="option"
                data-group="libraryMedia"
                data-value="image"
            >
                🖼️ 图片
            </button>

            <button
                class="option"
                data-group="libraryMedia"
                data-value="video"
            >
                🎬 视频
            </button>

        </div>

    </div>

</div>

<div
    id="statusCard"
    class="card hidden"
>

    <div
        id="status"
        class="status"
    ></div>

</div>

<div
    id="resultCard"
    class="card hidden"
>

    <div class="result-header">

        <div>

            <div
                id="resultTitle"
                class="result-title"
            >
                媒体
            </div>

            <div
                id="resultCount"
                class="result-count"
            ></div>

        </div>

    </div>

    <div
        id="gallery"
        class="gallery"
    ></div>

</div>

</div>

<div
    id="modal"
    class="modal hidden"
>

    <div class="modal-top">

        <button
            id="closeModal"
            class="modal-button"
        >
            ✕ 关闭
        </button>

    </div>

    <div
        id="modalContent"
        class="modal-content"
    ></div>

    <div class="modal-bottom">

        <button
            id="downloadButton"
            class="download"
        >
            ⬇ 下载
        </button>

        <button
            id="originalButton"
            class="original"
        >
            🔗 打开原帖
        </button>

    </div>

</div>

<script>

/* =====================================================
   DOM
===================================================== */

const profileInput =
    document.getElementById("profile");

const favoriteAdd =
    document.getElementById("favoriteAdd");

const favoriteToggle =
    document.getElementById("favoriteToggle");

const favoritesPanel =
    document.getElementById("favoritesPanel");

const searchButton =
    document.getElementById("searchButton");

const searchPanel =
    document.getElementById("searchPanel");

const libraryPanel =
    document.getElementById("libraryPanel");

const libraryTitle =
    document.getElementById("libraryTitle");

const libraryCount =
    document.getElementById("libraryCount");

const refreshLibrary =
    document.getElementById("refreshLibrary");

const statusCard =
    document.getElementById("statusCard");

const status =
    document.getElementById("status");

const resultCard =
    document.getElementById("resultCard");

const resultTitle =
    document.getElementById("resultTitle");

const resultCount =
    document.getElementById("resultCount");

const gallery =
    document.getElementById("gallery");

const customDates =
    document.getElementById("customDates");

const startDate =
    document.getElementById("startDate");

const endDate =
    document.getElementById("endDate");

const modal =
    document.getElementById("modal");

const modalContent =
    document.getElementById("modalContent");

const closeModal =
    document.getElementById("closeModal");

const downloadButton =
    document.getElementById("downloadButton");

const originalButton =
    document.getElementById("originalButton");

const modeSearch =
    document.getElementById("modeSearch");

const modeLikes =
    document.getElementById("modeLikes");

const modeBookmarks =
    document.getElementById("modeBookmarks");


/* =====================================================
   状态
===================================================== */

let currentMode = "search";

let range = "all";

let mediaType = "photo";

let sourceType = "all";

let libraryMediaType = "all";

let currentItem = null;


/* =====================================================
   API 辅助
===================================================== */

function buildDownloadUrl(
    url,
    filename
) {

    if (!url) {
        return "";
    }

    return (
        "/api/download?url=" +
        encodeURIComponent(url) +
        "&filename=" +
        encodeURIComponent(
            filename || "x-media"
        )
    );

}


function buildVideoDownloadUrl(
    url,
    filename
) {

    if (!url) {
        return "";
    }

    return (
        "/api/video-download?url=" +
        encodeURIComponent(url) +
        "&filename=" +
        encodeURIComponent(
            filename || "x-video.mp4"
        )
    );

}


/*
 * 图片预览：
 *
 * 当前后端没有独立的 media-proxy，
 * 所以这里优先使用后端 /api/download。
 *
 * 如果后端返回的是 attachment，
 * 浏览器会触发下载而不是图片显示。
 *
 * 因此这里增加第二级回退：
 * thumbnail -> 原始 URL。
 */

function getLibraryPreviewUrl(
    item
) {

    const thumbnail =
        item.thumbnail ||
        "";

    const url =
        item.url ||
        item.originalUrl ||
        "";


    /*
     * 采集器如果已经保存了 thumbnail，
     * 优先使用 thumbnail。
     */

    if (thumbnail) {

        return thumbnail;

    }


    /*
     * 没有缩略图时再使用原媒体 URL。
     */

    return url;

}


/* =====================================================
   收藏博主
===================================================== */

const FAVORITE_KEY =
    "x_media_finder_favorites_v31";


function getFavorites() {

    try {

        const data =
            localStorage.getItem(
                FAVORITE_KEY
            );

        if (!data) {
            return [];
        }

        const parsed =
            JSON.parse(data);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (e) {

        return [];

    }

}


function saveFavorites(
    favorites
) {

    localStorage.setItem(
        FAVORITE_KEY,
        JSON.stringify(
            favorites
        )
    );

}


/* =====================================================
   用户名
===================================================== */

function normalizeUsername(
    input
) {

    let value =
        input.trim();

    if (!value) {
        return null;
    }

    if (
        value.includes("x.com/") ||
        value.includes("twitter.com/")
    ) {

        if (
            !value.startsWith("http://") &&
            !value.startsWith("https://")
        ) {

            value =
                "https://" +
                value;

        }

        try {

            const url =
                new URL(value);

            const parts =
                url.pathname
                    .split("/")
                    .filter(Boolean);

            if (parts.length) {
                value = parts[0];
            }

        } catch (e) {

            return null;

        }

    }

    value =
        value.replace(
            /^@+/,
            ""
        );

    value =
        value.replace(
            /\/+$/,
            ""
        );

    value =
        value.replace(
            /[^A-Za-z0-9_]/g,
            ""
        );

    return value || null;

}


/* =====================================================
   收藏按钮
===================================================== */

function updateFavoriteButton() {

    const username =
        normalizeUsername(
            profileInput.value
        );

    if (!username) {

        favoriteAdd.textContent =
            "☆ 收藏";

        return;

    }

    const favorites =
        getFavorites();

    const exists =
        favorites.some(
            item =>
                item.username
                    .toLowerCase()
                ===
                username
                    .toLowerCase()
        );

    favoriteAdd.textContent =
        exists
            ? "★ 已收藏"
            : "☆ 收藏";

}


profileInput.addEventListener(
    "input",
    updateFavoriteButton
);


/* =====================================================
   添加 / 删除收藏
===================================================== */

favoriteAdd.addEventListener(
    "click",
    () => {

        const username =
            normalizeUsername(
                profileInput.value
            );

        if (!username) {

            showError(
                "请先输入博主名，例如 NASA 或 @NASA"
            );

            return;

        }

        const favorites =
            getFavorites();

        const index =
            favorites.findIndex(
                item =>
                    item.username
                        .toLowerCase()
                    ===
                    username
                        .toLowerCase()
            );

        if (index >= 0) {

            favorites.splice(
                index,
                1
            );

        } else {

            favorites.push({

                username:
                    username,

                name:
                    username,

                addedAt:
                    Date.now()

            });

        }

        saveFavorites(
            favorites
        );

        updateFavoriteButton();

        renderFavorites();

    }
);


/* =====================================================
   收藏列表
===================================================== */

favoriteToggle.addEventListener(
    "click",
    () => {

        favoritesPanel.classList.toggle(
            "hidden"
        );

        renderFavorites();

    }
);


function renderFavorites() {

    const favorites =
        getFavorites();

    favoritesPanel.innerHTML =
        "";

    if (!favorites.length) {

        favoritesPanel.innerHTML =
            `
            <div class="favorite-empty">
                暂时没有收藏的博主
            </div>
            `;

        return;

    }

    favorites.forEach(
        (
            favorite,
            index
        ) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "favorite-item";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "favorite-info";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "favorite-name";

            name.textContent =
                favorite.name ||
                favorite.username;


            const handle =
                document.createElement(
                    "div"
                );

            handle.className =
                "favorite-handle";

            handle.textContent =
                "@" +
                favorite.username;


            info.appendChild(name);
            info.appendChild(handle);


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "favorite-actions";


            const use =
                document.createElement(
                    "button"
                );

            use.className =
                "favorite-use";

            use.textContent =
                "查找";


            use.addEventListener(
                "click",
                () => {

                    profileInput.value =
                        favorite.username;

                    updateFavoriteButton();

                    favoritesPanel.classList.add(
                        "hidden"
                    );

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }
            );


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "favorite-delete";

            remove.textContent =
                "删除";


            remove.addEventListener(
                "click",
                () => {

                    const list =
                        getFavorites();

                    list.splice(
                        index,
                        1
                    );

                    saveFavorites(list);

                    renderFavorites();

                    updateFavoriteButton();

                }
            );


            actions.appendChild(use);
            actions.appendChild(remove);

            item.appendChild(info);
            item.appendChild(actions);

            favoritesPanel.appendChild(item);

        }
    );

}


/* =====================================================
   一级模式
===================================================== */

modeSearch.addEventListener(
    "click",
    () => setMode("search")
);

modeLikes.addEventListener(
    "click",
    () => setMode("likes")
);

modeBookmarks.addEventListener(
    "click",
    () => setMode("bookmarks")
);


function setMode(
    mode
) {

    currentMode =
        mode;

    modeSearch.classList.toggle(
        "active",
        mode === "search"
    );

    modeLikes.classList.toggle(
        "active",
        mode === "likes"
    );

    modeBookmarks.classList.toggle(
        "active",
        mode === "bookmarks"
    );


    if (mode === "search") {

        searchPanel.classList.remove(
            "hidden"
        );

        libraryPanel.classList.add(
            "hidden"
        );

        resultCard.classList.add(
            "hidden"
        );

        statusCard.classList.add(
            "hidden"
        );

        return;

    }


    searchPanel.classList.add(
        "hidden"
    );

    libraryPanel.classList.remove(
        "hidden"
    );

    statusCard.classList.add(
        "hidden"
    );

    resultCard.classList.add(
        "hidden"
    );


    libraryMediaType =
        "all";


    document
        .querySelectorAll(
            '.option[data-group="libraryMedia"]'
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.value === "all"
                );

            }
        );


    updateLibraryTitle();

    loadLibrary();

}

/* =====================================================
   选项菜单
===================================================== */

document
    .querySelectorAll(".option")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const group =
                        button.dataset.group;

                    const value =
                        button.dataset.value;


                    document
                        .querySelectorAll(
                            `.option[data-group="${group}"]`
                        )
                        .forEach(
                            b =>
                                b.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    if (group === "range") {

                        range =
                            value;

                        customDates.classList.toggle(
                            "hidden",
                            value !== "custom"
                        );

                    }


                    if (group === "media") {

                        mediaType =
                            value;

                    }


                    if (group === "source") {

                        sourceType =
                            value;

                    }


                    if (group === "libraryMedia") {

                        libraryMediaType =
                            value;

                        loadLibrary();

                    }

                }
            );

        }
    );


/* =====================================================
   日期
===================================================== */

function formatDate(
    date
) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const d =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        `${y}-${m}-${d}`
    );

}


function getDates() {

    if (range === "all") {

        return {
            start: null,
            end: null
        };

    }


    if (range === "custom") {

        return {
            start:
                startDate.value ||
                null,

            end:
                endDate.value ||
                null
        };

    }


    const now =
        new Date();

    const start =
        new Date(now);

    start.setDate(
        start.getDate()
        -
        Number(range)
    );


    return {

        start:
            formatDate(start),

        end:
            formatDate(now)

    };

}


/* =====================================================
   搜索博主
===================================================== */

searchButton.addEventListener(
    "click",
    search
);


profileInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            search();
        }

    }
);


async function search() {

    const raw =
        profileInput.value.trim();

    const username =
        normalizeUsername(raw);


    if (!username) {

        showError(
            "无法识别博主。\n\n" +
            "可以输入：\n" +
            "NASA\n" +
            "@NASA\n" +
            "x.com/NASA\n" +
            "https://x.com/NASA"
        );

        return;

    }


    const profile =
        `https://x.com/${username}`;


    const dates =
        getDates();


    if (
        dates.start &&
        dates.end &&
        dates.start > dates.end
    ) {

        showError(
            "开始日期不能晚于结束日期"
        );

        return;

    }


    searchButton.disabled =
        true;

    searchButton.textContent =
        "正在寻找媒体…";


    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status";

    status.textContent =
        `正在搜索 @${username}…`;


    resultCard.classList.add(
        "hidden"
    );

    gallery.innerHTML =
        "";


    try {

        const params =
            new URLSearchParams();


        params.set(
            "profile",
            profile
        );

        params.set(
            "media_type",
            mediaType
        );

        /*
         * 搜索博主才发送 source_type。
         */

        params.set(
            "source_type",
            sourceType
        );


        if (dates.start) {

            params.set(
                "start_date",
                dates.start
            );

        }


        if (dates.end) {

            params.set(
                "end_date",
                dates.end
            );

        }


        const response =
            await fetch(
                `/api/search?${params.toString()}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "搜索失败"
            );

        }


        renderSearchResults(data);


    } catch (error) {

        showError(
            error.message ||
            "搜索失败"
        );


    } finally {

        searchButton.disabled =
            false;

        searchButton.textContent =
            "开始找图";

    }

}


/* =====================================================
   Likes / Bookmarks 媒体库
===================================================== */

refreshLibrary.addEventListener(
    "click",
    loadLibrary
);


async function loadLibrary() {

    if (
        currentMode !== "likes" &&
        currentMode !== "bookmarks"
    ) {

        return;

    }


    updateLibraryTitle();


    libraryCount.textContent =
        "正在读取媒体库……";


    statusCard.classList.remove(
        "hidden"
    );

    status.className =
        "status";

    status.textContent =
        "正在读取服务器媒体库……";


    resultCard.classList.add(
        "hidden"
    );

    gallery.innerHTML =
        "";


    try {

        const params =
            new URLSearchParams();


        params.set(
            "source",
            currentMode
        );


        params.set(
            "media_type",
            libraryMediaType
        );


        const response =
            await fetch(
                `/api/media?${params.toString()}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "读取媒体库失败"
            );

        }


        if (!data.ok) {

            throw new Error(
                data.detail ||
                "媒体库返回异常"
            );

        }


        renderLibraryResults(data);


    } catch (error) {

        libraryCount.textContent =
            "读取失败";

        showError(
            "媒体库读取失败：\n\n" +
            (
                error.message ||
                String(error)
            )
        );

    }

}

/* =====================================================
   搜索结果
===================================================== */

function renderSearchResults(
    data
) {

    statusCard.classList.add(
        "hidden"
    );

    resultCard.classList.remove(
        "hidden"
    );


    resultTitle.textContent =
        `@${data.username}`;


    resultCount.textContent =
        `找到 ${data.count} 个媒体 · 查询 ${data.pages} 页`;


    gallery.innerHTML =
        "";


    if (
        !data.items ||
        data.items.length === 0
    ) {

        gallery.innerHTML =
            `
            <div
                class="loader"
                style="grid-column:1/-1;"
            >
                这个条件下没有找到媒体。
            </div>
            `;

        return;

    }


    data.items.forEach(
        item => {

            gallery.appendChild(
                createSearchItem(item)
            );

        }
    );

}

/* =====================================================
   日期
===================================================== */

function formatDateFromX(
    value
) {

    if (!value) {
        return "";
    }


    const match =
        value.match(
            /^\w+\s+(\w+)\s+(\d+).*?(\d{4})$/
        );


    if (!match) {
        return value;
    }


    const months = {

        Jan: "01",
        Feb: "02",
        Mar: "03",
        Apr: "04",
        May: "05",
        Jun: "06",
        Jul: "07",
        Aug: "08",
        Sep: "09",
        Oct: "10",
        Nov: "11",
        Dec: "12"

    };


    const month =
        months[match[1]];


    if (!month) {
        return value;
    }


    return (
        `${match[3]}-` +
        `${month}-` +
        `${String(match[2]).padStart(2,"0")}`
    );

}


/* =====================================================
   文件名
===================================================== */

function getFilename(
    item
) {

    let date =
        formatDateFromX(
            item.created_at ||
            item.createdAt
        );


    if (!date) {
        date = "x-media";
    }


    let suffix = "";


    if (
        item.media_total &&
        item.media_total > 1
    ) {

        suffix =
            `-${item.media_index}`;

    }


    let extension =
        ".jpg";


    const type =
        item.media_type ||
        item.type;


    if (type === "video") {

        extension =
            ".mp4";

    } else {

        const url =
            item.originalUrl ||
            item.media_url ||
            item.url ||
            "";


        const lower =
            url.toLowerCase();


        if (lower.includes(".png")) {

            extension =
                ".png";

        } else if (lower.includes(".webp")) {

            extension =
                ".webp";

        } else if (lower.includes(".gif")) {

            extension =
                ".gif";

        }

    }


    return (
        `${date}${suffix}${extension}`
    );

}


/* =====================================================
   搜索媒体卡片
===================================================== */

function createSearchItem(
    item
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "item";


    const mediaWrap =
        document.createElement("div");

    mediaWrap.className =
        "media-wrap";


    const img =
        document.createElement("img");


    if (item.media_type === "video") {

        img.src =
            item.thumbnail ||
            "";

    } else {

        img.src =
            item.media_url ||
            "";

    }


    img.loading =
        "lazy";


    img.alt =
        item.alt ||
        "";


    img.onerror =
        () => {

            replaceBrokenMedia(
                img,
                mediaWrap
            );

        };


    img.addEventListener(
        "click",
        () => openModal(item)
    );


    mediaWrap.appendChild(img);


    if (
        item.media_type === "video"
    ) {

        const badge =
            document.createElement("div");

        badge.className =
            "video-badge";

        badge.textContent =
            "▶ 视频";

        mediaWrap.appendChild(badge);

    }


    if (
        item.source &&
        item.source !== "original"
    ) {

        const source =
            document.createElement("div");

        source.className =
            "source-badge";

        source.textContent =
            item.source === "repost"
                ? "转帖"
                : "引用";

        mediaWrap.appendChild(source);

    }


    wrapper.appendChild(
        mediaWrap
    );


    const info =
        document.createElement("div");

    info.className =
        "item-info";


    const date =
        document.createElement("div");

    date.className =
        "item-date";

    date.textContent =
        formatDateFromX(
            item.created_at
        );


    info.appendChild(date);


    const actions =
        document.createElement("div");

    actions.className =
        "item-actions";


    const view =
        document.createElement("button");

    view.className =
        "small-btn";

    view.textContent =
        item.media_type === "video"
            ? "▶ 播放"
            : "查看大图";

    view.onclick =
        () => openModal(item);


    const download =
        document.createElement("button");

    download.className =
        "small-btn";

    download.textContent =
        item.media_type === "video"
            ? "⬇ 下载视频"
            : "⬇ 下载原图";

    download.onclick =
        () => downloadItem(item);


    const post =
        document.createElement("button");

    post.className =
        "small-btn";

    post.textContent =
        "原帖";


    post.onclick =
        () => {

            if (item.tweet_url) {

                window.open(
                    item.tweet_url,
                    "_blank"
                );

            }

        };


    actions.appendChild(view);
    actions.appendChild(download);
    actions.appendChild(post);

    info.appendChild(actions);

    wrapper.appendChild(info);

    return wrapper;

}


/* =====================================================
   Likes / Bookmarks 媒体卡片
===================================================== */

function createLibraryItem(
    item
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "item";


    const mediaWrap =
        document.createElement("div");

    mediaWrap.className =
        "media-wrap";


    const isVideo =
        item.type === "video" ||
        item.media_type === "video";


    const mediaUrl =
        item.url ||
        item.originalUrl ||
        "";


    const thumbnail =
        item.thumbnail ||
        "";


    /*
     * 图片：
     *
     * 优先 thumbnail。
     *
     * 没有 thumbnail 才使用 url。
     */

    const displayUrl =
        isVideo
            ? thumbnail || mediaUrl
            : thumbnail || mediaUrl;


    const img =
        document.createElement("img");


    img.src =
        displayUrl;


    img.loading =
        "lazy";


    img.alt =
        "";


    /*
     * 防止蓝色问号。
     */

    img.onerror =
        () => {

            replaceBrokenMedia(
                img,
                mediaWrap
            );

        };


    const normalized =
        normalizeLibraryItem(item);


    img.addEventListener(
        "click",
        () => openModal(normalized)
    );


    mediaWrap.appendChild(img);


    if (isVideo) {

        const badge =
            document.createElement("div");

        badge.className =
            "video-badge";

        badge.textContent =
            "▶ 视频";

        mediaWrap.appendChild(badge);

    }


    /*
     * Likes / Bookmarks：
     * 永远不显示原创 / 转帖。
     */

    const libraryBadge =
        document.createElement("div");

    libraryBadge.className =
        "library-badge";

    libraryBadge.textContent =
        currentMode === "likes"
            ? "❤️ 喜欢"
            : "🔖 书签";

    mediaWrap.appendChild(
        libraryBadge
    );


    wrapper.appendChild(
        mediaWrap
    );


    const info =
        document.createElement("div");

    info.className =
        "item-info";


    if (item.author) {

        const author =
            document.createElement("div");

        author.className =
            "item-author";

        author.textContent =
            "@" +
            item.author;

        info.appendChild(author);

    }


    const date =
        document.createElement("div");

    date.className =
        "item-date";

    date.textContent =
        formatLibraryDate(
            item.createdAt
        );

    info.appendChild(date);


    const actions =
        document.createElement("div");

    actions.className =
        "item-actions";


    const view =
        document.createElement("button");

    view.className =
        "small-btn";

    view.textContent =
        isVideo
            ? "▶ 播放"
            : "查看大图";


    view.onclick =
        () => openModal(normalized);


    const download =
        document.createElement("button");

    download.className =
        "small-btn";

    download.textContent =
        isVideo
            ? "⬇ 下载视频"
            : "⬇ 下载原图";


    download.onclick =
        () => downloadItem(normalized);


    const post =
        document.createElement("button");

    post.className =
        "small-btn";

    post.textContent =
        "原帖";


    post.onclick =
        () => {

            if (item.tweet_url) {

                window.open(
                    item.tweet_url,
                    "_blank"
                );

            }

        };


    actions.appendChild(view);
    actions.appendChild(download);
    actions.appendChild(post);

    info.appendChild(actions);

    wrapper.appendChild(info);

    return wrapper;

}


/* =====================================================
   图片加载失败处理
===================================================== */

function replaceBrokenMedia(
    img,
    mediaWrap
) {

    if (
        !img ||
        !mediaWrap
    ) {

        return;

    }


    /*
     * 防止 onerror 无限循环。
     */

    img.onerror =
        null;


    img.style.display =
        "none";


    /*
     * 如果已经存在错误提示，
     * 不重复添加。
     */

    if (
        mediaWrap.querySelector(
            ".media-error"
        )
    ) {

        return;

    }


    const error =
        document.createElement("div");

    error.className =
        "media-error";

    error.textContent =
        "媒体暂时无法加载";


    mediaWrap.insertBefore(
        error,
        img
    );

}


/* =====================================================
   媒体库数据转换
===================================================== */

function normalizeLibraryItem(
    item
) {

    const isVideo =
        item.type === "video" ||
        item.media_type === "video";


    const mediaUrl =
        item.url ||
        item.originalUrl ||
        "";


    const thumbnail =
        item.thumbnail ||
        "";


    return {

        media_type:
            isVideo
                ? "video"
                : "photo",

        media_url:
            mediaUrl,

        video_url:
            isVideo
                ? mediaUrl
                : "",

        thumbnail:
            thumbnail,

        tweet_url:
            item.tweet_url ||
            "",

        author:
            item.author ||
            "",

        created_at:
            item.createdAt ||
            "",

        originalUrl:
            item.originalUrl ||
            mediaUrl ||
            "",

        libraryId:
            item.id ||
            "",

        libraryItem:
            true

    };

}


/* =====================================================
   媒体库日期
===================================================== */

function formatLibraryDate(
    value
) {

    if (!value) {
        return "";
    }


    try {

        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";

        }


        return (
            date.getFullYear() +
            "-" +
            String(
                date.getMonth() + 1
            ).padStart(2,"0") +
            "-" +
            String(
                date.getDate()
            ).padStart(2,"0")
        );

    } catch (e) {

        return "";

    }

}


/* =====================================================
   下载
===================================================== */

function downloadItem(
    item
) {

    const url =
        item.media_url ||
        item.url ||
        item.originalUrl ||
        "";


    if (!url) {

        alert(
            "这个媒体暂时没有可下载地址。"
        );

        return;

    }


    const isVideo =
        item.media_type === "video" ||
        item.type === "video";


    const filename =
        getFilename(item);


    /*
     * 视频：
     * 使用后端现有的视频转换接口。
     */

    if (isVideo) {

        const videoFilename =
            filename.endsWith(".mp4")
                ? filename
                : filename + ".mp4";


        window.location.href =
            buildVideoDownloadUrl(
                url,
                videoFilename
            );

        return;

    }


    /*
     * 图片：
     * 使用后端现有下载接口。
     */

    window.location.href =
        buildDownloadUrl(
            url,
            filename
        );

}


/* =====================================================
   Modal
===================================================== */

function openModal(
    item
) {

    currentItem =
        item;


    modalContent.innerHTML =
        "";


    const isVideo =
        item.media_type === "video" ||
        item.type === "video";


    if (isVideo) {

        /*
         * 视频优先使用 video_url。
         *
         * 如果采集器保存的是 M3U8，
         * 浏览器原生 video 可能无法直接播放。
         *
         * 此时仍然保留原始 URL，
         * 下载按钮走 /api/video-download。
         */

        const video =
            document.createElement("video");


        video.src =
            item.video_url ||
            item.media_url ||
            item.url ||
            "";


        if (item.thumbnail) {

            video.poster =
                item.thumbnail;

        }


        video.controls =
            true;

        video.autoplay =
            true;

        video.playsInline =
            true;


        video.onerror =
            () => {

                const message =
                    document.createElement("div");

                message.style.color =
                    "#fff";

                message.style.textAlign =
                    "center";

                message.style.padding =
                    "20px";

                message.textContent =
                    "这个视频格式无法直接在浏览器播放，请使用“下载视频”。";


                modalContent.innerHTML =
                    "";

                modalContent.appendChild(
                    message
                );

            };


        modalContent.appendChild(
            video
        );


        downloadButton.textContent =
            "⬇ 下载视频";


    } else {

        const img =
            document.createElement("img");


        /*
         * Modal 中优先使用 originalUrl。
         */

        img.src =
            item.originalUrl ||
            item.media_url ||
            item.url ||
            "";


        img.alt =
            item.alt ||
            "";


        img.onerror =
            () => {

                /*
                 * 如果原图打不开，
                 * 尝试缩略图。
                 */

                if (
                    item.thumbnail &&
                    img.src !== item.thumbnail
                ) {

                    img.onerror =
                        () => {

                            replaceBrokenMedia(
                                img,
                                modalContent
                            );

                        };


                    img.src =
                        item.thumbnail;

                    return;

                }


                replaceBrokenMedia(
                    img,
                    modalContent
                );

            };


        modalContent.appendChild(
            img
        );


        downloadButton.textContent =
            "⬇ 下载原图";

    }


    modal.classList.remove(
        "hidden"
    );

}


/* =====================================================
   Modal 关闭
===================================================== */

closeModal.addEventListener(
    "click",
    closeModalWindow
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            closeModalWindow();

        }

    }
);


function closeModalWindow() {

    modal.classList.add(
        "hidden"
    );

    modalContent.innerHTML =
        "";

    currentItem =
        null;

}


/* =====================================================
   Modal 下载
===================================================== */

downloadButton.addEventListener(
    "click",
    () => {

        if (!currentItem) {
            return;
        }


        downloadItem(
            currentItem
        );

    }
);


/* =====================================================
   Modal 原帖
===================================================== */

originalButton.addEventListener(
    "click",
    () => {

        if (
            !currentItem
        ) {

            return;

        }


        if (
            currentItem.tweet_url
        ) {

            window.open(
                currentItem.tweet_url,
                "_blank"
            );

        }

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeModalWindow();

        }

    }
);


/* =====================================================
   初始化
===================================================== */

renderFavorites();

updateFavoriteButton();

setMode("search");

</script>
