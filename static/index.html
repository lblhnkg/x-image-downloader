<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>万能媒体下载器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(145deg, #141414 0%, #1a1a1a 100%);
            border-radius: 32px;
            padding: 40px 28px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            min-height: 560px;
        }
        .hidden { display: none !important; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .app-title { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; text-align: center; color: #fff; margin-bottom: 6px; }
        .login-divider { border: 0; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent); margin: 28px 0 32px; }
        .login-section-title { font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.4); text-align: center; margin-bottom: 16px; }
        .login-input-group { margin-bottom: 18px; }
        .login-input-group input {
            width: 100%;
            background: transparent;
            border: 0;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding: 12px 0 8px;
            font-size: 17px;
            color: #fff;
            outline: none;
            transition: border-color 0.25s ease;
            font-family: inherit;
        }
        .login-input-group input::placeholder { color: rgba(255,255,255,0.25); font-weight: 300; }
        .login-input-group input:focus { border-bottom-color: rgba(255,255,255,0.6); }

        .login-btn {
            width: 100%;
            padding: 14px 0;
            background: #fff;
            color: #0a0a0a;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 6px;
        }
        .login-btn:hover { opacity: 0.85; transform: scale(0.98); }
        .login-btn:active { transform: scale(0.96); }
        .login-guest-btn {
            width: 100%;
            padding: 14px 0;
            background: transparent;
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 10px;
        }
        .login-guest-btn:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); color: #fff; }
        .login-guest-btn:active { transform: scale(0.98); }
        .login-error { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 10px; min-height: 20px; }
        .login-footer-text {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            line-height: 1.7;
            margin-top: 22px;
            padding: 0 4px;
        }
        .login-footer-text .small-note { display: block; margin-top: 4px; font-size: 11px; color: rgba(255,255,255,0.2); }
        .login-dev-signature {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.15);
            margin-top: 32px;
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 18px;
        }
        .menu-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 22px 24px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .menu-card:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.12); transform: translateY(-1px); }
        .menu-card:active { transform: scale(0.98); }
        .menu-card-title { font-size: 18px; font-weight: 500; color: #fff; }
        .menu-card-desc { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 4px; font-weight: 300; }
        .menu-card .menu-arrow { float: right; color: rgba(255,255,255,0.2); font-size: 18px; margin-top: 2px; }

        @media (min-width: 700px) {
            .app-container { max-width: 600px; padding: 50px 40px 40px; border-radius: 36px; }
            .menu-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
            .menu-card { padding: 28px 24px; min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
        }
        @media (max-width: 420px) {
            .app-container { padding: 28px 18px 22px; border-radius: 24px; }
            .app-title { font-size: 22px; }
            .menu-card { padding: 18px 18px; }
            .menu-card-title { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- =====================================================
    登录页
    ===================================================== -->
    <div class="page active" id="pageLogin">
        <div class="app-title">万能媒体下载器</div>
        <hr class="login-divider">
        <div class="login-section-title">开发者通道</div>
        <div class="login-input-group">
            <input type="password" id="loginPassword" placeholder="密码" autocomplete="off">
        </div>
        <button class="login-btn" id="loginBtn">进入</button>
        <div id="loginError" class="login-error"></div>
        <div class="login-section-title" style="margin-top:24px;margin-bottom:12px;">— 或 —</div>
        <button class="login-guest-btn" id="guestBtn">以访客身份浏览</button>
        <div class="login-footer-text">
            访客数据仅保存在本地浏览器中
            <span class="small-note">清除缓存后数据将丢失</span>
            <span class="small-note" style="margin-top:6px;">“我的喜欢”和“我的书签”需搭配采集器使用</span>
        </div>
        <div class="login-dev-signature">开发者：浮生若夢</div>
    </div>

    <!-- =====================================================
    一级菜单
    ===================================================== -->
    <div class="page" id="pageMenu">
        <div class="app-title" style="font-size:22px;margin-bottom:4px;">万能媒体下载器</div>
        <div class="menu-grid">
            <div class="menu-card" id="menuX">
                <span class="menu-arrow">›</span>
                <div class="menu-card-title">下载 X 上的媒体</div>
                <div class="menu-card-desc">图片 · 视频 · 喜欢 · 书签</div>
            </div>
            <div class="menu-card" id="menuMissav">
                <span class="menu-arrow">›</span>
                <div class="menu-card-title">下载 Missav 上的电影</div>
                <div class="menu-card-desc">番号 · 演员 · 高清</div>
            </div>
            <div class="menu-card" id="menuBilibili">
                <span class="menu-arrow">›</span>
                <div class="menu-card-title">下载 Bilibili 视频</div>
                <div class="menu-card-desc">即将上线</div>
            </div>
        </div>
        <div class="login-dev-signature" style="margin-top:32px;">开发者：浮生若夢</div>
    </div>
</div>

<script>
    // ============================================================
    // 完整登录逻辑（开发者 / 访客模式）
    // ============================================================

    const pageLogin = document.getElementById('pageLogin');
    const pageMenu = document.getElementById('pageMenu');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const guestBtn = document.getElementById('guestBtn');

    let currentMode = 'guest'; // 'developer' 或 'guest'

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    // ============================================================
    // 开发者登录
    // ============================================================
    function handleLogin() {
        const password = loginPassword.value.trim();
        if (!password) {
            loginError.textContent = '请输入密码';
            return;
        }
        loginError.textContent = '';
        loginBtn.disabled = true;
        loginBtn.textContent = '登录中…';

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password }),
            credentials: 'include'
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                currentMode = 'developer';
                // 登录成功，跳转到菜单
                showPage('pageMenu');
                loginPassword.value = '';
                // 通知各页面当前模式（通过 localStorage 传递）
                localStorage.setItem('userMode', 'developer');
            } else {
                loginError.textContent = data.detail || '密码错误';
            }
        })
        .catch(() => {
            loginError.textContent = '连接服务器失败，请稍后重试';
        })
        .finally(() => {
            loginBtn.disabled = false;
            loginBtn.textContent = '进入';
        });
    }

    loginBtn.addEventListener('click', handleLogin);
    loginPassword.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleLogin();
    });

    // ============================================================
    // 访客模式
    // ============================================================
    let guestTipShown = false;

    guestBtn.addEventListener('click', function() {
        currentMode = 'guest';
        localStorage.setItem('userMode', 'guest');
        // 清除可能残留的 session cookie（访客模式不用）
        document.cookie = 'session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        showPage('pageMenu');
        // 显示访客提示（如果没显示过）
        if (!guestTipShown) {
            // 用简单的 alert 代替弹窗（保持轻量）
            // 但为了更好体验，可以用一个简单的 div 提示
            // 这里使用 alert 作为最简实现
            // 你也可以自行扩展为弹窗
            // alert('📌 访客模式\n数据仅保存在本地浏览器中\n\n我的喜欢/书签需搭配采集器使用');
            // 为了保持原有风格，我们用更优雅的方式：在页面顶部显示一个小横幅
            showGuestBanner();
            guestTipShown = true;
        }
    });

    function showGuestBanner() {
        const existing = document.querySelector('.guest-banner');
        if (existing) return;
        const banner = document.createElement('div');
        banner.className = 'guest-banner';
        banner.style.cssText = `
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            color: rgba(255,215,0,0.6);
            text-align: center;
            font-weight: 300;
        `;
        banner.innerHTML = '📌 访客模式 · 数据仅保存在本地浏览器中';
        const menuGrid = document.querySelector('.menu-grid');
        if (menuGrid) {
            menuGrid.parentNode.insertBefore(banner, menuGrid);
        }
    }

    // ============================================================
    // 菜单跳转（保留模式信息）
    // ============================================================
    document.getElementById('menuX').addEventListener('click', function() {
        // 把模式信息带到 X 页面（通过 URL 参数或 localStorage）
        window.location.href = '/x';
    });

    document.getElementById('menuMissav').addEventListener('click', function() {
        window.location.href = '/missav';
    });

    document.getElementById('menuBilibili').addEventListener('click', function() {
        window.location.href = '/bilibili';
    });

    // ============================================================
    // 初始化：检测是否已登录
    // ============================================================
    fetch('/api/auth/check', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
            if (data.authenticated) {
                currentMode = 'developer';
                localStorage.setItem('userMode', 'developer');
                showPage('pageMenu');
            } else {
                // 检查 localStorage 是否有访客模式记录
                const savedMode = localStorage.getItem('userMode');
                if (savedMode === 'guest') {
                    currentMode = 'guest';
                    showPage('pageMenu');
                    if (!guestTipShown) {
                        showGuestBanner();
                        guestTipShown = true;
                    }
                }
                // 否则停留在登录页
            }
        })
        .catch(() => {
            // 网络错误，保持在登录页
        });

    console.log('📱 万能媒体下载器 已加载');
    console.log('开发者：浮生若夢');
    console.log('当前模式：' + (localStorage.getItem('userMode') || '未登录'));
</script>

</body>
</html>
